        views: { type: integer }
        reactions: { type: object, additionalProperties: { type: integer } }
        timestamp: { type: string, format: date-time }
    LabelUpdatedEvent:
      type: object
      description: Dados de `label.updated`.
      properties:
        kind: { type: string, enum: [edit, chat, message] }
        label_id: { type: string }
        name: { type: string }
