  /v1/instances/{id}/events:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Eventos em tempo real]
      operationId: instanceEvents
      x-litezap-sample: { sse: true, query: { types: "message.*,instance.status" } }
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      x-litezap-notes: "Sem replay: para não perder eventos, use webhooks."
      summary: Stream da instância
      x-litezap-scope: instancia
      description: |
        Server-Sent Events com os eventos de uma instância. Cada evento sai como `id`, `event` (tipo) e
        `data` (o envelope JSON). A cada 15 segundos vai um comentário `: ping`. Não há replay
        (`Last-Event-ID` é ignorado). Um cliente mais de 256 eventos atrasado recebe `event: error`
        (`slow_consumer`) e é desconectado: reconecte. O token é checado só na conexão.
      parameters:
        - $ref: "#/components/parameters/EventTypes"
      responses:
        "200":
          description: Stream `text/event-stream`, aberto até o cliente sair.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 3000
                : connected

                id: evt_5f2c9a1b7d3e4f60
                event: message.received
                data: {"id":"evt_5f2c9a1b7d3e4f60","type":"message.received","version":1,"instance_id":"inst_7f3a9c2e5b1d4086","timestamp":"2026-10-17T13:45:00.123Z","data":{"id":"msg_e29d4b8a0f6c1357","chat":"5511999999999@s.whatsapp.net","from_me":false,"source":"contact","type":"text","text":"Oi!","timestamp":"2026-10-17T13:45:00Z"}}

                : ping
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/events:
    get:
      tags: [Eventos em tempo real]
      operationId: allEvents
      x-litezap-sample: { sse: true }
      x-litezap-milestone: M3
