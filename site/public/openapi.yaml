          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 3000
                : connected

                id: evt_0a7d3c9e1f5b2486
                event: instance.status
                data: {"id":"evt_0a7d3c9e1f5b2486","type":"instance.status","version":1,"instance_id":"inst_7f3a9c2e5b1d4086","timestamp":"2026-10-17T13:40:02.511Z","data":{"state":"connected"}}
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /mcp:
    post:
      tags: [MCP]
      operationId: mcpEndpoint
      x-litezap-milestone: M4
      x-zapi: "MCP Server"
      x-litezap-sample: { headers: { Accept: "application/json, text/event-stream" } }
      summary: Endpoint MCP
      x-litezap-scope: instancia
      description: |
        Endpoint MCP (streamable HTTP, *stateless*: sem `Mcp-Session-Id`, cada requisição é autenticada de novo)
        com o mesmo `Authorization: Bearer` da API. Com token de instância, as ferramentas operam só naquela
        instância. O corpo é uma mensagem JSON-RPC do protocolo MCP (`initialize`, `tools/list`,
        `tools/call`...); o cliente precisa aceitar `application/json` e `text/event-stream`.

        Num `listen_addr` de loopback, pedidos com `Host` que não é loopback são recusados (proteção contra DNS
        rebinding), exceto o host de `public_url`, para um proxy reverso na mesma máquina. Clientes na nuvem
        (ChatGPT, OpenAI) precisam do servidor publicado com TLS. Para clientes locais que iniciam um processo,
        use `litezap mcp` (stdio).
      x-litezap-notes: "Todo envio feito pelo assistente passa pela mesma fila (ritmo, rampa, janela). Prefira clientes que pedem aprovação antes de enviar: mensagens de terceiros podem conter prompt injection."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Mensagem JSON-RPC 2.0 do protocolo MCP. }
            example: { jsonrpc: "2.0", id: 1, method: "tools/list" }
      responses:
        "200":
          description: Resposta JSON-RPC (a lista de ferramentas, no exemplo).
          content:
            application/json:
              example: { jsonrpc: "2.0", id: 1, result: { tools: [ { name: list_instances, description: "..." }, { name: send_message, description: "..." } ] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

