        "202": { description: Na fila., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{id}/status/{msg_id}/reply:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - { name: msg_id, in: path, required: true, schema: { type: string }, description: "Id do LiteZap (ou wa_message_id) do status do contato." }
    post:
      tags: [Status]
      operationId: replyStatus
      x-litezap-milestone: M10
      x-zapi: "Responder status com texto / com GIF / com figurinha"
      x-litezap-events: [message.sent]
      summary: Responder status
      x-litezap-scope: instancia
      description: |
        Responde em particular o autor de um status recebido, citando o status (como responder pelo app): texto
        (padrão), GIF (`type: gif`, MP4 em loop, com `caption` opcional) ou figurinha (`type: sticker`, WebP até
        1MB). A mídia vem por `media.url` ou `media.base64`, com as mesmas regras de `POST /messages`. Vai pela
        fila; aceita `?wait=true`. GIF e figurinha: v0.1.1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [text, gif, sticker], default: text }
                text: { type: string, description: "Obrigatório em `text`." }
                caption: { type: string, description: "Legenda do GIF (opcional)." }
                media: { $ref: "#/components/schemas/MediaInput" }
                client_message_id: { type: string }
            examples:
              text: { value: { text: "Que lindo!" } }
              gif: { value: { type: gif, caption: "kkkk", media: { url: "https://exemplo.com/risada.mp4" } } }
              sticker: { value: { type: sticker, media: { url: "https://exemplo.com/figurinha.webp" } } }
      responses:
        "200": { description: Enviada., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "202": { description: Na fila., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

