        chat: { type: string }
        wa_message_id: { type: string }
        labeled: { type: boolean }
        source: { type: string, enum: [api, device] }
        timestamp: { type: string, format: date-time }
    AgentHook:
      type: object
      properties:
        configured: { type: boolean }
        target: { type: string, enum: [url, builtin, agents], description: "url: POST assinado para `url`; builtin: Atendente LiteZap embutido; agents: Agentes LiteZap (aba Agentes)." }
        url: { type: string }
        enabled: { type: boolean }
        timeout: { type: string, example: 30s }
        context_messages: { type: integer }
        groups_enabled: { type: boolean }
        human_pause: { type: string, example: 30m0s }
        pause_on_api_send: { type: boolean }
        ignore: { type: array, items: { type: string } }
        max_replies_per_window: { type: integer }
        reply_window: { type: string }
        secret_set: { type: boolean }
        secret: { type: string, description: Só quando acabou de ser gerado. }
    AgentHookPatch:
      type: object
