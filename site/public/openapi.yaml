        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/GroupForbidden" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }

