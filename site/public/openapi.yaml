      x-related: [message.received]
      x-fields:
        - [chat, string, "JID do grupo."]
        - [kind, string, "Tipo da mudança."]
        - [actor, string, "Quem fez a mudança (opcional)."]
        - [participants, array, "Participantes afetados (participants_*, join_request)."]
        - [reason, string, "participants_added/joined: invite quando por link (opcional)."]
