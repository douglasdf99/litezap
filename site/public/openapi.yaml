  /v1/instances/{id}/check-numbers:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Números]
      operationId: checkNumbers
      x-litezap-milestone: M2
      x-zapi: "Número com WhatsApp / Validação em lote"
      x-litezap-notes: "Consultas em massa de números são um padrão de risco; por isso as cotas são baixas de propósito."
      summary: Verificar números
      x-litezap-scope: instancia
      description: |
        Diz quais números têm WhatsApp e devolve o `jid` que o WhatsApp usa (no Brasil, com ou sem o 9º
        dígito). De 1 a 10 números por chamada (10 a 15 dígitos com DDI). Resultados ficam em cache
        (30 dias para quem tem, 24h para quem não tem). Consultas não cacheadas: até 10 por minuto e
        200 por dia (UTC) por instância; acima disso `429 rate_limited`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
            example: { phones: ["5511999999999", "5511888888888"] }
      responses:
        "200":
          description: Resultado por número.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/NumberResult" }
              example:
                results:
                  - { phone: "5511999999999", exists: true, jid: "5511999999999@s.whatsapp.net" }
                  - { phone: "5511888888888", exists: false }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /v1/instances/{id}/media/{media_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - $ref: "#/components/parameters/MediaID"
    get:
      tags: [Mídia]
      operationId: getMedia
      x-litezap-sample: { binary: arquivo }
      x-litezap-milestone: M2
      x-zapi: "(mídia chega por URL no webhook)"
      x-litezap-notes: "Mídia antiga pode não estar mais disponível no WhatsApp (410)."
      summary: Baixar mídia recebida
      x-litezap-scope: instancia
      description: |
        Baixa a mídia de uma mensagem recebida (`media.id` no log). Na primeira vez o worker baixa do
        WhatsApp e o arquivo fica em `data/media/`. Com `?signed=1` devolve uma URL assinada que vale 1h
        sem token, para repassar a terceiros. Fora de loopback, `?signed=1` exige `public_url`
        (`409 conflict`). A resposta leva `X-Content-Type-Options: nosniff`, CSP `sandbox` e
        `Content-Disposition` (`inline` só para JPEG/PNG/WebP/GIF, áudio e vídeo).
      parameters:
        - name: signed
          in: query
          description: "`1` devolve `{url, expires_at}` em vez do arquivo."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: O arquivo, ou a URL assinada com `?signed=1`.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/SignedURL" }
              example:
                url: "https://api.seu-dominio.com/media/inst_7f3a9c2e5b1d4086/med_5b8e1f3c9d2a7046?exp=1792252800&sig=9f86d081884c7d65"
                expires_at: "2026-10-17T14:52:10Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SignedDisabled" }
        "410": { $ref: "#/components/responses/MediaUnavailable" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /media/{id}/{media_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - $ref: "#/components/parameters/MediaID"
    get:
      tags: [Mídia]
      operationId: getSignedMedia
      x-litezap-sample: { query: { exp: "1792252800", sig: 9f86d081884c7d65 }, binary: arquivo }
      x-litezap-milestone: M2
      x-zapi: "(sem equivalente)"
      summary: Mídia por URL assinada
      x-litezap-scope: assinatura
      security: []
      description: Rota fora de `/v1`, sem token. A assinatura HMAC-SHA256 (segredo em `data/media_key`) é a credencial. Apagar `data/media_key` invalida todas as URLs já emitidas.
      parameters:
        - { name: exp, in: query, required: true, description: Expiração (unix)., schema: { type: string } }
        - { name: sig, in: query, required: true, description: Assinatura., schema: { type: string } }
      responses:
        "200":
          description: O arquivo.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: "`forbidden`: URL inválida ou expirada."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: forbidden, message: "invalid or expired media URL", retryable: false } }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/MediaUnavailable" }

  /v1/instances/{id}/agent-hook:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: getAgentHook
      x-litezap-milestone: M5
      summary: Ler hook de agente
      x-litezap-scope: instancia
      description: "Configuração do hook (o segredo nunca volta; `secret_set` diz se existe). Sem configuração, devolve os padrões com `configured: false`."
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    put:
      tags: [Atendente IA]
      operationId: putAgentHook
      x-litezap-milestone: M5
      summary: Configurar hook de agente
      x-litezap-scope: instancia
      x-litezap-events: [agent.failed, agent.handoff, agent.lead, agent.appointment_requested, agent.order_draft]
      description: |
        Atualização parcial (cria se não existir). `target: "builtin"` usa o Atendente LiteZap embutido (sem
        URL); `target: "url"` (padrão) faz um `POST` assinado para `url`. Um `secret` ausente é gerado e
        aparece só nesta resposta. Campos desconhecidos são recusados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHookPatch" }
            examples:
              embutido: { summary: Atendente LiteZap, value: { target: builtin, enabled: true } }
              externo: { summary: Agente externo, value: { target: url, url: "https://meu-agente.exemplo.com/litezap", enabled: true } }
      responses:
        "200":
          description: Configuração salva (`secret` só quando acabou de ser gerado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHook" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    delete:
      tags: [Atendente IA]
      operationId: deleteAgentHook
      x-litezap-milestone: M5
      summary: Remover hook de agente
      x-litezap-scope: instancia
      description: Remove a configuração (o atendente para); as regras por conversa continuam.
      responses:
        "204": { description: Removido. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/chats/{jid}/agent:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }, { $ref: "#/components/parameters/ChatJID" }]
    put:
      tags: [Atendente IA]
      operationId: putChatAgent
      x-litezap-milestone: M5
      summary: Ligar ou desligar o atendente numa conversa
      x-litezap-scope: instancia
      description: '`{"enabled": true | false | null}`; `null` herda o padrão da instância. `true` e `null` também encerram uma pausa (após handoff ou resposta humana).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: [boolean, "null"] } } }
            example: { enabled: false }
      responses:
        "200":
          description: Estado do atendente na conversa.
          content:
            application/json:
              schema: { type: object, properties: { jid: { type: string }, name: { type: string }, is_group: { type: boolean }, enabled: { type: [boolean, "null"] }, paused_until: { type: string, format: date-time } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/agent-hook/calls:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: listAgentCalls
      x-litezap-milestone: M5
      summary: Últimas chamadas do atendente
      x-litezap-scope: instancia
      description: "Log das chamadas (`ok`, `failed`, `skipped`, `discarded`, `paused`), com motivo e duração. Motivos do embutido: `not_configured`, `daily_cap`, `llm_error`, `invalid_response`."
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Chamadas, mais recente primeiro.
          content:
            application/json:
              schema: { type: object, properties: { calls: { type: array, items: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/ai/presets:
    get:
      tags: [Atendente IA]
      operationId: listAIPresets
      x-litezap-milestone: A2
      summary: Provedores de IA grátis
      x-litezap-scope: admin
      description: |
        Os presets grátis (`ollama`, `gemini_free`, `groq_free`): servidor OpenAI-compatível, modelo padrão,
        alternativas, se precisa de chave (grátis) e onde pegá-la, e expectativas honestas de qualidade,
        velocidade e privacidade. Use o `id` em `preset` no `PUT /v1/instances/{id}/attendant`.
      responses:
        "200":
          description: Lista de presets.
          content:
            application/json:
              schema: { type: object, properties: { presets: { type: array, items: { $ref: "#/components/schemas/AIProviderPreset" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/ai/local:
    get:
      tags: [Atendente IA]
      operationId: getLocalAI
      x-litezap-milestone: A2
      summary: Ollama neste computador
      x-litezap-scope: admin
      description: |
        Verifica o Ollama em `127.0.0.1:11434` (endereço fixo, nunca vem da requisição): se responde, a
        versão, os modelos instalados (`/api/tags`), a memória do computador e o modelo recomendado para ela
        (`qwen2.5:7b` com 8 GB de RAM ou mais, `llama3.2:3b` abaixo disso). O LiteZap não instala o Ollama:
        `download_url` leva à página oficial.
      responses:
        "200":
          description: Estado do Ollama local.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalAIStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/ai/local/pull:
    get:
      tags: [Atendente IA]
      operationId: getLocalAIPull
      x-litezap-milestone: A2
      summary: Progresso do download do modelo
      x-litezap-scope: admin
      description: Progresso do download em andamento (ou do último); consulte a cada 1 a 2 segundos.
      responses:
        "200":
          description: Progresso (`pull` é null quando nenhum download foi feito).
          content:
            application/json:
              schema: { type: object, properties: { pull: { $ref: "#/components/schemas/LocalAIPull" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Atendente IA]
      operationId: startLocalAIPull
      x-litezap-milestone: A2
      summary: Baixar um modelo no Ollama
      x-litezap-scope: admin
      description: |
        Começa `ollama pull` pela API HTTP do Ollama local (`POST /api/pull`, em streaming) e volta na hora;
        acompanhe por `GET /v1/ai/local/pull`. Um download por vez. `model` é um nome da biblioteca do
        Ollama (`qwen2.5:7b`, `llama3.2:3b`); URLs e registros de terceiros são recusados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [model], properties: { model: { type: string, example: "qwen2.5:7b" } } }
      responses:
        "202":
          description: Download iniciado.
          content:
            application/json:
              schema: { type: object, properties: { pull: { $ref: "#/components/schemas/LocalAIPull" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Já há um download em andamento (`pull_running`)." }
        "503": { description: "O Ollama não está rodando neste computador (`ollama_unreachable`)." }
    delete:
      tags: [Atendente IA]
      operationId: cancelLocalAIPull
      x-litezap-milestone: A2
      summary: Cancelar o download do modelo
      x-litezap-scope: admin
      description: Interrompe o download em andamento (o Ollama retoma de onde parou num novo pedido).
      responses:
        "204": { description: Cancelado (ou nada em andamento). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/instances/{id}/attendant:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: getAttendant
      x-litezap-milestone: M5b
      summary: Ler o Atendente LiteZap
      x-litezap-scope: instancia
      description: Provedor, modelo, limites e uso de hoje. As chaves nunca voltam (`api_key_set`, `audio_api_key_set`).
      responses:
        "200":
          description: Configuração do atendente embutido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    put:
      tags: [Atendente IA]
      operationId: putAttendant
      x-litezap-milestone: M5b
      summary: Configurar provedor do atendente
      x-litezap-scope: admin
      x-litezap-notes: "Com Anthropic ou OpenAI cada mensagem atendida é uma chamada paga; os presets grátis (ollama, gemini_free, groq_free) custam 0. Mantenha daily_call_cap."
      description: |
        Só o token admin. Atualização parcial: `preset` (`ollama`, `gemini_free`, `groq_free`: preenche
        `provider` openai, `base_url` e `model` do provedor grátis; veja `GET /v1/ai/presets`), `provider`
        (`anthropic` | `openai`, qualquer servidor OpenAI-compatível; o id de um preset também é aceito), `model` (padrão `claude-sonnet-5-5`), `base_url`, `api_key` (cifrada em
        repouso com `data/attendant_key`; `""` remove), `daily_call_cap` (padrão 300 chamadas/dia, inclui
        transcrição e voz), `max_tokens`, `vision`, `audio` (servidor OpenAI-compatível de
        `/audio/transcriptions` e `/audio/speech`) e preços para o log de custo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantSettingsPatch" }
            examples:
              anthropic: { summary: Claude (padrão), value: { provider: anthropic, api_key: "sk-ant-...", daily_call_cap: 300 } }
              ollama: { summary: Grátis no computador (Ollama), value: { preset: ollama } }
              gemini: { summary: Grátis na nuvem (Google Gemini), value: { preset: gemini_free, api_key: "AIza..." } }
              groq: { summary: Groq grátis, value: { preset: groq_free, api_key: "gsk_..." } }
              local: { summary: Outro servidor OpenAI-compatível, value: { provider: openai, base_url: "http://127.0.0.1:1234/v1", model: "qwen2.5-7b-instruct" } }
      responses:
        "200":
          description: Configuração salva (sem as chaves).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantSettings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/attendant/presets:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: attendantPresets
      x-litezap-milestone: M5b
      summary: Modos prontos do atendente
      x-litezap-scope: instancia
      description: "Objetivo, roteiro, tom, critérios de passagem para humano e ações de cada modo: `vendedor`, `pedido`, `sdr`, `suporte`, `custom`."
      responses:
        "200":
          description: Presets por modo.
          content:
            application/json:
              schema: { type: object, properties: { presets: { type: object, additionalProperties: { $ref: "#/components/schemas/AttendantProfile" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/instances/{id}/attendant/agents:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: listAttendantAgents
      x-litezap-milestone: M5b
      summary: Listar agentes
      x-litezap-scope: instancia
      description: Agentes da instância; `active` marca o que responde (o escolhido, senão o primeiro criado).
      responses:
        "200":
          description: Agentes.
          content:
            application/json:
              schema: { type: object, properties: { agents: { type: array, items: { $ref: "#/components/schemas/AttendantAgent" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    post:
      tags: [Atendente IA]
      operationId: createAttendantAgent
      x-litezap-milestone: M5b
      summary: Criar agente
      x-litezap-scope: instancia
      description: Campos de roteiro ausentes vêm do preset do modo; tudo é editável depois. Até 20 agentes por instância.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantProfile" }
            example:
              name: Bia da Pizzaria
              mode: pedido
              business: "Pizzaria do Zé, Rua A 10, Centro. Entrega em até 40 min. Pix ou cartão na entrega."
              knowledge:
                - { kind: product, title: Pizza Margherita, price: 45.0, content: "8 fatias" }
                - { kind: hours, title: Seg a Dom, content: "18h às 23h" }
                - { kind: faq, title: "Tem opção sem glúten?", content: "Sim, massa sem glúten por +R$ 8." }
      responses:
        "201":
          description: Agente criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantAgent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/attendant/agents/{agent_id}:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: agent_id, in: path, required: true, description: "Id do agente (`agt_...`).", schema: { type: string } }
    get:
      tags: [Atendente IA]
      operationId: getAttendantAgent
      x-litezap-milestone: M5b
      summary: Ler agente
      x-litezap-scope: instancia
      responses:
        "200":
          description: Agente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Atendente IA]
      operationId: updateAttendantAgent
      x-litezap-milestone: M5b
      summary: Alterar agente
      x-litezap-scope: instancia
      description: Substitui o perfil inteiro (um roteiro vazio fica vazio).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendantProfile" }
      responses:
        "200":
          description: Agente alterado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantAgent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Atendente IA]
      operationId: deleteAttendantAgent
      x-litezap-milestone: M5b
      summary: Excluir agente
      x-litezap-scope: instancia
      responses:
        "204": { description: Excluído. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/attendant/agents/{agent_id}/activate:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: agent_id, in: path, required: true, description: "Id do agente (`agt_...`).", schema: { type: string } }
    post:
      tags: [Atendente IA]
      operationId: activateAttendantAgent
      x-litezap-milestone: M5b
      summary: Ativar agente
      x-litezap-scope: instancia
      description: Faz este agente responder as conversas da instância.
      responses:
        "200":
          description: Agente ativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendantAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/attendant/simulate:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Atendente IA]
      operationId: simulateAttendant
      x-litezap-milestone: M5b
      summary: Simular conversa
      x-litezap-scope: instancia
      description: |
        Roda um agente (salvo, o ativo, ou um perfil ainda não salvo em `agent`) contra mensagens de exemplo
        **sem enviar nada**. `from`: `customer` (padrão), `agent`, `human`, `automatic`. A última mensagem
        precisa ser do cliente (ou use `trigger: "call"` para a mensagem pós-ligação). É uma chamada real ao
        provedor e conta no limite diário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string }
                agent: { $ref: "#/components/schemas/AttendantProfile" }
                messages: { type: array, maxItems: 50, items: { type: object, properties: { from: { type: string, enum: [customer, agent, human, automatic] }, text: { type: string } } } }
                trigger: { type: string, enum: [call] }
                contact_name: { type: string }
            example: { messages: [{ from: automatic, text: "Não atendemos ligações, mande mensagem." }, { text: "quero 2 margheritas pra Rua B 5" }] }
      responses:
        "200":
          description: O que o agente faria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  voice: { type: boolean }
                  handoff: { type: boolean }
                  handoff_note: { type: string }
                  events: { type: array, items: { type: object } }
                  model: { type: string }
                  usage: { type: object, properties: { input_tokens: { type: integer }, output_tokens: { type: integer }, cost_usd: { type: number } } }
              example: { reply: "Resumo: 2x Pizza Margherita (R$ 90,00), entrega na Rua B, 5. Confirma?", voice: false, handoff: false, events: [{ type: agent.order_draft, items: [{ name: Pizza Margherita, quantity: 2, unit_price: 45, subtotal: 90, in_catalog: true }], total: 90, currency: BRL, address: "Rua B, 5" }], model: claude-sonnet-5-5, usage: { input_tokens: 1830, output_tokens: 120, cost_usd: 0.00486 } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/attendant/usage:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Atendente IA]
      operationId: attendantUsage
      x-litezap-milestone: M5b
      summary: Uso e custo do atendente
      x-litezap-scope: instancia
      description: Chamadas ao provedor, tokens e custo estimado (US$) por dia UTC, mais recente primeiro.
      parameters: [{ name: days, in: query, description: "Dias (padrão 7, máximo 90).", schema: { type: integer, minimum: 1, maximum: 90 } }]
      responses:
        "200":
          description: Uso por dia.
          content:
            application/json:
              schema: { type: object, properties: { usage: { type: array, items: { type: object, properties: { day: { type: string }, calls: { type: integer }, input_tokens: { type: integer }, output_tokens: { type: integer }, cost_usd: { type: number } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/agents:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Agentes]
      operationId: listAgents
      x-litezap-milestone: A1
      summary: Listar agentes
      x-litezap-scope: instancia
      description: Agentes da instância, com as execuções e o custo estimado de hoje (UTC), e a lista de grupos de permissão.
      responses:
        "200":
          description: Agentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
                  groups: { type: array, items: { type: string }, example: [ler, responder_no_chat, enviar_outros_chats, etiquetas, grupos, midia] }
                  risky_groups: { type: array, items: { type: string }, example: [enviar_outros_chats, grupos] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    post:
      tags: [Agentes]
      operationId: createAgent
      x-litezap-milestone: A1
      summary: Criar agente
      x-litezap-scope: instancia
      description: |
        Campos ausentes vêm dos padrões: `tools: [ler, responder_no_chat]`, `mode: aprovacao`, gatilho
        "mensagem nova" só em conversas 1:1, `limits: {max_steps: 8, max_recipients: 3, daily_runs: 200}` e
        `enabled: false`. Até 20 agentes por instância. Para responder a mensagens novas, o hook de agente
        da instância precisa estar com `target: "agents"` e ligado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
            example:
              name: Atendente da loja
              enabled: true
              mode: aprovacao
              instructions: "Responda dúvidas sobre horário e entrega. Horário: seg a sáb, 9h às 18h. Para descontos, diga que uma pessoa vai responder."
              tools: [ler, responder_no_chat]
              trigger: { type: message, keywords: [], groups: false }
      responses:
        "201":
          description: Agente criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/agents/{agent_id}:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: agent_id, in: path, required: true, description: "Id do agente (`agn_...`).", schema: { type: string } }
    get:
      tags: [Agentes]
      operationId: getAgent
      x-litezap-milestone: A1
      summary: Ler agente
      x-litezap-scope: instancia
      responses:
        "200":
          description: Agente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Agentes]
      operationId: updateAgent
      x-litezap-milestone: A1
      summary: Alterar agente
      x-litezap-scope: instancia
      description: "Atualização parcial: campos omitidos ficam como estão (por exemplo `{\"enabled\": false}` pausa o agente)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
            example: { enabled: false }
      responses:
        "200":
          description: Agente alterado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Agentes]
      operationId: deleteAgent
      x-litezap-milestone: A1
      summary: Excluir agente
      x-litezap-scope: instancia
      description: Apaga o agente com as execuções e os rascunhos dele.
      responses:
        "204": { description: Excluído. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/agents/{agent_id}/run:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: agent_id, in: path, required: true, description: "Id do agente (`agn_...`).", schema: { type: string } }
    post:
      tags: [Agentes]
      operationId: runAgent
      x-litezap-milestone: A1
      summary: Executar agente agora
      x-litezap-scope: instancia
      x-litezap-events: [agent.run.completed, agent.draft.created]
      x-litezap-notes: "Cada passo é uma chamada paga ao provedor e conta nos limites do Atendente IA."
      description: |
        Roda o agente agora (ligado ou não) e espera o resultado (até 3 minutos). Com `chat`, as últimas
        mensagens dele são o contexto e as ferramentas de resposta respondem nele; `input` é um pedido seu para
        esta execução. O modo do agente vale: em `aprovacao` as escritas viram rascunhos. Uma execução por chat
        de cada vez (`409 agent_busy`).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                chat: { type: string, description: "Chat do gatilho: JID ou número com DDI (opcional)." }
                input: { type: string, maxLength: 4000, description: Pedido para esta execução (opcional). }
            example: { chat: "5511999999999", input: "Veja se o cliente ficou sem resposta e responda." }
      responses:
        "200":
          description: A execução terminada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_configured` (sem provedor de IA ou sem chave: configure no Atendente IA) ou `agent_busy`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: not_configured, message: "no AI provider configured: set it up in the Atendente IA tab (admin)", retryable: false } }
        "429":
          description: "`rate_limited`: limite diário (do agente, do chat ou da instância) atingido."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/instances/{id}/agents/{agent_id}/runs:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: agent_id, in: path, required: true, description: "Id do agente (`agn_...`).", schema: { type: string } }
    get:
      tags: [Agentes]
      operationId: listAgentRuns
      x-litezap-milestone: A1
      summary: Execuções do agente
      x-litezap-scope: instancia
      description: Execuções mais recentes primeiro (guardadas por 30 dias), com os passos resumidos.
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Execuções.
          content:
            application/json:
              schema: { type: object, properties: { runs: { type: array, items: { $ref: "#/components/schemas/AgentRun" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/agents/runs/{run_id}:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: run_id, in: path, required: true, description: "Id da execução (`arun_...`).", schema: { type: string } }
    get:
      tags: [Agentes]
      operationId: getAgentRun
      x-litezap-milestone: A1
      summary: Ler execução
      x-litezap-scope: instancia
      responses:
        "200":
          description: Execução.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/agents/runtimes:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: refresh, in: query, required: false, description: "1 detecta o Codex CLI de novo (o resultado fica 30 s em cache).", schema: { type: string, enum: ["1"] } }
    get:
      tags: [Agentes]
      operationId: getAgentRuntimes
      x-litezap-milestone: A1
      summary: Quem pode rodar agentes
      x-litezap-scope: instancia
      description: |
        O provedor de IA da instância, o Codex CLI local (runtime `codex_cli`: instalado? logado com ChatGPT ou
        com chave de API? quais recursos do Codex ficam desligados) e como usar uma assinatura Claude (pelo plugin
        do Claude Code, que o LiteZap não roda sozinho). Detectar o Codex só roda `codex --version`,
        `codex login status` e `codex features list`: nenhuma chamada ao modelo.
      responses:
        "200":
          description: Runtimes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: object }
                  codex_cli:
                    type: object
                    nullable: true
                    properties:
                      installed: { type: boolean }
                      path: { type: string }
                      version: { type: string }
                      logged_in: { type: boolean }
                      auth: { type: string, enum: [chatgpt, api_key, unknown] }
                      ready: { type: boolean }
                      detail: { type: string }
                      disabled_features: { type: array, items: { type: string } }
                      notice: { type: string }
                      checked_at: { type: string, format: date-time }
                  claude_code: { type: object, properties: { runtime: { type: boolean }, how: { type: string }, docs: { type: string } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/agents/drafts:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Agentes]
      operationId: listAgentDrafts
      x-litezap-milestone: A1
      summary: Listar rascunhos
      x-litezap-scope: instancia
      description: |
        Escritas de agentes em modo `aprovacao` esperando uma decisão, mais recentes primeiro. `args` é
        exatamente o que a aprovação executa (destinatário em `to` ou `chat`, texto em `text`). Um rascunho
        vale por 24 horas; depois fica `expired`.
      parameters:
        - { name: status, in: query, description: "pending, approved, rejected, failed ou expired (omitido: todos).", schema: { type: string, enum: [pending, approved, rejected, failed, expired] } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Rascunhos.
          content:
            application/json:
              schema: { type: object, properties: { drafts: { type: array, items: { $ref: "#/components/schemas/AgentDraft" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/agents/drafts/{draft_id}/approve:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: draft_id, in: path, required: true, description: "Id do rascunho (`adr_...`).", schema: { type: string } }
    post:
      tags: [Agentes]
      operationId: approveAgentDraft
      x-litezap-milestone: A1
      summary: Aprovar rascunho
      x-litezap-scope: instancia
      x-litezap-events: [agent.draft.decided]
      description: |
        Executa exatamente a chamada guardada (mesma ferramenta e argumentos), pela fila normal de envio.
        Antes, confere de novo: o agente precisa existir, estar ligado e ainda ter a permissão, e a chamada
        precisa passar pelas checagens de destinatário, menções e limites da execução.
        `status` volta `approved` (com o id da mensagem em `result`) ou `failed` (o erro em `result`).
        Um rascunho já decidido ou expirado responde `409 conflict`.
      responses:
        "200":
          description: Rascunho decidido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: já decidido ou expirado."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/instances/{id}/agents/drafts/{draft_id}/reject:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: draft_id, in: path, required: true, description: "Id do rascunho (`adr_...`).", schema: { type: string } }
    post:
      tags: [Agentes]
      operationId: rejectAgentDraft
      x-litezap-milestone: A1
      summary: Rejeitar rascunho
      x-litezap-scope: instancia
      x-litezap-events: [agent.draft.decided]
      description: Descarta o rascunho; nada é enviado.
      responses:
        "200":
          description: Rascunho rejeitado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: já decidido ou expirado."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/instances/{id}/agents/simulate:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Agentes]
      operationId: simulateAgent
      x-litezap-milestone: A1
      summary: Simular agente
      x-litezap-scope: instancia
      x-litezap-notes: "É uma chamada real ao provedor e conta no limite do simulador."
      description: |
        Roda um agente salvo (`agent_id`), um não salvo (`agent`) ou um salvo com alterações (os dois) contra
        mensagens de exemplo (`from`: `customer`, `agent`, `human`, `automatic`). As ferramentas de escrita são
        **sempre faz de conta**: cada passo `dry_run` mostra o que o agente faria. As de leitura leem dados reais
        (com `chat`, os do chat informado). Nada é guardado nem enviado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                agent_id: { type: string }
                agent: { $ref: "#/components/schemas/AgentInput" }
                messages: { type: array, maxItems: 50, items: { type: object, properties: { from: { type: string, enum: [customer, agent, human, automatic] }, text: { type: string } } } }
                chat: { type: string }
                input: { type: string, maxLength: 4000 }
            example: { agent: { name: Teste, instructions: "Responda dúvidas de horário: seg a sáb, 9h às 18h." }, messages: [{ text: "vocês abrem sábado?" }] }
      responses:
        "200":
          description: "O que o agente faria (`dry_run: true`, sem `id`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentRun" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not_configured`: sem provedor de IA."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/webhooks:
    post:
      tags: [Webhooks]
      operationId: createWebhook
      x-litezap-milestone: M3
      x-zapi: "Atualizar webhook (ao receber, ao enviar, status...)"
      summary: Criar webhook
      x-litezap-scope: instancia
      description: |
        Cadastra um endpoint que recebe por `POST` os eventos que combinam com `events` (tipos exatos,
        famílias como `message.*`, ou `*`). Com token de instância o webhook é sempre daquela instância.
        Com token admin, `instance_id` escolhe a instância; sem ele o webhook é **global** (todas as
        instâncias).

        `secret` é opcional (16 a 256 caracteres); sem ele um é gerado com prefixo `whsec_`. O segredo só
        aparece nesta resposta (e na de um `PATCH` que o troque): guarde-o. Só URLs `http(s)`; endereços
        privados, loopback e link-local são recusados na entrega, salvo `webhook_allow_private_urls: true`.
        Redirecionamentos não são seguidos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
            example: { url: "https://exemplo.com/litezap", events: ["message.*", "instance.status"] }
      responses:
        "201":
          description: Webhook criado, com o `secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
              example:
                id: wh_3c7e1a9f5b2d4806
                instance_id: inst_7f3a9c2e5b1d4086
                url: https://exemplo.com/litezap
                events: ["message.*", "instance.status"]
                version: 1
                enabled: true
                created_at: "2026-10-17T14:00:00Z"
                updated_at: "2026-10-17T14:00:00Z"
                secret: whsec_9Jd2kQm4xV7pR1tY6nB3cF8hL0sW5zA
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Listar webhooks
      x-litezap-scope: instancia
      description: |
        Com token de instância, lista os webhooks da própria instância. Com token admin, lista todos
        (globais e de instâncias); `instance_id` filtra por uma instância. O `secret` nunca aparece aqui.
      parameters:
        - name: instance_id
          in: query
          description: "Só admin: filtra pelos webhooks desta instância."
          schema: { type: string }
      responses:
        "200":
          description: Webhooks visíveis para o token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
              example:
                webhooks:
                  - id: wh_3c7e1a9f5b2d4806
                    instance_id: inst_7f3a9c2e5b1d4086
                    url: https://exemplo.com/litezap
                    events: ["message.*", "instance.status"]
                    version: 1
                    enabled: true
                    created_at: "2026-10-17T14:00:00Z"
                    updated_at: "2026-10-17T14:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/webhooks/{wid}:
    parameters: [{ $ref: "#/components/parameters/WebhookID" }]
    get:
      tags: [Webhooks]
      operationId: getWebhook
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Consultar webhook
      x-litezap-scope: instancia
      description: Um webhook de outra instância responde `404 not_found` para o token de instância.
      responses:
        "200":
          description: O webhook (sem o `secret`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
              example:
                id: wh_3c7e1a9f5b2d4806
                instance_id: inst_7f3a9c2e5b1d4086
                url: https://exemplo.com/litezap
                events: ["message.*", "instance.status"]
                version: 1
                enabled: true
                created_at: "2026-10-17T14:00:00Z"
                updated_at: "2026-10-17T14:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WebhookNotFound" }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      x-litezap-milestone: M3
      x-zapi: "Atualizar todos os webhooks"
      summary: Atualizar webhook
      x-litezap-scope: instancia
      description: |
        Atualização parcial de `url`, `events`, `enabled` e `secret`. `instance_id` não muda (crie outro
        webhook). `{"secret": ""}` gera um segredo novo, devolvido nesta resposta. Desligar
        (`"enabled": false`) para de gerar entregas novas e pausa as pendentes até religar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
            example: { events: ["*"], enabled: true }
      responses:
        "200":
          description: O webhook atualizado (com `secret` só se ele foi trocado).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WebhookNotFound" }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Apagar webhook
      x-litezap-scope: instancia
      description: Apaga o webhook e as entregas dele.
      responses:
        "204": { description: Apagado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WebhookNotFound" }

  /v1/webhooks/{wid}/deliveries:
    parameters: [{ $ref: "#/components/parameters/WebhookID" }]
    get:
      tags: [Webhooks]
      operationId: listDeliveries
      x-litezap-sample: { query: { status: failed } }
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Listar entregas
      x-litezap-scope: instancia
      description: |
        Entregas do webhook, mais recentes primeiro, com tentativas, último status HTTP, último erro e o
        evento completo. `?status=failed` é a dead-letter: entregas que ficaram 24 horas sem sucesso.
        Entregas concluídas ficam 7 dias e a dead-letter 30 dias (configurável).
      parameters:
        - name: status
          in: query
          description: "`pending`, `delivered` ou `failed`. Omitido: todas."
          schema: { type: string, enum: [pending, delivered, failed] }
        - name: limit
          in: query
          description: Itens por página. Padrão 50, máximo 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página de entregas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
              example:
                deliveries:
                  - id: dlv_8b1f4e2a6c9d3075
                    webhook_id: wh_3c7e1a9f5b2d4806
