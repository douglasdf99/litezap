  /v1/instances/{id}/pairing-links:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      tags: [Plataforma]
      operationId: createPairingLink
      x-litezap-milestone: M11
      x-zapi: "SDK de conexão / Gerar token do SDK"
      x-litezap-events: [instance.paired]
      summary: Gerar link de pareamento
      x-litezap-scope: admin
      description: |
        Gera um link para uma página hospedada pelo próprio servidor (`/pair/`) que mostra o QR ao vivo e
        permite parear pelo número de telefone — sem expor o token da instância. O link:

        - é assinado (HMAC-SHA256 com a chave `data/pairing_key`) e registrado no banco;
        - vale `ttl_seconds` (60 a 600; padrão 600) **ou** até o primeiro pareamento concluído;
        - leva o token no fragmento (`#t=...`), que o navegador nunca envia ao servidor (não vai para logs
          de acesso nem para `Referer`); a página o tira da barra de endereço ao abrir;
        - pode ser embutido num iframe só nas origens de `pairing_frame_ancestors` (CSP `frame-ancestors`;
          vazio = não pode ser embutido). Há um web component pronto: `<script src=".../pair/embed.js">` e
          `<litezap-pair url="...">`.

        A base do link é `public_url` (ou o `listen_addr`). Exige o token admin (ou o do operador); até 20
        links vivos por instância. Quando o pareamento termina sai o evento `instance.paired` com `via_link: true`.
      x-litezap-notes: "Quem tiver o link pode parear a instância com o próprio número enquanto ele valer. Envie só ao cliente e revogue se vazar."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 60, maximum: 600, default: 600 }
            example: { ttl_seconds: 600 }
      responses:
        "201":
          description: Link gerado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, description: "Página de pareamento com o token no fragmento." }
                  token: { type: string, description: "O token do link (o mesmo do fragmento)." }
                  expires_at: { type: string, format: date-time }
              example:
                id: wEeHr7odSNU0pM_Rb4O5WQ
                url: "https://zap.seu-dominio.com/pair/#t=pl1.wEeHr7odSNU0pM_Rb4O5WQ.1792342931.Yzlm6Nb6zRKq7pSI0XVQSA1OCyKl6le1r4ca4qL63wY"
                token: pl1.wEeHr7odSNU0pM_Rb4O5WQ.1792342931.Yzlm6Nb6zRKq7pSI0XVQSA1OCyKl6le1r4ca4qL63wY
                expires_at: "2026-10-18T17:02:11Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    delete:
      tags: [Plataforma]
      operationId: revokePairingLinks
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Revogar links de pareamento
      x-litezap-scope: admin
      description: Revoga todos os links ainda não usados da instância; a página aberta passa a mostrar "link expirado".
      responses:
        "200":
          description: Quantos links foram revogados.
          content:
            application/json:
              example: { revoked: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    get:
      tags: [Plataforma]
      operationId: instanceUsage
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Uso da instância
      x-litezap-scope: instancia
      description: |
        Contadores diários (dias UTC) da instância: mensagens enviadas pela API e recebidas, bytes de mídia,
        segundos conectada e entregas de webhook. `from` e `to` (`YYYY-MM-DD`) padrão: últimos 31 dias;
        intervalo máximo de 366 dias. Os números são os mesmos do `GET /v1/usage` do operador.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Uso por dia.
          content:
            application/json:
              example:
                instance_id: inst_7f3a9c2e5b1d4086
                from: "2026-10-01"
                to: "2026-10-18"
                usage:
                  - { instance_id: inst_7f3a9c2e5b1d4086, day: "2026-10-17", messages_sent: 120, messages_received: 340, media_bytes: 1048576, connected_seconds: 86400, webhook_deliveries: 460 }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Token admin (`lza_...`, de `data/admin_token` ou `LITEZAP_ADMIN_TOKEN`), token de instância (`lzi_...`) ou chave de API com escopo (`lzk_...`)."
  parameters:
    InstanceID:
      name: id
      in: path
      required: true
      description: "Id da instância (`inst_...`)."
      schema: { type: string }
    ChatJID:
      name: jid
      in: path
      required: true
      description: "JID do chat (`...@s.whatsapp.net`, `...@g.us`, `...@lid`) ou número com DDI. Prefira o `jid` devolvido por `GET /chats` ou `check-numbers`."
      schema: { type: string }
    GroupJID:
      name: jid
      in: path
      required: true
      description: "JID do grupo ou comunidade (`120363…@g.us`)."
      schema: { type: string }
    MediaID:
      name: media_id
      in: path
      required: true
      description: "Id da mídia (`med_...`), de `media.id` no log."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Itens por página. Padrão 50, máximo 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: "`next_cursor` da página anterior (opaco)."
      schema: { type: string }
    WebhookID:
      name: wid
      in: path
      required: true
      description: "Id do webhook (`wh_...`)."
      schema: { type: string }
    EventTypes:
      name: types
      in: query
      description: "Filtro separado por vírgulas: tipos exatos (`instance.status`), famílias (`message.*`) ou `*`. Omitido: todos. `chat.presence` é opt-in: nem `*` nem a omissão o incluem (use `*,chat.presence`)."
      schema: { type: string, example: "message.*,instance.status" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string, description: Código estável (veja a tabela de erros). }
            message: { type: string, description: Texto para humanos; nunca traz telefone nem token. }
            retryable: { type: boolean, description: Se o cliente pode tentar de novo. }
    InstanceState:
      type: string
      enum: [created, starting, qr_pending, connecting, connected, reconnecting, logged_out, banned, failed, stopped]
    Instance:
      type: object
      required: [id, name, state, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        state: { $ref: "#/components/schemas/InstanceState" }
        state_reason: { type: string, description: "Ex.: `proxy_unreachable`, `temp_banned:<duração>`." }
        phone: { type: string, description: Número conectado (depois do pareamento). }
        tags: { type: array, items: { type: string }, description: "Etiquetas (marco 11)." }
        ip_allowlist: { type: array, items: { type: string }, description: "CIDRs de onde o token da instância é aceito; vazio = qualquer (marco 11)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: string, description: "Id da chave (`key_...`)." }
        instance_id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, send] } }
        ip_allowlist: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "Ausente: não expira." }
        last_used_at: { type: string, format: date-time, description: "Atualizado no máximo uma vez por minuto." }
    InstanceCreated:
      type: object
      properties:
        instance: { $ref: "#/components/schemas/Instance" }
        token: { type: string, description: "Token da instância (`lzi_...`). Mostrado só uma vez." }
    Ramp:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        start_per_day: { type: integer, default: 50 }
        end_per_day: { type: integer, default: 150 }
        days: { type: integer, default: 14, minimum: 1, maximum: 365 }
    SendWindow:
      type: object
      properties:
        start: { type: string, description: "HH:MM; vazio com end vazio = sem janela.", example: "08:00" }
        end: { type: string, example: "20:00" }
    Settings:
      type: object
      properties:
        min_interval_ms: { type: integer, default: 3000, description: "Intervalo mínimo entre envios. Mínimo 1000 sem unsafe_pacing." }
        jitter_ms: { type: integer, default: 2000, description: Variação aleatória somada ao intervalo. }
        max_per_minute: { type: integer, default: 20, description: "Teto por minuto. Máximo 60 sem unsafe_pacing." }
        typing_simulation: { type: boolean, default: true, description: "Mostra \"digitando\" antes de enviar (~50ms por caractere, até 5s)." }
        ramp: { $ref: "#/components/schemas/Ramp" }
        send_window: { $ref: "#/components/schemas/SendWindow" }
        timezone: { type: string, description: "Fuso IANA (ex.: America/Sao_Paulo); vazio = fuso do servidor." }
        unsafe_pacing: { type: boolean, default: false, description: Remove os pisos de ritmo. Só admin. }
        proxy_url: { type: string, description: "http://, https:// ou socks5://; senha mascarada na leitura." }
        calls: { $ref: "#/components/schemas/CallSettings" }
        presence: { $ref: "#/components/schemas/PresenceSettings" }
        groups: { $ref: "#/components/schemas/GroupLimits" }
        auto_read: { $ref: "#/components/schemas/AutoReadSettings" }
    AutoReadSettings:
      type: object
      description: Leitura automática (marco 9).
      properties:
        enabled: { type: boolean, default: false, description: "Marca as mensagens recebidas como lidas 2 a 5s depois, em lote por chat, no máximo uma confirmação por segundo. Com a confirmação de leitura desligada na privacidade, o contato não vê os tiques azuis." }
        groups: { type: boolean, default: false, description: Também em grupos. }
    CallSettings:
      type: object
      description: Política de chamadas recebidas (marco 7).
      properties:
        auto_reject: { type: boolean, default: false, description: "Rejeita toda chamada individual assim que toca (< 3s); `call.received` sai com `rejected: true`. Chamadas em grupo só são informadas." }
        reject_message:
          type: string
          maxLength: 1000
          description: "Mandada ao autor de chamadas individuais rejeitadas, pela fila (ritmo, janela, rampa); no máximo uma por contato a cada 10 min; expira em 1h. Vazio: sem mensagem."
    PresenceSettings:
      type: object
      description: Presença da própria conta (marco 7).
      properties:
        online:
          type: boolean
          default: false
          description: "Marca a conta como disponível a cada conexão: necessário para `chat.presence` e `presence/subscribe`. Enquanto ligado, o celular deixa de mostrar notificações."
    WebhookFilters:
      type: object
      description: "Restringem os eventos do webhook (marco 7). Cada filtro só vale para eventos que têm o campo: `instance.*` sempre passam."
      properties:
        chat: { type: string, enum: [direct, group] }
        chats: { type: array, maxItems: 500, items: { type: string }, description: "Só estes chats (número com DDI ou JID)." }
        exclude_chats: { type: array, items: { type: string }, description: Todos menos estes chats. }
        message_types:
          type: array
          items: { type: string, enum: [text, image, video, gif, ptv, audio, document, sticker, location, contact, poll, reaction, button_reply, unknown] }
          description: "Só eventos de mensagem destes tipos (received, sent, reaction, button_reply)."
        from_me: { type: boolean, description: "true: só mensagens nossas; false: exclui as nossas. Omitido: ambas. Não se aplica a message.status." }
    ChatPresenceEvent:
      type: object
      description: Dados de `chat.presence`.
      properties:
        chat: { type: string }
        sender: { type: string, description: Quem digita (o participante, em grupos). }
        is_group: { type: boolean }
        state: { type: string, enum: [composing, recording, paused, online, offline] }
        last_seen: { type: string, format: date-time, description: "Em `offline`, quando o contato mostra o visto por último." }
    CallEvent:
      type: object
      description: Dados de `call.received`, `call.accepted` e `call.ended`.
      properties:
        call_id: { type: string }
        chat: { type: string, description: Chat de quem ligou, ou o grupo em chamadas de grupo. }
        caller: { type: string }
        is_group: { type: boolean }
        media: { type: string, enum: [audio, video] }
        rejected: { type: boolean, description: "call.received: rejeitada por `calls.auto_reject`." }
        reason: { type: string, description: "call.ended: `caller_hangup`, `accepted_elsewhere`, `ended`, `rejected` (por esta instância), `rejected_by_peer`, `timeout` ou outro motivo do WhatsApp." }
        missed: { type: boolean, description: "call.ended: tocou sem ninguém atender." }
        timestamp: { type: string, format: date-time }
    GroupSettings:
      type: object
      description: Configurações de um grupo (marco 8).
      properties:
        announce: { type: boolean, description: Só admins enviam mensagens. }
        locked: { type: boolean, description: Só admins editam nome, descrição e foto. }
        approval_required: { type: boolean, description: Entrada com aprovação de um admin. }
        admins_add_members: { type: boolean, description: Só admins adicionam participantes. }
        ephemeral_seconds: { type: integer, enum: [0, 86400, 604800, 7776000], description: "Mensagens temporárias (0: desligadas)." }
    GroupParticipant:
      type: object
      properties:
        jid: { type: string, description: "JID de telefone quando conhecido; senão o LID." }
        lid: { type: string }
        phone: { type: string }
        admin: { type: boolean }
        super_admin: { type: boolean, description: Dono do grupo. }
    Group:
      type: object
      properties:
        jid: { type: string, example: "120363000000000001@g.us" }
        name: { type: string }
        description: { type: string }
        owner: { type: string }
        created_at: { type: string, format: date-time }
        community: { type: boolean, description: É uma comunidade. }
        parent: { type: string, description: Comunidade a que o grupo pertence. }
        announcement_group: { type: boolean, description: Grupo de avisos da comunidade. }
        participant_count: { type: integer }
        lid_addressing: { type: boolean, description: O grupo endereça os membros por LID. }
        suspended: { type: boolean }
        settings: { $ref: "#/components/schemas/GroupSettings" }
        participants: { type: array, items: { $ref: "#/components/schemas/GroupParticipant" }, description: "Só em `GET /groups/{jid}` e na criação." }
    SubGroup:
      type: object
      properties:
        jid: { type: string }
        name: { type: string }
        announcement_group: { type: boolean }
    CreateGroup:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        participants: { type: array, maxItems: 10, items: { type: string }, description: Número com DDI ou JID. }
        description: { type: string, maxLength: 2048 }
        parent: { type: string, description: "Criar dentro desta comunidade (só em `POST /groups`)." }
        settings:
          type: object
          properties:
            announce: { type: boolean }
            locked: { type: boolean }
            approval_required: { type: boolean }
            admins_add_members: { type: boolean }
            ephemeral_seconds: { type: integer, enum: [0, 86400, 604800, 7776000] }
    UpdateGroup:
      type: object
      description: Campos ausentes ficam como estão. As configurações podem vir soltas ou em `settings`.
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 2048, description: "\"\" remove." }
        announce: { type: boolean }
        locked: { type: boolean }
        approval_required: { type: boolean }
        admins_add_members: { type: boolean }
        ephemeral_seconds: { type: integer, enum: [0, 86400, 604800, 7776000] }
        settings: { $ref: "#/components/schemas/GroupSettings" }
    ParticipantResult:
      type: object
      properties:
        participant: { type: string, description: Como foi pedido (normalizado para JID). }
        jid: { type: string, description: Como o WhatsApp respondeu. }
        status:
          type: string
          description: "`ok`, `not_on_whatsapp`, `unknown_contact`, `privacy_invite_required`, `recently_left`, `already_participant`, `not_participant`, `group_full`, `error_<código>` ou `unknown`."
        code: { type: integer, description: Código do WhatsApp (melhor esforço). }
        invite_code: { type: string, description: "`privacy_invite_required`: código de convite por mensagem (não enviado)." }
        invite_expires_at: { type: string, format: date-time }
    CreateGroupResult:
      type: object
      properties:
        group: { $ref: "#/components/schemas/Group" }
        results: { type: array, items: { $ref: "#/components/schemas/ParticipantResult" } }
        warning: { type: string, description: "Um passo depois da criação falhou (descrição); o grupo existe." }
    GroupLimits:
      type: object
      description: "Cotas anti-ban de grupos por instância (marco 8). Tetos sobem só com `unsafe_pacing` (admin)."
      properties:
        max_adds_per_hour: { type: integer, default: 10, maximum: 30 }
        max_adds_per_day: { type: integer, default: 50, maximum: 200 }
        max_creates_per_day: { type: integer, default: 3, maximum: 10 }
        max_joins_per_day: { type: integer, default: 10, maximum: 30 }
    GroupUpdatedEvent:
      type: object
      description: Dados de `group.updated`.
      properties:
        chat: { type: string, description: JID do grupo. }
        kind: { type: string, enum: [participants_added, participants_removed, participants_promoted, participants_demoted, join_request, join_request_revoked, subject, description, photo, settings, invite_link_reset, joined, deleted, suspended, unsuspended, community_linked, community_unlinked] }
        actor: { type: string }
        participants: { type: array, items: { type: string } }
        reason: { type: string }
        name: { type: string }
        description: { type: string }
        removed: { type: boolean }
        settings:
          type: object
          properties:
            announce: { type: boolean }
            locked: { type: boolean }
            approval_required: { type: boolean }
            ephemeral_seconds: { type: integer }
            approval_mode_changed: { type: boolean, description: "A aprovação de entrada mudou e o valor novo não pôde ser lido." }
        group: { type: string }
        timestamp: { type: string, format: date-time }
    SettingsPatch:
      type: object
      description: Todos os campos são opcionais; ausentes mantêm o valor atual.
      properties:
        min_interval_ms: { type: integer }
        jitter_ms: { type: integer }
        max_per_minute: { type: integer }
        typing_simulation: { type: boolean }
        ramp:
          type: object
          properties:
            enabled: { type: boolean }
            start_per_day: { type: integer }
            end_per_day: { type: integer }
            days: { type: integer }
        send_window: { $ref: "#/components/schemas/SendWindow" }
        timezone: { type: string }
        unsafe_pacing: { type: boolean, description: Só admin. }
        proxy_url: { type: string, description: "Só admin. Vazio volta ao default_proxy_url." }
        calls:
          type: object
          properties:
            auto_reject: { type: boolean }
            reject_message: { type: string, maxLength: 1000 }
        presence:
          type: object
          properties:
            online: { type: boolean }
        groups: { $ref: "#/components/schemas/GroupLimits" }
        auto_read:
          type: object
          properties:
            enabled: { type: boolean }
            groups: { type: boolean }
    MediaInput:
      type: object
      description: Informe `url` ou `base64`.
      properties:
        url: { type: string, description: "http(s) público; o servidor baixa (timeout 30s, sem IPs privados)." }
        base64: { type: string }
        mime: { type: string }
        file_name: { type: string, description: Até 255 bytes. }
        ptt: { type: boolean, description: "Áudio como mensagem de voz." }
    SendMessage:
      type: object
      required: [to, type]
      properties:
        to: { type: string, description: "Número com DDI (10 a 15 dígitos) ou JID." }
        type: { type: string, enum: [text, image, video, audio, document, reaction] }
        text: { type: string, description: "Obrigatório em `text` (até 64KB)." }
        caption: { type: string, description: "Legenda de image, video e document." }
        media: { $ref: "#/components/schemas/MediaInput" }
        reaction:
          type: object
          properties:
            message_id: { type: string, description: "Id LiteZap ou wa_message_id de uma mensagem do chat." }
            emoji: { type: string, description: "Vazio remove a reação." }
        client_message_id: { type: string, maxLength: 128, description: Chave de idempotência. }
        expires_after: { type: string, description: "Duração entre 1m e 168h (padrão 24h). Não enviada até lá: message_expired.", example: 24h }
    MediaInfo:
      type: object
      properties:
        id: { type: string, description: Id da mídia recebida. }
        kind: { type: string }
        mime: { type: string }
        size: { type: integer }
        file_name: { type: string }
        seconds: { type: integer }
        ptt: { type: boolean }
        url: { type: string, description: Caminho da API para baixar (mídia recebida). }
    Message:
      type: object
      required: [id, chat, from_me, type, status, timestamp]
      properties:
        id: { type: string }
        client_message_id: { type: string }
        wa_message_id: { type: string }
        chat: { type: string }
        sender: { type: string }
        from_me: { type: boolean }
        source: { type: string, enum: [contact, api, device, history] }
        type: { type: string }
        text: { type: string }
        media: { $ref: "#/components/schemas/MediaInfo" }
        reaction_to: { type: string }
        status:
          type: string
          enum: [queued, in_flight, sent, delivered, read, played, failed, received, pending]
        attempts: { type: integer }
        error: { type: string, description: "Último erro (`codigo: detalhe`) de item não enviado." }
        timestamp: { type: string, format: date-time }
    Chat:
      type: object
      properties:
        jid: { type: string }
        name: { type: string }
        is_group: { type: boolean }
        last_message_at: { type: string, format: date-time }
        unread_count: { type: integer }
        archived: { type: boolean }
        pinned: { type: boolean }
        muted: { type: boolean }
        muted_until: { type: string, format: date-time, description: "Fim do silêncio; ausente com `muted: true` = até reativar." }
        unread: { type: boolean, description: "Marcado como não lido à mão (`unread_count` conta as recebidas)." }
        deleted_at: { type: string, format: date-time, description: Quando foi apagado (o chat volta à lista com uma mensagem nova). }
    ChatPatch:
