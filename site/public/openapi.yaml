        - [error, string, "Detalhe (opcional, sem chaves)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_5f1c9a3e7d2b4086, type: agent.failed, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-18T19:02:11.020Z", data: { chat: "5511999999999@s.whatsapp.net", message_id: msg_1a2b3c4d5e6f7a8b, reason: daily_cap, error: "daily limit of 300 provider calls reached (daily_call_cap)" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
