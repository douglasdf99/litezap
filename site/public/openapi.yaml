                    from_me: false
                    source: contact
                    type: image
                    text: "Foto do produto"
                    media:
                      id: med_5b8e1f3c9d2a7046
                      kind: image
                      mime: image/jpeg
                      size: 182345
                      url: /v1/instances/inst_7f3a9c2e5b1d4086/media/med_5b8e1f3c9d2a7046
                    status: received
                    timestamp: "2026-10-17T13:52:10Z"
                next_cursor: eyJzIjoxMjM0fQ
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
