        - [description, string, "description (opcional)."]
        - [removed, boolean, "photo: foto removida (opcional)."]
        - [settings, object, "settings: announce, locked, approval_required, ephemeral_seconds (opcional)."]
        - [group, string, "community_linked/unlinked: o grupo (opcional)."]
        - [timestamp, string, "Quando aconteceu."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              participants:
                summary: Participante adicionado
                value: { id: evt_2b7d0f4a9c1e6358, type: group.updated, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-18T11:00:00.000Z", data: { chat: 120363000000000001@g.us, kind: participants_added, actor: 5511999999999@s.whatsapp.net, participants: [5511888888888@s.whatsapp.net], timestamp: "2026-10-18T11:00:00Z" } }
              settings:
