  agent.failed:
    post:
      summary: Atendente IA falhou
      x-slug: agent-failed
      x-litezap-milestone: M5
      x-zapi: (sem equivalente)
      description: |
        Uma chamada do hook de agente falhou e nada foi enviado (falha fechada), ou a proteção contra loop pausou
        o chat. Motivos do agente externo: `timeout`, `http_error`, `network_error`, `invalid_response`,
        `send_failed`, `loop_guard`, `internal`. Do Atendente LiteZap: também `not_configured`, `daily_cap`
        (limite diário de chamadas atingido) e `llm_error` (o provedor falhou).
      x-related: [agent.handoff]
      x-fields:
        - [chat, string, "Chat da mensagem."]
