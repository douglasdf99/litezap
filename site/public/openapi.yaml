        "404": { $ref: "#/components/responses/WebhookNotFound" }

  /v1/webhooks/{wid}/deliveries:
    parameters: [{ $ref: "#/components/parameters/WebhookID" }]
    get:
      tags: [Webhooks]
      operationId: listDeliveries
      x-litezap-sample: { query: { status: failed } }
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Listar entregas
      x-litezap-scope: instancia
      description: |
        Entregas do webhook, mais recentes primeiro, com tentativas, último status HTTP, último erro e o
        evento completo. `?status=failed` é a dead-letter: entregas que ficaram 24 horas sem sucesso.
        Entregas concluídas ficam 7 dias e a dead-letter 30 dias (configurável).
      parameters:
        - name: status
          in: query
          description: "`pending`, `delivered` ou `failed`. Omitido: todas."
          schema: { type: string, enum: [pending, delivered, failed] }
        - name: limit
          in: query
          description: Itens por página. Padrão 50, máximo 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página de entregas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
              example:
                deliveries:
                  - id: dlv_8b1f4e2a6c9d3075
                    webhook_id: wh_3c7e1a9f5b2d4806
                    event_id: evt_5f2c9a1b7d3e4f60
                    event_type: message.received
                    instance_id: inst_7f3a9c2e5b1d4086
                    status: failed
                    attempts: 19
                    expires_at: "2026-10-18T14:02:11Z"
                    last_status_code: 503
                    last_error: "http 503"
                    created_at: "2026-10-17T14:02:11Z"
                    updated_at: "2026-10-18T14:02:11Z"
                    event: { id: evt_5f2c9a1b7d3e4f60, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T14:02:11.204Z", data: { id: msg_e29d4b8a0f6c1357, chat: 5511999999999@s.whatsapp.net, from_me: false, source: contact, type: text, text: "Oi!", timestamp: "2026-10-17T14:02:10Z" } }
                next_cursor: eyJzIjo0Mn0
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WebhookNotFound" }

  /v1/webhooks/{wid}/deliveries/{delivery_id}/retry:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - name: delivery_id
        in: path
        required: true
        description: "Id da entrega (`dlv_...`)."
        schema: { type: string }
    post:
      tags: [Webhooks]
      operationId: retryDelivery
      x-litezap-milestone: M3
      x-zapi: "(sem equivalente)"
      summary: Reenviar entrega
      x-litezap-scope: instancia
      description: Recoloca uma entrega da dead-letter (`failed`) na fila, com mais 24 horas de prazo. Só entregas `failed` podem ser reenviadas.
      responses:
        "200":
          description: A entrega, de volta a `pending`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/WebhookNotFound" }
        "409": { $ref: "#/components/responses/RetryConflict" }
        "503": { $ref: "#/components/responses/ShuttingDown" }

  /v1/instances/{id}/presence/subscribe:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Eventos em tempo real]
      operationId: subscribePresence
      x-litezap-milestone: M7
      x-zapi: "Status do chat (presença)"
      x-litezap-notes: "Exige presence.online, que silencia as notificações do celular."
      summary: Assinar presença de um contato
      x-litezap-scope: instancia
      description: |
        Pede ao WhatsApp as mudanças de online/offline (e visto por último, se o contato mostra) de um
        contato; chegam como `chat.presence` com `state` `online`/`offline`. Exige
        `presence.online` nas settings (`409 presence_offline`). Até 20 assinaturas por minuto e 200 por dia por
        instância (`429 rate_limited`); recusada com `403 sending_suspended` enquanto o operador suspende
        envios. Valem até a conexão cair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: "Número com DDI ou JID de contato (grupos não têm presença)." }
            example: { to: "5511999999999" }
      responses:
        "204": { description: Assinado. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }

