      properties:
        target: { type: string, enum: [url, builtin, agents] }
        url: { type: string }
        secret: { type: string }
        enabled: { type: boolean }
        timeout: { type: string }
        context_messages: { type: integer, minimum: 0, maximum: 100 }
        groups_enabled: { type: boolean }
        human_pause: { type: string }
        pause_on_api_send: { type: boolean }
        ignore: { type: array, items: { type: string } }
        max_replies_per_window: { type: integer }
        reply_window: { type: string }
    AttendantAudio:
      type: object
      properties:
        base_url: { type: string, description: "Servidor OpenAI-compatível; vazio com provider openai = o mesmo servidor." }
        transcription_model: { type: string, description: "Ex.: whisper-1; vazio desliga a transcrição." }
        speech_model: { type: string, description: "Ex.: gpt-4o-mini-tts; vazio desliga a voz." }
        voice: { type: string }
    AIProviderPreset:
      type: object
      properties:
        id: { type: string, enum: [ollama, gemini_free, groq_free] }
        label: { type: string }
        provider: { type: string, enum: [openai] }
        base_url: { type: string }
        model: { type: string }
        models: { type: array, items: { type: string } }
        needs_key: { type: boolean }
        key_url: { type: string }
        local: { type: boolean }
        free: { type: boolean }
        quality: { type: string }
        speed: { type: string }
        privacy: { type: string }
    LocalAIPull:
      type: object
      nullable: true
      properties:
        model: { type: string }
        status: { type: string, description: "Última linha de status do Ollama (pulling manifest, verifying..., success)." }
        total_bytes: { type: integer }
        completed_bytes: { type: integer }
        percent: { type: number }
        done: { type: boolean }
        success: { type: boolean }
        error: { type: string }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LocalAIStatus:
      type: object
      properties:
        reachable: { type: boolean }
        version: { type: string }
        error: { type: string }
        base_url: { type: string, example: "http://127.0.0.1:11434/v1" }
        models: { type: array, items: { type: object, properties: { name: { type: string }, size_bytes: { type: integer }, parameter_size: { type: string }, family: { type: string } } } }
        ram_bytes: { type: integer, description: "Memória do computador (0 = desconhecida)." }
        recommended: { $ref: "#/components/schemas/LocalAIModelOption" }
        options: { type: array, items: { $ref: "#/components/schemas/LocalAIModelOption" } }
        recommended_installed: { type: boolean }
        download_url: { type: string }
        pull: { $ref: "#/components/schemas/LocalAIPull" }
    LocalAIModelOption:
      type: object
      properties:
        model: { type: string }
        size_bytes: { type: integer }
        size_label: { type: string, example: "4,7 GB" }
        min_ram_bytes: { type: integer }
        note: { type: string }
    AttendantSettings:
      type: object
      properties:
        configured: { type: boolean }
        provider: { type: string, enum: [anthropic, openai] }
        preset: { type: string, enum: ["", ollama, gemini_free, groq_free] }
        free: { type: boolean, description: "A configuração não custa nada (preset grátis ou servidor local): o painel mostra Grátis." }
        model: { type: string, example: claude-sonnet-5-5 }
        base_url: { type: string }
        max_tokens: { type: integer }
        daily_call_cap: { type: integer }
        chat_daily_call_cap: { type: integer }
        simulate_daily_cap: { type: integer }
        active_agent_id: { type: string }
        vision: { type: boolean }
        audio: { $ref: "#/components/schemas/AttendantAudio" }
        price_input_per_mtok: { type: number }
        price_output_per_mtok: { type: number }
        api_key_set: { type: boolean }
        audio_api_key_set: { type: boolean }
        ready: { type: boolean }
        not_ready: { type: string }
        transcription: { type: boolean }
        speech: { type: boolean }
        today: { type: object, properties: { day: { type: string }, calls: { type: integer }, input_tokens: { type: integer }, output_tokens: { type: integer }, cost_usd: { type: number } } }
    AttendantSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        provider: { type: string, enum: [anthropic, openai, ollama, gemini_free, groq_free] }
        preset: { type: string, enum: ["", ollama, gemini_free, groq_free], description: "Preset grátis; \"\" volta ao provedor personalizado." }
        model: { type: string }
        base_url: { type: string }
        max_tokens: { type: integer, minimum: 64, maximum: 8192 }
        daily_call_cap: { type: integer, minimum: 0 }
        chat_daily_call_cap: { type: integer, minimum: 0, description: "Chamadas por conversa por dia (padrão 40)." }
        simulate_daily_cap: { type: integer, minimum: 0, description: "Chamadas do simulador por dia (padrão 50)." }
        vision: { type: boolean }
        audio: { $ref: "#/components/schemas/AttendantAudio" }
        price_input_per_mtok: { type: number }
        price_output_per_mtok: { type: number }
        api_key: { type: string, writeOnly: true }
        audio_api_key: { type: string, writeOnly: true }
    AttendantProfile:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        mode: { type: string, enum: [vendedor, pedido, sdr, suporte, custom] }
        objective: { type: string }
        steps: { type: array, items: { type: string } }
        tone: { type: string }
        handoff_criteria: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string, enum: [handoff, lead, appointment, order_draft] } }
        business: { type: string, description: Contexto do negócio (texto livre, confiável). }
        knowledge:
          type: array
          maxItems: 300
          items:
            type: object
            properties:
              kind: { type: string, enum: [faq, product, hours, policy, info] }
              title: { type: string }
              content: { type: string }
              price: { type: number }
        language: { type: string, default: pt-BR }
        currency: { type: string, default: BRL }
        voice_reply: { type: string, enum: ["off", when_audio, always], default: "off" }
        call_followup: { type: boolean }
        call_hint: { type: string }
        max_reply_chars: { type: integer, minimum: 50, maximum: 4000, default: 1000 }
        hide_contact_name: { type: boolean }
    AttendantAgent:
      allOf:
        - { $ref: "#/components/schemas/AttendantProfile" }
        - type: object
          properties:
            id: { type: string }
            active: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    AgentTrigger:
      type: object
      properties:
        type: { type: string, enum: [message, manual], default: message, description: "message: cada mensagem nova (pelo hook de agente com target agents); manual: só Executar agora." }
        chats: { type: array, items: { type: string }, description: Só nestes chats (JIDs ou números). Vazio = todos. }
        labels: { type: array, items: { type: string }, description: Só em chats com uma destas etiquetas (id ou nome). }
        keywords: { type: array, items: { type: string }, description: Só quando a mensagem contém uma destas palavras (sem diferenciar maiúsculas). }
        groups: { type: boolean, default: false, description: Também em grupos (desligado = só conversas 1:1). }
    AgentLimits:
      type: object
      properties:
        max_steps: { type: integer, minimum: 1, maximum: 20, default: 8, description: Chamadas ao modelo por execução. }
        max_recipients: { type: integer, minimum: 1, maximum: 10, default: 3, description: Destinatários distintos por execução. }
        max_sends: { type: integer, minimum: 1, maximum: 50, default: 5, description: Envios por execução (também na conversa do gatilho; rascunhos contam). }
        max_writes: { type: integer, minimum: 1, maximum: 100, default: 10, description: Escritas por execução (envios, etiquetas, grupos, link de convite; rascunhos e sugestões contam). }
        max_group_changes: { type: integer, minimum: 1, maximum: 20, default: 3, description: Mudanças em grupos por execução. }
        daily_runs: { type: integer, minimum: 0, default: 200, description: Execuções por dia UTC (0 = sem limite do agente; os limites do Atendente IA continuam valendo). }
    AgentInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        mode: { type: string, enum: [aprovacao, autonomo, sugerir], description: "aprovacao: escritas viram rascunhos; autonomo: executa; sugerir: só notas." }
        instructions: { type: string, maxLength: 20000, description: "O que o agente faz (confiável: escrito por você)." }
        tools: { type: array, items: { type: string, enum: [ler, ler_outros_chats, responder_no_chat, enviar_outros_chats, etiquetas, grupos, midia] } }
        trigger: { $ref: "#/components/schemas/AgentTrigger" }
        limits: { $ref: "#/components/schemas/AgentLimits" }
        runtime: { type: string, enum: [provider, codex_cli], default: provider, description: "Quem pensa. provider: o provedor de IA da instância (chave de API). codex_cli (opt-in): o Codex CLI logado neste computador com a sua conta ChatGPT; só o token admin cria, edita, executa ou simula um agente codex_cli. Veja Guias > IA por assinatura." }
        accept_runtime_notice: { type: boolean, description: "Obrigatório (true) ao mudar um agente para codex_cli: confirma o aviso sobre os termos da OpenAI e os limites do seu plano." }
    Agent:
      type: object
      properties:
        id: { type: string, example: agn_3c9e1a7f5d2b4086 }
        name: { type: string }
        enabled: { type: boolean }
        mode: { type: string, enum: [aprovacao, autonomo, sugerir] }
        instructions: { type: string }
        tools: { type: array, items: { type: string } }
        trigger: { $ref: "#/components/schemas/AgentTrigger" }
        limits: { $ref: "#/components/schemas/AgentLimits" }
        runtime: { type: string, enum: [provider, codex_cli] }
        today: { type: object, properties: { runs: { type: integer }, cost_usd: { type: number } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentStep:
      type: object
      properties:
        n: { type: integer, description: Chamada ao modelo que pediu a ferramenta. }
        tool: { type: string }
        args: { type: string, description: Argumentos (JSON resumido). }
        outcome: { type: string, enum: [read, executed, draft, note, dry_run, refused, error] }
        result: { type: string, description: Resultado resumido (ou o motivo da recusa). }
        draft_id: { type: string }
        chat: { type: string, description: Destinatário ou chat em que a escrita age. }
    AgentRun:
      type: object
      properties:
        id: { type: string, example: arun_7a3c1e9f5d2b4068 }
        agent_id: { type: string }
        agent_name: { type: string }
        trigger: { type: string, enum: [message, manual] }
        chat: { type: string }
        message_id: { type: string }
        mode: { type: string }
        status: { type: string, enum: [running, completed, step_limit, failed, discarded], description: "discarded: um humano assumiu o chat durante a execução." }
        steps: { type: array, items: { $ref: "#/components/schemas/AgentStep" } }
        output: { type: string, description: Resumo final do agente para você (não é enviado a ninguém). }
        model: { type: string }
        model_calls: { type: integer }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: number }
        sent: { type: integer, description: Escritas executadas. }
        drafts: { type: integer, description: Rascunhos criados. }
        error: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        dry_run: { type: boolean, description: Só no simulador. }
    AgentDraft:
      type: object
      properties:
        id: { type: string, example: adr_5b1d3f9a7c2e4086 }
        agent_id: { type: string }
        agent_name: { type: string }
        run_id: { type: string }
        tool: { type: string, example: send_message }
        chat: { type: string, example: "5511999999999@s.whatsapp.net" }
        args: { type: object, description: Os argumentos exatos que a aprovação executa. }
        status: { type: string, enum: [pending, approving, approved, rejected, failed, expired] }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        result: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
  responses:
    InstanceOK:
      description: A instância logo após a ação (o estado pode ainda ser o anterior).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Instance" }
    ValidationFailed:
      description: "`validation_failed`: corpo ou campo inválido."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_failed, message: "phone must have 10 to 15 digits including country code", retryable: false } }
    SendBadRequest:
      description: "`validation_failed` ou `invalid_number` (o número não tem WhatsApp)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_number, message: "number is not on WhatsApp", retryable: false } }
    Unauthorized:
      description: "`unauthorized`: token ausente ou inválido."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "missing or invalid token", retryable: false } }
    Forbidden:
      description: "`forbidden`: token sem acesso ao recurso."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: "token not allowed for this resource", retryable: false } }
    InstanceNotFound:
      description: "`instance_not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_found, message: "instance not found", retryable: false } }
    WebhookNotFound:
      description: "`not_found`: webhook inexistente ou de outra instância."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "webhook not found", retryable: false } }
    RetryConflict:
      description: "`conflict`: só entregas `failed` podem ser reenviadas."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "only failed deliveries can be retried (status: pending)", retryable: false } }
    NotFound:
      description: "`not_found` (mensagem, chat, contato ou mídia) ou `instance_not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "message not found", retryable: false } }
    ChatConflict:
      description: "`app_state_not_synced` (o celular ainda não mandou as chaves do app state; tente de novo), `app_state_out_of_sync` (a cópia local do app state divergiu; uma ressincronização foi agendada, ou rode `POST /app-state/resync`), `pin_limit` (já há 3 fixados), `instance_not_connected` ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: app_state_not_synced, message: "chat state keys not synced from the phone yet; keep the phone online and try again shortly", retryable: true } }
    LookupRateLimited:
      description: "`rate_limited`: cota de consultas de contato esgotada (30/min, 1000/dia por instância)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many contact lookups; at most 30 per minute and 1000 per day per instance", retryable: true } }
    InstanceConflict:
      description: "`instance_not_connected` (worker parado ou número deslogado) ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_connected, message: "instance worker is not running", retryable: true } }
    NotPairing:
      description: "`instance_not_pairing`: a instância não está aguardando pareamento."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_pairing, message: "instance is not waiting for a QR scan (state: connected)", retryable: false } }
    SendConflict:
      description: "`conflict` (client_message_id reusado com outro conteúdo), `instance_not_connected` (deslogada) ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "client_message_id was already used for a different message", retryable: false } }
    SignedDisabled:
      description: "`conflict`: URLs assinadas desativadas (fora de loopback sem public_url)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "signed URLs need public_url when the API is not bound to loopback", retryable: false } }
    MessageExpired:
      description: "`message_expired`: não enviada antes de expires_after (com ?wait=true)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: message_expired, message: "message not sent before expires_after", retryable: false } }
    MediaUnavailable:
      description: "`media_unavailable`: a mídia expirou no WhatsApp."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_unavailable, message: "media is no longer available on WhatsApp", retryable: false } }
    MediaTooLarge:
      description: "`media_too_large`: acima do limite do tipo ou corpo acima de 140MB."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_too_large, message: "image exceeds the size limit", retryable: false } }
    MediaFetchFailed:
      description: "`media_fetch_failed`: media.url não pôde ser baixada."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_fetch_failed, message: "media.url could not be downloaded", retryable: true } }
    RateLimited:
      description: "`rate_limited`: cota de consultas de check-numbers esgotada (10/min, 200/dia)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many number lookups; try again in a minute", retryable: true } }
    BusyOrShuttingDown:
      description: "`rate_limited` (muitos envios grandes simultâneos e o cliente desistiu de esperar vaga) ou `shutting_down`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many large sends in progress", retryable: true } }
    ShuttingDown:
      description: "`shutting_down`: servidor encerrando."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: shutting_down, message: "server is shutting down", retryable: true } }
    WorkerError:
      description: "`worker_error`: o worker recusou ou falhou a operação."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: worker_error, message: "worker request failed", retryable: true } }
    GroupNotFound:
      description: "`group_not_found`: grupo inexistente ou a instância não participa dele (ou `instance_not_found`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: group_not_found, message: "group not found (or the instance is not in it)", retryable: false } }
    GroupForbidden:
      description: "`group_forbidden`: o WhatsApp recusou (a instância não é admin ou não participa); ou `forbidden` (token)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: group_forbidden, message: "not allowed: the account must be a member (or an admin) of the group", retryable: false } }
    GroupRateLimited:
      description: "`rate_limited`: cota de grupos (`settings.groups`), 10s entre lotes de adição, cota de consultas ao checar participantes, ou limite do próprio WhatsApp."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "participant add limit reached: at most 10 per hour per instance (0 left; settings.groups.max_adds_per_hour)", retryable: true } }
    InviteRevoked:
      description: "`invite_revoked`: o link de convite foi revogado."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invite_revoked, message: "the invite link was revoked", retryable: false } }
    WorkerTimeout:
      description: "`worker_timeout`: o worker não respondeu a tempo."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: worker_timeout, message: "instance worker did not answer in time", retryable: true } }

# Eventos entregues por webhook e SSE (catálogo v1). Fonte no motor: internal/events.
    SocialRateLimited:
      description: "`rate_limited`: limite da instância (10 status/dia; 20 publicações em canal/dia; seguir canais 3/min, 10/h e 30/dia; silenciar 10/min; criar canal 2/dia; reagir 30/min; etiquetas 30/min)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "daily status (10 per day) limit reached for this instance; try again later", retryable: true } }
    CatalogNotFound:
      description: "`catalog_not_found` (número sem catálogo), `product_not_found` (produto ausente ou oculto) ou `order_not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: catalog_not_found, message: "this number has no WhatsApp catalog", retryable: false } }
    CatalogRateLimited:
      description: "`rate_limited`: o serviço de catálogo do WhatsApp limitou (por IP) ou o limite da instância (30 leituras novas/min, 60 fotos/min)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "the WhatsApp catalog service is rate limiting; try again in a few minutes", retryable: true } }
    UpstreamChanged:
      description: "`upstream_changed`: o WhatsApp mudou o token ou os doc_ids do serviço de catálogo. Atualize `whatsapp_catalog` na config (sem nova versão) ou o LiteZap."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: upstream_changed, message: "WhatsApp changed its catalog service (catalog: the answer has no xwa_product_catalog_get_product_catalog …); update whatsapp_catalog in the config or LiteZap", retryable: false } }
    CatalogUnavailable:
      description: "`catalog_unavailable`: o serviço de catálogo não respondeu (rede, proxy ou erro do servidor)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: catalog_unavailable, message: "the WhatsApp catalog service could not be reached", retryable: true } }
    BusinessRequired:
      description: "`business_account_required`: só contas WhatsApp Business; ou `app_state_not_synced` logo após parear."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: business_account_required, message: "this needs a WhatsApp Business account", retryable: false } }
webhooks:
  instance.status:
    post:
      summary: Estado da instância mudou
      x-slug: instance-status
      x-litezap-milestone: M3
      x-zapi: Ao conectar / Ao desconectar
      description: |
        Emitido em toda transição de estado da instância (`starting`, `qr_pending`, `connecting`,
        `connected`, `reconnecting`, `logged_out`, `banned`, `failed`, `stopped`). `reason` explica alguns
        estados, como `proxy_unreachable` em `reconnecting` ou `temp_banned:<duração>` em `failed`.
      x-related: [instance.qr, instance.pair_code]
      x-fields:
        - [state, string, "Novo estado. Veja Instâncias e estados."]
        - [reason, string, "Motivo, quando houver (opcional)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              conectada:
                summary: Conectou
                value: { id: evt_0a7d3c9e1f5b2486, type: instance.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:40:02.511Z", data: { state: connected } }
              proxy:
                summary: Proxy fora do ar
                value: { id: evt_6b2e8d0a4c1f7395, type: instance.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T15:12:44.020Z", data: { state: reconnecting, reason: proxy_unreachable } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  instance.qr:
    post:
      summary: Novo QR de pareamento
      x-slug: instance-qr
      x-litezap-milestone: M3
      x-zapi: (sem equivalente; QR por polling)
      description: |
        Emitido a cada novo QR enquanto a instância está em `qr_pending`. Mostre `code` como QR (qualquer
        biblioteca de QR serve) em vez de fazer polling em `GET /qr`. `timeout_ms` é a validade aproximada
        deste código.
      x-related: [instance.status, instance.pair_code]
      x-fields:
        - [code, string, "Conteúdo do QR."]
        - [timeout_ms, integer, "Validade do código em milissegundos (opcional)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_1c8f3a6e9d2b4057, type: instance.qr, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:39:10.004Z", data: { code: "2@kQ3x...,Zm9v...,YmFy...,MQ==", timeout_ms: 20000 } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  instance.pair_code:
    post:
      summary: Código de pareamento gerado
      x-slug: instance-pair-code
      x-litezap-milestone: M3
      x-zapi: (sem equivalente)
      description: Emitido quando `POST /pair-phone` gera um código para digitar no celular.
      x-related: [instance.status, instance.qr]
      x-fields:
        - [code, string, "Código para digitar em Aparelhos conectados > Conectar com número de telefone."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_9e4b1d7a3f0c6285, type: instance.pair_code, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:39:30.718Z", data: { code: "ABCD-EFGH" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.received:
    post:
      summary: Mensagem recebida
      x-slug: message-received
      x-litezap-milestone: M3
      x-zapi: Ao receber
      description: |
        Emitido para cada mensagem nova de outra pessoa (`source: "contact"`), em chat direto ou grupo.
        Mídia vem descrita em `media`, com `url` para baixar pela API (autenticada). Mensagens do histórico
        sincronizado no pareamento não geram este evento (só um `history.synced`), e uma mensagem que chega
        duas vezes (reconexão do worker) gera um único evento. Reações chegam como `message.reaction`.
      x-related: [message.reaction, message.sent, history.synced]
      x-fields:
        - [id, string, "Id LiteZap da mensagem no log."]
        - [wa_message_id, string, "Id da mensagem no WhatsApp."]
        - [chat, string, "JID do chat (pessoa ou grupo)."]
        - [sender, string, "JID de quem enviou (em grupos, o participante)."]
        - [from_me, boolean, "Sempre false aqui."]
        - [is_group, boolean, "true em grupos."]
        - [push_name, string, "Nome de perfil de quem enviou."]
        - [source, string, "contact."]
        - [type, string, "text, image, video, audio, document, sticker, location, contact..."]
        - [text, string, "Texto ou legenda."]
        - [media, object, "id, kind, mime, size, file_name, seconds, ptt, url (opcional)."]
        - [timestamp, string, "Hora da mensagem (RFC 3339)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              texto:
                summary: Texto
                value: { id: evt_5f2c9a1b7d3e4f60, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:45:00.123Z", data: { id: msg_e29d4b8a0f6c1357, wa_message_id: 3A9F2C7D1E0B4A5C6D7E, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: text, text: "Oi, meu pedido já saiu?", timestamp: "2026-10-17T13:45:00Z" } }
              imagem:
                summary: Imagem com legenda
                value: { id: evt_2d6a9f1c4e8b3075, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:46:12.877Z", data: { id: msg_4f0b7c2e9a1d6358, wa_message_id: 3A1B5D9F2C7E4A0B8C6D, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: image, text: "Foto do produto", media: { id: med_5b8e1f3c9d2a7046, kind: image, mime: image/jpeg, size: 182345, url: /v1/instances/inst_7f3a9c2e5b1d4086/media/med_5b8e1f3c9d2a7046 }, timestamp: "2026-10-17T13:46:12Z" } }
              voz:
                summary: Mensagem de voz
                value: { id: evt_7a3d0f6b2c9e1484, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:47:30.402Z", data: { id: msg_9c2e5a8d1f4b7063, wa_message_id: 3A7E2B9D4F1C6A0E5B8D, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: audio, media: { id: med_1d6f3b9e4a2c8057, kind: audio, mime: "audio/ogg; codecs=opus", size: 23110, seconds: 7, ptt: true, url: /v1/instances/inst_7f3a9c2e5b1d4086/media/med_1d6f3b9e4a2c8057 }, timestamp: "2026-10-17T13:47:30Z" } }
              grupo:
                summary: Texto em grupo
                value: { id: evt_3e9b6d2a0f7c5148, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:50:05.611Z", data: { id: msg_6a1d8f3c0e5b9274, wa_message_id: 3A0C4E8B2D6F1A9C7E3B, chat: 120363000000000001@g.us, sender: 5511988887777@s.whatsapp.net, from_me: false, is_group: true, push_name: João, source: contact, type: text, text: "Reunião às 15h", timestamp: "2026-10-17T13:50:05Z" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.sent:
    post:
      summary: Mensagem enviada
      x-slug: message-sent
      x-litezap-milestone: M3
      x-zapi: Ao enviar / Notificar enviadas por mim
      description: |
        Emitido quando um envio pela API é confirmado pelo WhatsApp (`source: "api"`, `id` = id do item da
        fila) ou quando alguém envia uma mensagem pelo celular do número conectado (`source: "device"`).
        Útil para detectar que um humano respondeu pelo celular.
      x-related: [message.status, message.received]
      x-fields:
        - [id, string, "Id LiteZap (em envios pela API, o id devolvido por POST /messages)."]
        - [wa_message_id, string, "Id no WhatsApp."]
        - [chat, string, "JID do chat."]
        - [from_me, boolean, "Sempre true."]
        - [disappearing, string, "Mensagens temporárias quando conhecidas: off, 24h, 7d ou 90d (opcional)."]
        - [source, string, "api, device ou contact (o contato mudou as mensagens temporárias)."]
        - [type, string, "Tipo da mensagem."]
        - [text, string, "Texto ou legenda."]
        - [timestamp, string, "Hora do envio."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              api:
                summary: Enviada pela API
                value: { id: evt_8c4f1a7d3b0e6259, type: message.sent, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:50:03.090Z", data: { id: msg_a41c9e07d2b35f68, wa_message_id: 3EB0A1B2C3D4E5F6A7B8C9, chat: 5511999999999@s.whatsapp.net, from_me: true, source: api, type: text, text: "Seu pedido saiu para entrega!", timestamp: "2026-10-17T13:50:03Z" } }
              celular:
                summary: Enviada pelo celular
                value: { id: evt_4b0e7c3a9f2d6158, type: message.sent, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:55:41.330Z", data: { id: msg_2e7a4c9f1b6d3085, wa_message_id: 3AF1C8E2B5D9A4F7C0E1, chat: 5511999999999@s.whatsapp.net, from_me: true, source: device, type: text, text: "Já está a caminho!", timestamp: "2026-10-17T13:55:41Z" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.status:
    post:
      summary: Status de mensagem enviada
      x-slug: message-status
      x-litezap-milestone: M3
      x-zapi: Status da mensagem
      description: |
        Acompanha as mensagens enviadas pela API: `sent`, `delivered`, `read` ou `failed` (com `error` no
        formato `codigo: detalhe`). Se um recibo chegar antes da confirmação do envio, `delivered` (ou
        `read`) pode chegar antes de `message.sent`, e o `sent` é omitido. `played` (M7) sai quando o
        contato reproduz um áudio de voz, vídeo ou mídia de visualização única; é o status mais alto
        (um `read` atrasado não o rebaixa). Mensagem apagada sai em `message.revoked`.
      x-related: [message.sent]
      x-fields:
        - [id, string, "Id devolvido por POST /messages."]
        - [wa_message_id, string, "Id no WhatsApp (opcional)."]
        - [chat, string, "JID do chat."]
        - [status, string, "sent, delivered, read, played ou failed."]
        - [error, string, "Motivo, em failed (opcional)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              lida:
                summary: Lida
                value: { id: evt_0f5c2a8e6d1b9374, type: message.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:51:20.144Z", data: { id: msg_a41c9e07d2b35f68, wa_message_id: 3EB0A1B2C3D4E5F6A7B8C9, chat: 5511999999999@s.whatsapp.net, status: read } }
              falhou:
                summary: Falhou
                value: { id: evt_6d1a9e4c2f7b0583, type: message.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:52:00.010Z", data: { id: msg_0c5e8b2f9a7d4613, chat: 5511888888888@s.whatsapp.net, status: failed, error: "invalid_number: number is not on WhatsApp" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.reaction:
    post:
      summary: Reação recebida
      x-slug: message-reaction
      x-litezap-milestone: M3
      x-zapi: Ao receber (reação)
      description: Emitido quando alguém reage a uma mensagem. `text` é o emoji (vazio = reação removida) e `reaction_to` o id WhatsApp da mensagem reagida.
      x-related: [message.received]
      x-fields:
        - [type, string, "reaction."]
        - [text, string, "Emoji; vazio quando a reação foi removida."]
        - [reaction_to, string, "wa_message_id da mensagem reagida."]
        - [chat, string, "JID do chat."]
        - [sender, string, "Quem reagiu."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_2a7e4c1f9b6d3058, type: message.reaction, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:53:08.555Z", data: { id: msg_7d3b0e6a2c9f4185, wa_message_id: 3A5D8F1B4E7C0A3D6F9B, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: reaction, text: "👍", reaction_to: 3EB0A1B2C3D4E5F6A7B8C9, timestamp: "2026-10-17T13:53:08Z" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.edited:
    post:
      summary: Mensagem editada
      x-slug: message-edited
      x-litezap-milestone: M6
      x-zapi: Ao receber (mensagem editada)
      description: |
        Uma mensagem foi editada: pela API (`type: edit`), pelo celular ou pelo contato. Edições recebidas
        só valem do próprio autor; as demais são ignoradas. O log é atualizado (`edited_at` e texto novo).
        `id` vem vazio quando a mensagem original não está no log.
      x-related: [message.revoked, message.received]
