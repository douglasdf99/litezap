      summary: Identidade do token
      x-litezap-scope: qualquer
      description: Diz quem é o token que fez a chamada. `admin` é `true` para o token admin; com token de instância vem também o `instance_id`. Útil para clientes descobrirem o próprio escopo (o `litezap mcp` usa esta rota).
      responses:
        "200":
          description: Escopo do token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin: { type: boolean }
                  role: { type: string, enum: [operator, admin, instance] }
                  instance_id: { type: string, description: Só com token de instância ou chave de API. }
                  key_id: { type: string, description: "Só com chave de API (marco 11)." }
                  scopes: { type: array, items: { type: string }, description: "Só com chave de API." }
              examples:
                instancia:
                  summary: Token de instância
                  value: { admin: false, instance_id: inst_7f3a9c2e5b1d4086 }
                admin:
                  summary: Token admin
                  value: { admin: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

