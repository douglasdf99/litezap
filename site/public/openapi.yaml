              schema: { $ref: "#/components/schemas/Picture" }
              example: { jid: 5511999999999@s.whatsapp.net, id: "1729241234", url: "https://pps.whatsapp.net/v/t61.24694-24/...", type: image }
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
        "429": { $ref: "#/components/responses/LookupRateLimited" }
  /v1/instances/{id}/contacts/{jid}/profile:
