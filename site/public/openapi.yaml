          content:
            application/json:
              schema: { $ref: "#/components/schemas/Privacy" }
              example: { last_seen: contacts, online: all, profile_photo: all, about: contacts, groups_add: contacts, read_receipts: all, calls: all, messages: all }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    patch:
      tags: [Perfil e privacidade]
      operationId: updatePrivacy
      x-litezap-milestone: M9
      x-zapi: "Visto por último / Foto / Recado / Grupos / Online / Confirmação de leitura / Mensagens temporárias"
      summary: Mudar a privacidade
      x-litezap-scope: instancia
      description: |
        Cada campo é aplicado em seguida (uma falha para ali). Valores: `all`, `contacts`,
        `contact_blacklist`, `none` (`last_seen`, `profile_photo`, `about`, `groups_add`); `all`/`none`
        (`read_receipts`); `all`/`match_last_seen` (`online`); `all`/`known` (`calls`); `all`/`contacts`
        (`messages`). `default_disappearing_seconds` (0, 86400, 604800 ou 7776000) vale para conversas
        novas. As listas de exceção ("meus contatos, exceto…") só no celular.
      requestBody:
        required: true
        content:
