        muted: { type: boolean }
        mute_seconds: { type: integer, minimum: 0, maximum: 31622400, description: "Com `muted: true`: duração; 0 ou ausente = até reativar." }
        unread: { type: boolean, description: "true marca como não lido; false lê (e manda os recibos)." }
    Picture:
      type: object
      properties:
        jid: { type: string }
        id: { type: string, description: Muda quando a foto muda. }
        url: { type: string, description: CDN do WhatsApp; expira. }
        type: { type: string, enum: [image, preview] }
    ContactProfile:
      type: object
      properties:
        jid: { type: string }
        lid: { type: string }
        about: { type: string }
        picture_id: { type: string }
        verified_name: { type: string, description: Contas business. }
        business:
          type: object
          properties:
            address: { type: string }
            email: { type: string }
            categories: { type: array, items: { type: string } }
    Blocklist:
      type: object
      properties:
        blocked: { type: array, items: { type: string } }
    Profile:
      type: object
      properties:
        jid: { type: string }
        lid: { type: string }
        name: { type: string, description: Nome de perfil (push name). }
        about: { type: string }
        business_name: { type: string }
        platform: { type: string, description: Plataforma do celular pareado. }
        picture: { $ref: "#/components/schemas/Picture" }
    ProfilePatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 25 }
        about: { type: string, maxLength: 139 }
    PictureInput:
      type: object
      description: Exatamente um dos campos.
      properties:
        url: { type: string, format: uri }
        base64: { type: string }
    Privacy:
      type: object
      properties:
        last_seen: { type: string, enum: [all, contacts, contact_blacklist, none] }
        online: { type: string, enum: [all, match_last_seen] }
        profile_photo: { type: string, enum: [all, contacts, contact_blacklist, none] }
        about: { type: string, enum: [all, contacts, contact_blacklist, none] }
        groups_add: { type: string, enum: [all, contacts, contact_blacklist, none] }
        read_receipts: { type: string, enum: [all, none] }
        calls: { type: string, enum: [all, known] }
        messages: { type: string, enum: [all, contacts] }
    PrivacyPatch:
      allOf:
        - $ref: "#/components/schemas/Privacy"
        - type: object
          properties:
            default_disappearing_seconds: { type: integer, enum: [0, 86400, 604800, 7776000] }
    ChatUpdatedEvent:
      type: object
      description: Dados de `chat.updated`.
      properties:
        chat: { type: string }
        is_group: { type: boolean }
        changed: { type: array, items: { type: string, enum: [archived, pinned, muted, unread, deleted, cleared, starred] } }
        archived: { type: boolean }
        pinned: { type: boolean }
        muted: { type: boolean }
        muted_until: { type: string, format: date-time }
        unread: { type: boolean }
        deleted: { type: boolean }
        cleared: { type: boolean }
        message_id: { type: string }
        wa_message_id: { type: string }
        starred: { type: boolean }
        source: { type: string, enum: [api, device] }
        timestamp: { type: string, format: date-time }
    ChatPage:
      type: object
      properties:
        chats: { type: array, items: { $ref: "#/components/schemas/Chat" } }
        next_cursor: { type: string, description: Ausente na última página. }
    MessagePage:
      type: object
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        next_cursor: { type: string, description: Ausente na última página. }
    Contact:
      type: object
      properties:
        jid: { type: string }
        name: { type: string }
        push_name: { type: string }
        business_name: { type: string }
    NumberResult:
      type: object
      properties:
        phone: { type: string }
        exists: { type: boolean }
        jid: { type: string }
    SignedURL:
      type: object
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
    WebhookInput:
      type: object
      properties:
        url: { type: string, description: "URL absoluta http(s), até 2048 caracteres. Obrigatório na criação." }
        events:
          type: array
          maxItems: 32
          items: { type: string }
          description: "Filtros: tipos exatos, famílias (`message.*`) ou `*`. Obrigatório na criação."
        secret: { type: string, description: "16 a 256 caracteres. Omitido na criação: gerado. Vazio no PATCH: gera outro." }
        instance_id: { type: string, description: "Só na criação. Admin: instância do webhook (omitido = global). Token de instância: só a própria." }
        enabled: { type: boolean, default: true }
        version: { type: integer, enum: [1], description: Versão do envelope. Só 1 por enquanto. }
        filters: { $ref: "#/components/schemas/WebhookFilters" }
    Webhook:
      type: object
      properties:
        id: { type: string }
        instance_id: { type: string, description: Ausente em webhook global. }
        url: { type: string }
        events: { type: array, items: { type: string } }
        version: { type: integer }
        enabled: { type: boolean }
        filters: { $ref: "#/components/schemas/WebhookFilters" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        secret: { type: string, description: Só na criação e quando trocado por PATCH. }
    Delivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        instance_id: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: Prazo para entregar antes de ir para a dead-letter. }
        last_status_code: { type: integer }
        last_error: { type: string, description: "Ex.: `http 503`, `timeout: ...`, `blocked: ...`." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        event: { $ref: "#/components/schemas/Envelope" }
    DeliveryPage:
      type: object
      properties:
        deliveries: { type: array, items: { $ref: "#/components/schemas/Delivery" } }
        next_cursor: { type: string }
    Envelope:
      type: object
      required: [id, type, version, instance_id, timestamp, data]
      properties:
        id: { type: string, description: "Id do evento (`evt_...`). Use para deduplicar." }
        type: { type: string }
        version: { type: integer, enum: [1] }
        instance_id: { type: string }
        timestamp: { type: string, format: date-time }
        data: { type: object, description: Varia por tipo de evento. }
    EventMessage:
      type: object
      description: Mensagem em `message.received`, `message.sent`, `message.reaction` e `message.button_reply`.
      properties:
        id: { type: string, description: "Id LiteZap (em envios pela API, o id do item da fila)." }
        wa_message_id: { type: string }
        chat: { type: string }
        sender: { type: string }
        from_me: { type: boolean }
        is_group: { type: boolean }
        push_name: { type: string, description: Nome de perfil de quem enviou. }
        source: { type: string, enum: [contact, api, device] }
        type: { type: string }
        text: { type: string, description: "Texto, legenda ou emoji da reação." }
        media: { $ref: "#/components/schemas/MediaInfo" }
        reaction_to: { type: string }
        button_reply:
          type: object
          description: "Só em `message.button_reply`."
          properties:
            kind: { type: string, enum: [button, list, template, interactive] }
            id: { type: string }
            title: { type: string }
            description: { type: string }
        timestamp: { type: string, format: date-time }

  responses:
    InstanceOK:
      description: A instância logo após a ação (o estado pode ainda ser o anterior).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Instance" }
    ValidationFailed:
      description: "`validation_failed`: corpo ou campo inválido."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: validation_failed, message: "phone must have 10 to 15 digits including country code", retryable: false } }
    SendBadRequest:
      description: "`validation_failed` ou `invalid_number` (o número não tem WhatsApp)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invalid_number, message: "number is not on WhatsApp", retryable: false } }
    Unauthorized:
      description: "`unauthorized`: token ausente ou inválido."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthorized, message: "missing or invalid token", retryable: false } }
    Forbidden:
      description: "`forbidden`: token sem acesso ao recurso."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: "token not allowed for this resource", retryable: false } }
    InstanceNotFound:
      description: "`instance_not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_found, message: "instance not found", retryable: false } }
    WebhookNotFound:
      description: "`not_found`: webhook inexistente ou de outra instância."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "webhook not found", retryable: false } }
    RetryConflict:
      description: "`conflict`: só entregas `failed` podem ser reenviadas."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "only failed deliveries can be retried (status: pending)", retryable: false } }
    NotFound:
      description: "`not_found` (mensagem, chat, contato ou mídia) ou `instance_not_found`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: "message not found", retryable: false } }
    ChatConflict:
      description: "`app_state_not_synced` (o celular ainda não mandou as chaves do app state; tente de novo), `pin_limit` (já há 3 fixados), `instance_not_connected` ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: app_state_not_synced, message: "chat state keys not synced from the phone yet; keep the phone online and try again shortly", retryable: true } }
    LookupRateLimited:
      description: "`rate_limited`: cota de consultas de contato esgotada (30/min, 1000/dia por instância)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many contact lookups; at most 30 per minute and 1000 per day per instance", retryable: true } }
    InstanceConflict:
      description: "`instance_not_connected` (worker parado ou número deslogado) ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_connected, message: "instance worker is not running", retryable: true } }
    NotPairing:
      description: "`instance_not_pairing`: a instância não está aguardando pareamento."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: instance_not_pairing, message: "instance is not waiting for a QR scan (state: connected)", retryable: false } }
    SendConflict:
      description: "`conflict` (client_message_id reusado com outro conteúdo), `instance_not_connected` (deslogada) ou `instance_banned`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "client_message_id was already used for a different message", retryable: false } }
    SignedDisabled:
      description: "`conflict`: URLs assinadas desativadas (fora de loopback sem public_url)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: conflict, message: "signed URLs need public_url when the API is not bound to loopback", retryable: false } }
    MessageExpired:
      description: "`message_expired`: não enviada antes de expires_after (com ?wait=true)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: message_expired, message: "message not sent before expires_after", retryable: false } }
    MediaUnavailable:
      description: "`media_unavailable`: a mídia expirou no WhatsApp."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_unavailable, message: "media is no longer available on WhatsApp", retryable: false } }
    MediaTooLarge:
      description: "`media_too_large`: acima do limite do tipo ou corpo acima de 140MB."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_too_large, message: "image exceeds the size limit", retryable: false } }
    MediaFetchFailed:
      description: "`media_fetch_failed`: media.url não pôde ser baixada."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: media_fetch_failed, message: "media.url could not be downloaded", retryable: true } }
    RateLimited:
      description: "`rate_limited`: cota de consultas de check-numbers esgotada (10/min, 200/dia)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many number lookups; try again in a minute", retryable: true } }
    BusyOrShuttingDown:
      description: "`rate_limited` (muitos envios grandes simultâneos e o cliente desistiu de esperar vaga) ou `shutting_down`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "too many large sends in progress", retryable: true } }
    ShuttingDown:
      description: "`shutting_down`: servidor encerrando."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: shutting_down, message: "server is shutting down", retryable: true } }
    WorkerError:
      description: "`worker_error`: o worker recusou ou falhou a operação."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: worker_error, message: "worker request failed", retryable: true } }
    GroupNotFound:
      description: "`group_not_found`: grupo inexistente ou a instância não participa dele (ou `instance_not_found`)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: group_not_found, message: "group not found (or the instance is not in it)", retryable: false } }
    GroupForbidden:
      description: "`group_forbidden`: o WhatsApp recusou (a instância não é admin ou não participa); ou `forbidden` (token)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: group_forbidden, message: "not allowed: the account must be a member (or an admin) of the group", retryable: false } }
    GroupRateLimited:
      description: "`rate_limited`: cota de grupos (`settings.groups`), 10s entre lotes de adição, cota de consultas ao checar participantes, ou limite do próprio WhatsApp."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: rate_limited, message: "participant add limit reached: at most 10 per hour per instance (0 left; settings.groups.max_adds_per_hour)", retryable: true } }
    InviteRevoked:
      description: "`invite_revoked`: o link de convite foi revogado."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: invite_revoked, message: "the invite link was revoked", retryable: false } }
    WorkerTimeout:
      description: "`worker_timeout`: o worker não respondeu a tempo."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: worker_timeout, message: "instance worker did not answer in time", retryable: true } }

# Eventos entregues por webhook e SSE (catálogo v1). Fonte no motor: internal/events.
webhooks:
  instance.status:
    post:
      summary: Estado da instância mudou
      x-slug: instance-status
      x-litezap-milestone: M3
      x-zapi: Ao conectar / Ao desconectar
      description: |
        Emitido em toda transição de estado da instância (`starting`, `qr_pending`, `connecting`,
        `connected`, `reconnecting`, `logged_out`, `banned`, `failed`, `stopped`). `reason` explica alguns
        estados, como `proxy_unreachable` em `reconnecting` ou `temp_banned:<duração>` em `failed`.
      x-related: [instance.qr, instance.pair_code]
      x-fields:
        - [state, string, "Novo estado. Veja Instâncias e estados."]
        - [reason, string, "Motivo, quando houver (opcional)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              conectada:
                summary: Conectou
                value: { id: evt_0a7d3c9e1f5b2486, type: instance.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:40:02.511Z", data: { state: connected } }
              proxy:
                summary: Proxy fora do ar
                value: { id: evt_6b2e8d0a4c1f7395, type: instance.status, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T15:12:44.020Z", data: { state: reconnecting, reason: proxy_unreachable } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  instance.qr:
    post:
      summary: Novo QR de pareamento
      x-slug: instance-qr
      x-litezap-milestone: M3
      x-zapi: (sem equivalente; QR por polling)
      description: |
        Emitido a cada novo QR enquanto a instância está em `qr_pending`. Mostre `code` como QR (qualquer
        biblioteca de QR serve) em vez de fazer polling em `GET /qr`. `timeout_ms` é a validade aproximada
        deste código.
      x-related: [instance.status, instance.pair_code]
      x-fields:
        - [code, string, "Conteúdo do QR."]
        - [timeout_ms, integer, "Validade do código em milissegundos (opcional)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_1c8f3a6e9d2b4057, type: instance.qr, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:39:10.004Z", data: { code: "2@kQ3x...,Zm9v...,YmFy...,MQ==", timeout_ms: 20000 } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  instance.pair_code:
    post:
      summary: Código de pareamento gerado
      x-slug: instance-pair-code
      x-litezap-milestone: M3
      x-zapi: (sem equivalente)
      description: Emitido quando `POST /pair-phone` gera um código para digitar no celular.
      x-related: [instance.status, instance.qr]
      x-fields:
        - [code, string, "Código para digitar em Aparelhos conectados > Conectar com número de telefone."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_9e4b1d7a3f0c6285, type: instance.pair_code, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:39:30.718Z", data: { code: "ABCD-EFGH" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
  message.received:
    post:
      summary: Mensagem recebida
      x-slug: message-received
      x-litezap-milestone: M3
      x-zapi: Ao receber
      description: |
        Emitido para cada mensagem nova de outra pessoa (`source: "contact"`), em chat direto ou grupo.
        Mídia vem descrita em `media`, com `url` para baixar pela API (autenticada). Mensagens do histórico
        sincronizado no pareamento não geram este evento (só um `history.synced`), e uma mensagem que chega
        duas vezes (reconexão do worker) gera um único evento. Reações chegam como `message.reaction`.
      x-related: [message.reaction, message.sent, history.synced]
      x-fields:
        - [id, string, "Id LiteZap da mensagem no log."]
        - [wa_message_id, string, "Id da mensagem no WhatsApp."]
        - [chat, string, "JID do chat (pessoa ou grupo)."]
        - [sender, string, "JID de quem enviou (em grupos, o participante)."]
        - [from_me, boolean, "Sempre false aqui."]
        - [is_group, boolean, "true em grupos."]
        - [push_name, string, "Nome de perfil de quem enviou."]
        - [source, string, "contact."]
        - [type, string, "text, image, video, audio, document, sticker, location, contact..."]
        - [text, string, "Texto ou legenda."]
        - [media, object, "id, kind, mime, size, file_name, seconds, ptt, url (opcional)."]
        - [timestamp, string, "Hora da mensagem (RFC 3339)."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            examples:
              texto:
                summary: Texto
                value: { id: evt_5f2c9a1b7d3e4f60, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:45:00.123Z", data: { id: msg_e29d4b8a0f6c1357, wa_message_id: 3A9F2C7D1E0B4A5C6D7E, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: text, text: "Oi, meu pedido já saiu?", timestamp: "2026-10-17T13:45:00Z" } }
              imagem:
                summary: Imagem com legenda
                value: { id: evt_2d6a9f1c4e8b3075, type: message.received, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-17T13:46:12.877Z", data: { id: msg_4f0b7c2e9a1d6358, wa_message_id: 3A1B5D9F2C7E4A0B8C6D, chat: 5511999999999@s.whatsapp.net, sender: 5511999999999@s.whatsapp.net, from_me: false, push_name: Maria, source: contact, type: image, text: "Foto do produto", media: { id: med_5b8e1f3c9d2a7046, kind: image, mime: image/jpeg, size: 182345, url: /v1/instances/inst_7f3a9c2e5b1d4086/media/med_5b8e1f3c9d2a7046 }, timestamp: "2026-10-17T13:46:12Z" } }
              voz:
                summary: Mensagem de voz
