        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_3d9a1f7c5e2b4068, type: instance.proxy_failed, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-18T15:12:44.020Z", data: { reason: proxy_unreachable, since: "2026-10-18T15:12:44Z", duration_seconds: 0, outages_last_hour: 1, repeat: 0, error: "socks connect tcp socks5://[redacted]@proxy.example:1080->web.whatsapp.com:443: connection refused" } }
      responses:
