  /v1/instances/bulk:
    post:
      tags: [Plataforma]
      operationId: bulkInstances
      x-litezap-milestone: M11
      x-zapi: "Apagar instâncias em lote (parceiros)"
      x-litezap-events: [instance.status]
      summary: Operação em lote
      x-litezap-scope: admin
      description: |
        Aplica `start`, `stop`, `restart` ou `delete` a várias instâncias, dadas por `ids` ou por `tag`
        (uma das duas), até 100 por requisição. Roda 4 por vez e devolve um resultado por instância: uma
        falha não interrompe as outras. `delete` exige `"confirm": true` e pode levar ~20s por instância
        conectada (logout + parada do worker). Exige o token admin (ou o do operador).
      x-litezap-notes: "delete apaga sessão, mídia, fila e histórico de cada instância. Não há como desfazer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, delete] }
                ids: { type: array, items: { type: string }, maxItems: 100 }
                tag: { type: string }
                confirm: { type: boolean, description: "Obrigatório (`true`) para `delete`." }
            examples:
              porEtiqueta:
                summary: Parar todas as instâncias de uma etiqueta
                value: { action: stop, tag: cliente-acme }
              apagar:
                summary: Apagar por id
                value: { action: delete, ids: [inst_7f3a9c2e5b1d4086, inst_2b9d4f6a8c0e1357], confirm: true }
      responses:
        "200":
          description: Resultado por instância.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  succeeded: { type: integer }
                  failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: object, description: "Presente quando ok = false: { code, message, retryable }." }
              example:
                action: delete
                succeeded: 1
                failed: 1
                results:
                  - { id: inst_7f3a9c2e5b1d4086, ok: true }
                  - { id: inst_nao_existe, ok: false, error: { code: instance_not_found, message: instance not found, retryable: false } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/instances/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      tags: [Plataforma]
      operationId: createAPIKey
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Criar chave de API
      x-litezap-scope: instancia
      description: |
        Cria uma chave (`lzk_...`) presa a esta instância, com escopos:

        - `read`: rotas `GET` de leitura — instância, mensagens, fila, chats, contatos, mídia, grupos,
          comunidades, perfil, privacidade, bloqueados, eventos (SSE), uso, status, canais (e publicações),
          etiquetas e perfil comercial. Nunca QR, configurações, hook de agente, convites de grupo nem
          escritas de status, canal ou etiqueta.
        - `send`: `POST /messages` e `GET /messages/{msg_id}` (status do envio).

        Qualquer outra rota responde `403 forbidden`, inclusive `/mcp`, webhooks, ações de ciclo de vida e
        a gestão de chaves. A chave aparece **uma única vez** nesta resposta (só o hash fica guardado).
        Opcionais: `ip_allowlist` (IPs/CIDRs) e `expires_in_seconds`. Até 50 chaves por instância (as expiradas
        são descartadas). Apagar a instância apaga as chaves.

        Uma chave também respeita a `ip_allowlist` da instância; no stream SSE ela nunca recebe `instance.qr` nem `instance.pair_code`, e um stream aberto é encerrado em até um heartbeat (15s) quando a chave é revogada, expira ou sai da allowlist. Rotacionar o token da instância revoga as chaves criadas com ele (as criadas pelo admin continuam).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100 }
                scopes: { type: array, items: { type: string, enum: [read, send] } }
                ip_allowlist: { type: array, items: { type: string } }
                expires_in_seconds: { type: integer, minimum: 0, description: "0 ou ausente: não expira." }
            example: { name: "painel do cliente", scopes: [read], ip_allowlist: ["203.0.113.0/24"], expires_in_seconds: 2592000 }
      responses:
        "201":
          description: Chave criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  key: { type: string, description: "A chave (`lzk_...`). Mostrada só uma vez." }
              example:
                api_key: { id: key_5c1e9a7d3b2f4086, instance_id: inst_7f3a9c2e5b1d4086, name: painel do cliente, scopes: [read], ip_allowlist: ["203.0.113.0/24"], created_at: "2026-10-18T09:00:00Z", expires_at: "2026-11-17T09:00:00Z" }
                key: lzk_RXhlbXBsby1uYW8tdXNlLWVzdGEtY2hhdmU
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    get:
      tags: [Plataforma]
      operationId: listAPIKeys
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Listar chaves de API
      x-litezap-scope: instancia
      responses:
        "200":
          description: As chaves da instância (sem o segredo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
              example:
                api_keys:
                  - { id: key_5c1e9a7d3b2f4086, instance_id: inst_7f3a9c2e5b1d4086, name: painel do cliente, scopes: [read], ip_allowlist: [], created_at: "2026-10-18T09:00:00Z", last_used_at: "2026-10-18T09:12:00Z" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/api-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - { name: key_id, in: path, required: true, description: "Id da chave (`key_...`).", schema: { type: string } }
    delete:
      tags: [Plataforma]
      operationId: deleteAPIKey
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Revogar chave de API
      x-litezap-scope: instancia
      description: Apaga a chave; a próxima chamada com ela recebe `401 unauthorized`.
      responses:
        "204": { description: Revogada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{id}/pairing-links:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      tags: [Plataforma]
      operationId: createPairingLink
      x-litezap-milestone: M11
      x-zapi: "SDK de conexão / Gerar token do SDK"
      x-litezap-events: [instance.paired]
      summary: Gerar link de pareamento
      x-litezap-scope: admin
      description: |
        Gera um link para uma página hospedada pelo próprio servidor (`/pair/`) que mostra o QR ao vivo e
        permite parear pelo número de telefone — sem expor o token da instância. O link:

        - é assinado (HMAC-SHA256 com a chave `data/pairing_key`) e registrado no banco;
        - vale `ttl_seconds` (60 a 600; padrão 600) **ou** até o primeiro pareamento concluído;
        - leva o token no fragmento (`#t=...`), que o navegador nunca envia ao servidor (não vai para logs
          de acesso nem para `Referer`); a página o tira da barra de endereço ao abrir;
        - pode ser embutido num iframe só nas origens de `pairing_frame_ancestors` (CSP `frame-ancestors`;
          vazio = não pode ser embutido). Há um web component pronto: `<script src=".../pair/embed.js">` e
          `<litezap-pair url="...">`.

        A base do link é `public_url` (ou o `listen_addr`). Exige o token admin (ou o do operador); até 20
        links vivos por instância. Quando o pareamento termina sai o evento `instance.paired` com `via_link: true`.
      x-litezap-notes: "Quem tiver o link pode parear a instância com o próprio número enquanto ele valer. Envie só ao cliente e revogue se vazar."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: { type: integer, minimum: 60, maximum: 600, default: 600 }
            example: { ttl_seconds: 600 }
      responses:
        "201":
          description: Link gerado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, description: "Página de pareamento com o token no fragmento." }
                  token: { type: string, description: "O token do link (o mesmo do fragmento)." }
                  expires_at: { type: string, format: date-time }
              example:
                id: wEeHr7odSNU0pM_Rb4O5WQ
                url: "https://zap.seu-dominio.com/pair/#t=pl1.wEeHr7odSNU0pM_Rb4O5WQ.1792342931.Yzlm6Nb6zRKq7pSI0XVQSA1OCyKl6le1r4ca4qL63wY"
                token: pl1.wEeHr7odSNU0pM_Rb4O5WQ.1792342931.Yzlm6Nb6zRKq7pSI0XVQSA1OCyKl6le1r4ca4qL63wY
                expires_at: "2026-10-18T17:02:11Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    delete:
      tags: [Plataforma]
      operationId: revokePairingLinks
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Revogar links de pareamento
      x-litezap-scope: admin
      description: Revoga todos os links ainda não usados da instância; a página aberta passa a mostrar "link expirado".
      responses:
        "200":
          description: Quantos links foram revogados.
          content:
            application/json:
              example: { revoked: 1 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    get:
      tags: [Plataforma]
      operationId: instanceUsage
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Uso da instância
      x-litezap-scope: instancia
      description: |
        Contadores diários (dias UTC) da instância: mensagens enviadas pela API e recebidas, bytes de mídia,
        segundos conectada e entregas de webhook. `from` e `to` (`YYYY-MM-DD`) padrão: últimos 31 dias;
        intervalo máximo de 366 dias. Os números são os mesmos do `GET /v1/usage` do operador.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Uso por dia.
          content:
            application/json:
              example:
                instance_id: inst_7f3a9c2e5b1d4086
                from: "2026-10-01"
                to: "2026-10-18"
                usage:
                  - { instance_id: inst_7f3a9c2e5b1d4086, day: "2026-10-17", messages_sent: 120, messages_received: 340, media_bytes: 1048576, connected_seconds: 86400, webhook_deliveries: 460 }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/status:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Status]
      operationId: postStatus
      x-litezap-milestone: M10
      x-zapi: "Enviar status de texto / imagem / vídeo"
      x-litezap-events: [message.sent, message.status]
      x-litezap-notes: "Vai para todos os contatos permitidos pela privacidade do status: fila de envio e no máximo 10 por dia."
      summary: Publicar status
      x-litezap-scope: instancia
      description: |
        Publica um status (story) de texto, imagem ou vídeo. Os destinatários são os da privacidade do
        status configurada no celular (veja `GET /status/privacy`); o WhatsApp não permite escolher por
        envio. Passa pela fila de envio como `POST /messages` (ritmo, janela de horário, rampa,
        suspensão do operador, `client_message_id`, `?wait=true`) e tem teto de 10 status por dia por
        instância (`429 rate_limited`). Texto: até 700 caracteres, `background_color`/`text_color`
        `#RRGGBB` e `font` 0, 1, 2, 6, 7, 8, 9 ou 10.
      parameters:
        - { name: wait, in: query, schema: { type: boolean }, description: "Espera o envio (até `timeout`, padrão 30s)." }
        - { name: timeout, in: query, schema: { type: string, example: 30s } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusInput" }
            examples:
              texto: { summary: Texto, value: { type: text, text: "Bom dia! Abrimos às 9h.", background_color: "#1E6E4F", font: 1 } }
              imagem: { summary: Imagem, value: { type: image, caption: "Novidade da semana", media: { url: "https://exemplo.com/foto.jpg" } } }
      responses:
        "200":
          description: Publicado (com `?wait=true`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example: { id: msg_5c1e9a7d3b2f4068, wa_message_id: 3EB0C4D5E6F7A8B9C0D1E2, chat: status@broadcast, from_me: true, source: api, type: text, text: "Bom dia! Abrimos às 9h.", status: sent, timestamp: "2026-10-18T12:00:03Z" }
        "202":
          description: Na fila.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/SendConflict" }
        "413": { $ref: "#/components/responses/MediaTooLarge" }
        "422": { $ref: "#/components/responses/MediaFetchFailed" }
        "429": { $ref: "#/components/responses/SocialRateLimited" }
    get:
      tags: [Status]
      operationId: listStatus
      x-litezap-milestone: M10
      x-zapi: "(sem equivalente)"
      x-litezap-events: [status.received]
      summary: Status recentes
      x-litezap-scope: instancia
      description: |
        Status no log, do mais recente para o mais antigo: os dos contatos recebidos com a instância
        conectada (`sender` = autor; mídia baixável por `media.url`) e os nossos. Ficam no chat
        `status@broadcast`, que não aparece em `GET /chats`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página de status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/status/privacy:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Status]
      operationId: statusPrivacy
      x-litezap-milestone: M10
