          description: Grupos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    post:
      tags: [Grupos]
      operationId: createGroup
      x-litezap-milestone: M8
      x-zapi: "Criar grupo"
      x-litezap-events: [group.updated]
      x-litezap-notes: "Criar grupos com desconhecidos é gatilho de banimento: cota diária e participantes só conhecidos."
      summary: Criar grupo
      x-litezap-scope: instancia
      description: |
        Cria um grupo com até 10 participantes iniciais (número com DDI ou JID). Só entram pessoas que já
        têm conversa no log da instância ou que a consulta de números confirma no WhatsApp (gasta a cota
        de `check-numbers`); as demais voltam em `results` com `not_on_whatsapp` ou `unknown_contact`, sem
        chegar ao WhatsApp. Conta na cota `settings.groups.max_creates_per_day` (padrão 3) e os
        participantes nas cotas de adição (e no intervalo de 10s entre lotes); acima, `429 rate_limited`. A
        cota só volta se a requisição não chegou ao WhatsApp. Com envios suspensos pelo operador,
        `403 sending_suspended`. Com `parent`, o grupo nasce dentro da comunidade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroup" }
            example: { name: "Equipe", participants: ["5511999999999"], description: "Avisos da equipe", settings: { announce: false } }
      responses:
        "201":
          description: Grupo criado e resultado por participante.
          content:
