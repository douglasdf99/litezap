        mudaram; a aprovação de entrada sai depois, lida do grupo), `invite_link_reset`, `joined` (o número
        foi adicionado ou criou o grupo), `deleted`, `suspended`/`unsuspended`,
        `community_linked`/`community_unlinked` (`group`).
