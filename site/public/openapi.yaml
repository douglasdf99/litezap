  /v1/instances/bulk:
    post:
      tags: [Plataforma]
      operationId: bulkInstances
      x-litezap-milestone: M11
      x-zapi: "Apagar instâncias em lote (parceiros)"
      x-litezap-events: [instance.status]
      summary: Operação em lote
      x-litezap-scope: admin
      description: |
        Aplica `start`, `stop`, `restart` ou `delete` a várias instâncias, dadas por `ids` ou por `tag`
        (uma das duas), até 100 por requisição. Roda 4 por vez e devolve um resultado por instância: uma
        falha não interrompe as outras. `delete` exige `"confirm": true` e pode levar ~20s por instância
        conectada (logout + parada do worker). Exige o token admin (ou o do operador).
      x-litezap-notes: "delete apaga sessão, mídia, fila e histórico de cada instância. Não há como desfazer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, delete] }
                ids: { type: array, items: { type: string }, maxItems: 100 }
                tag: { type: string }
                confirm: { type: boolean, description: "Obrigatório (`true`) para `delete`." }
            examples:
              porEtiqueta:
                summary: Parar todas as instâncias de uma etiqueta
                value: { action: stop, tag: cliente-acme }
              apagar:
                summary: Apagar por id
                value: { action: delete, ids: [inst_7f3a9c2e5b1d4086, inst_2b9d4f6a8c0e1357], confirm: true }
      responses:
        "200":
          description: Resultado por instância.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  succeeded: { type: integer }
                  failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ok: { type: boolean }
                        error: { type: object, description: "Presente quando ok = false: { code, message, retryable }." }
              example:
                action: delete
                succeeded: 1
                failed: 1
                results:
                  - { id: inst_7f3a9c2e5b1d4086, ok: true }
                  - { id: inst_nao_existe, ok: false, error: { code: instance_not_found, message: instance not found, retryable: false } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/instances/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    post:
      tags: [Plataforma]
      operationId: createAPIKey
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Criar chave de API
      x-litezap-scope: instancia
      description: |
        Cria uma chave (`lzk_...`) presa a esta instância, com escopos:

        - `read`: rotas `GET` de leitura — instância, mensagens, fila, chats, contatos, mídia, grupos,
          comunidades, perfil, privacidade, bloqueados, eventos (SSE) e uso. Nunca QR, configurações, hook
          de agente nem convites de grupo.
        - `send`: `POST /messages` e `GET /messages/{msg_id}` (status do envio).

        Qualquer outra rota responde `403 forbidden`, inclusive `/mcp`, webhooks, ações de ciclo de vida e
        a gestão de chaves. A chave aparece **uma única vez** nesta resposta (só o hash fica guardado).
        Opcionais: `ip_allowlist` (IPs/CIDRs) e `expires_in_seconds`. Até 50 chaves por instância (as expiradas
        são descartadas). Apagar a instância apaga as chaves.

        Uma chave também respeita a `ip_allowlist` da instância; no stream SSE ela nunca recebe `instance.qr` nem `instance.pair_code`, e um stream aberto é encerrado em até um heartbeat (15s) quando a chave é revogada, expira ou sai da allowlist. Rotacionar o token da instância revoga as chaves criadas com ele (as criadas pelo admin continuam).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 100 }
                scopes: { type: array, items: { type: string, enum: [read, send] } }
                ip_allowlist: { type: array, items: { type: string } }
                expires_in_seconds: { type: integer, minimum: 0, description: "0 ou ausente: não expira." }
            example: { name: "painel do cliente", scopes: [read], ip_allowlist: ["203.0.113.0/24"], expires_in_seconds: 2592000 }
      responses:
        "201":
          description: Chave criada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { $ref: "#/components/schemas/APIKey" }
                  key: { type: string, description: "A chave (`lzk_...`). Mostrada só uma vez." }
              example:
                api_key: { id: key_5c1e9a7d3b2f4086, instance_id: inst_7f3a9c2e5b1d4086, name: painel do cliente, scopes: [read], ip_allowlist: ["203.0.113.0/24"], created_at: "2026-10-18T09:00:00Z", expires_at: "2026-11-17T09:00:00Z" }
                key: lzk_RXhlbXBsby1uYW8tdXNlLWVzdGEtY2hhdmU
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    get:
      tags: [Plataforma]
      operationId: listAPIKeys
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
      summary: Listar chaves de API
      x-litezap-scope: instancia
      responses:
        "200":
          description: As chaves da instância (sem o segredo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
              example:
                api_keys:
                  - { id: key_5c1e9a7d3b2f4086, instance_id: inst_7f3a9c2e5b1d4086, name: painel do cliente, scopes: [read], ip_allowlist: [], created_at: "2026-10-18T09:00:00Z", last_used_at: "2026-10-18T09:12:00Z" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/api-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - { name: key_id, in: path, required: true, description: "Id da chave (`key_...`).", schema: { type: string } }
    delete:
      tags: [Plataforma]
      operationId: deleteAPIKey
      x-litezap-milestone: M11
      x-zapi: "(sem equivalente)"
