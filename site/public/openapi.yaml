    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Etiquetas e Business]
      operationId: businessProfile
      x-litezap-milestone: M10
      x-zapi: "Dados da conta business"
      summary: Perfil comercial
      x-litezap-scope: instancia
      description: |
        Descrição, endereço, localização, e-mail, sites, categorias (com ids) e horário de funcionamento da
        própria conta Business. `business_hours` traz a semana no mesmo formato que o PATCH aceita (leia,
        altere e mande de volta); `hours` e `timezone` são as entradas brutas do WhatsApp (minutos desde a
        meia-noite).
      responses:
        "200":
          description: Perfil comercial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
              example: { jid: 5511999999999@s.whatsapp.net, business_name: "Loja Exemplo", description: "Pizzas artesanais", address: "Rua A, 10", email: "oi@loja.exemplo", websites: ["https://loja.exemplo"], location: { latitude: -23.5505, longitude: -46.6333 }, categories: [Restaurante], category_list: [{ id: "133436743388217", name: Restaurante }], timezone: America/Sao_Paulo, hours: [{ day: mon, mode: specific_hours, open: "540", close: "1080" }], business_hours: { timezone: America/Sao_Paulo, days: { sun: { mode: closed }, mon: { mode: open, open: "09:00", close: "18:00" }, tue: { mode: closed }, wed: { mode: closed }, thu: { mode: closed }, fri: { mode: closed }, sat: { mode: closed } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BusinessRequired" }
    patch:
      tags: [Etiquetas e Business]
      operationId: updateBusinessProfile
      x-litezap-milestone: M12
      x-zapi: "Editar perfil comercial (descrição, endereço, e-mail, sites, horário, categorias)"
      x-litezap-events: [business.profile_updated]
      summary: Editar perfil comercial
      x-litezap-scope: instancia
      description: |
        Altera só os campos enviados (os ausentes ficam como estão) e devolve o perfil lido de novo do
        WhatsApp. Para remover, use `clear` com os campos (`hours`, `email`, `websites`,
        `description`, `address`); `null` num desses campos (e em `categories`, que não podem ser removidas) responde `400` (seria ambíguo com "ausente").
        `"clear": ["hours"]` tira o horário inteiro (sem fuso), validado num número Business em 2026-10-21.
        O **pin do mapa não pode ser removido** por um aparelho conectado: `"clear": ["location"]` (e
        `latitude`/`longitude` `null`) responde `422 not_supported` sem chamar o WhatsApp; remova no app
        WhatsApp Business (Perfil comercial > Endereço). No aparelho, em 2026-10-21, `<latitude/><longitude/>`
        e `<latitude></latitude><longitude></longitude>` voltaram `406 not-acceptable` e `<address/>` foi
        aceito mas manteve o pin; o WhatsApp Web só oferece "editar o mapa no celular". Trocar a localização
        (`latitude` + `longitude`) funciona. `websites` e `categories` substituem as listas atuais (`websites: []` remove os sites);
        `hours` substitui a semana inteira (dias ausentes ficam fechados); `latitude` e `longitude` vão
        juntas. Token admin ou da instância; chaves de API com escopo (`lzk_`) não podem. Limite de 5
        alterações por minuto e 50 por dia por instância.

        Os campos vão ao WhatsApp como o WhatsApp Web e o Baileys enviam (IQ `w:biz`, mutação `delta`).
        Em 2026-10-21, num número Business real, descrição, endereço, localização e horário foram aceitos e
        apareceram no celular, `""` apagou descrição e endereço e `clear: ["hours"]` tirou o horário.
        Categorias e remover sites ainda aguardam essa validação: se o WhatsApp recusar um valor, a resposta é
        `400 validation_failed` com o código do servidor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessProfilePatch" }
            example: { description: "Pizzas artesanais no forno a lenha", websites: ["https://loja.exemplo"], categories: ["133436743388217"], hours: { timezone: America/Sao_Paulo, days: { mon: { mode: open, open: "09:00", close: "18:00" }, tue: { mode: open, intervals: [{ open: "11:00", close: "14:00" }, { open: "18:00", close: "23:00" }] }, sat: { mode: 24h }, sun: { mode: closed } } } }
      responses:
        "200":
          description: O perfil lido de novo depois da alteração.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfile" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/BusinessRequired" }
        "422":
          description: '`not_supported`: `clear: ["location"]` (o WhatsApp não permite remover o pin do mapa por um aparelho conectado).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/SocialRateLimited" }

  /v1/instances/{id}/catalog:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Catálogo e pedidos]
      operationId: getCatalog
      x-litezap-milestone: M12
      x-zapi: "Listar produtos"
      summary: Ler o catálogo
      x-litezap-scope: instancia
      description: |
        Uma página de produtos do catálogo do próprio número (sem `jid`) ou do catálogo público de outra
        empresa (`jid`: número com DDI). Preços em `price_amount_1000` (milésimos da moeda, a convenção do
        WhatsApp: R$ 12,50 = 12500), `price` na unidade e `price_text` formatado em BRL. `catalog_link`
        (`https://wa.me/c/<número>`) compartilha o catálogo inteiro: envie como texto, com prévia de link.
        `image_path` baixa a primeira foto pelo LiteZap. Lido pela proxy da instância, com cache de 5
        minutos e limite de 30 leituras novas por minuto por instância. O endpoint público pode omitir
        produtos ocultos ou em análise. Catálogo vazio: `products: []`; número sem catálogo:
        `404 catalog_not_found`.
      parameters:
        - { name: jid, in: query, description: "Número ou JID (…@s.whatsapp.net) da empresa; padrão, o próprio número.", schema: { type: string } }
        - { name: limit, in: query, description: "Produtos por página (padrão 30, máximo 50).", schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Uma página do catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
              example: { owner: 5511999990000@s.whatsapp.net, catalog_link: "https://wa.me/c/5511999990000", products: [{ id: "8364718273645", name: Camiseta, description: "Algodão", price: 59.9, price_amount_1000: 59900, currency: BRL, price_text: "R$ 59,90", hidden: false, availability: in_stock, review_status: approved, image_count: 1, image_path: "/v1/instances/inst_7f3a9c2e5b1d4086/catalog/products/8364718273645/image?jid=5511999990000" }], next_cursor: "", cached: false }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/CatalogNotFound" }
        "429": { $ref: "#/components/responses/CatalogRateLimited" }
        "502": { $ref: "#/components/responses/UpstreamChanged" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /v1/instances/{id}/catalog/collections:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Catálogo e pedidos]
      operationId: catalogCollections
      x-litezap-milestone: M12
      x-zapi: "Listar coleções"
      summary: Ler as coleções
      x-litezap-scope: instancia
      description: |
        As coleções do catálogo (o próprio, ou de `jid`) com os primeiros produtos de cada uma. Coleções novas
        podem levar até 24h na revisão do WhatsApp antes de aparecer aos clientes.
      parameters:
        - { name: jid, in: query, description: "Número da empresa; padrão, o próprio número.", schema: { type: string } }
      responses:
        "200":
          description: Coleções.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCollections" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/CatalogRateLimited" }
        "502": { $ref: "#/components/responses/UpstreamChanged" }
  /v1/instances/{id}/catalog/products/{product_id}:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: product_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
    get:
      tags: [Catálogo e pedidos]
      operationId: catalogProduct
      x-litezap-milestone: M12
      x-zapi: "Obter produto"
      summary: Ler um produto
      x-litezap-scope: instancia
      parameters:
        - { name: jid, in: query, description: "Número da empresa; padrão, o próprio número.", schema: { type: string } }
      responses:
        "200":
          description: O produto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProduct" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CatalogNotFound" }
        "502": { $ref: "#/components/responses/UpstreamChanged" }
  /v1/instances/{id}/catalog/products/{product_id}/image:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: product_id, in: path, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
    get:
      tags: [Catálogo e pedidos]
      operationId: catalogProductImage
      x-litezap-milestone: M12
      x-zapi: (sem equivalente)
      summary: Baixar a foto de um produto
      x-litezap-scope: instancia
      description: |
        A primeira foto do produto, baixada da CDN do WhatsApp pela proxy da instância (só hosts da CDN da
        Meta, até 5 MB), guardada por 5 minutos. Limite de 60 downloads novos por minuto por instância.
      parameters:
        - { name: jid, in: query, description: "Número da empresa; padrão, o próprio número.", schema: { type: string } }
      responses:
        "200":
          description: A imagem (JPEG, PNG ou WebP).
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CatalogNotFound" }
  /v1/instances/{id}/orders:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Catálogo e pedidos]
      operationId: listOrders
      x-litezap-milestone: M12
      x-zapi: (sem equivalente)
      summary: Pedidos recebidos
      x-litezap-scope: instancia
      description: |
        Os pedidos mais recentes que clientes fizeram pelo carrinho do catálogo (guardados a partir da mensagem
        de pedido, a mesma do evento `order.received`). O token do pedido fica no servidor.
      parameters:
        - { name: limit, in: query, description: "1 a 100 (padrão 20).", schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Pedidos, do mais novo para o mais antigo.
          content:
            application/json:
              schema: { type: object, properties: { orders: { type: array, items: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/instances/{id}/orders/{order_id}:
    parameters:
      - { $ref: "#/components/parameters/InstanceID" }
      - { name: order_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Catálogo e pedidos]
      operationId: getOrder
      x-litezap-milestone: M12
      x-zapi: "Detalhes do pedido"
      summary: Detalhes de um pedido
      x-litezap-scope: instancia
      description: |
        Itens, quantidades, preços e total de um pedido recebido. Um pedido fica preso à conversa que o enviou
        (outra conversa com o mesmo id não o substitui), e o LiteZap guarda até 20 pedidos por conversa e 1000
        por instância a cada 24 horas. Primeiro pelo socket (`GetOrderDetails` do
        whatsmeow, IQ `fb:thrift_iq`), depois pelo GraphQL público do catálogo se o IQ falhar: `source` diz
        qual respondeu. Aceitar ou recusar o pedido continua sendo no app WhatsApp Business.
      responses:
        "200":
          description: O pedido com os itens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/CatalogNotFound" }
        "502": { $ref: "#/components/responses/UpstreamChanged" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Token admin (`lza_...`, de `data/admin_token` ou `LITEZAP_ADMIN_TOKEN`), token de instância (`lzi_...`) ou chave de API com escopo (`lzk_...`)."
  parameters:
    InstanceID:
      name: id
      in: path
      required: true
      description: "Id da instância (`inst_...`)."
      schema: { type: string }
    ChatJID:
      name: jid
      in: path
      required: true
      description: "JID do chat (`...@s.whatsapp.net`, `...@g.us`, `...@lid`) ou número com DDI. Prefira o `jid` devolvido por `GET /chats` ou `check-numbers`."
      schema: { type: string }
    GroupJID:
      name: jid
      in: path
      required: true
      description: "JID do grupo ou comunidade (`120363…@g.us`)."
      schema: { type: string }
    MediaID:
      name: media_id
      in: path
      required: true
      description: "Id da mídia (`med_...`), de `media.id` no log."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: Itens por página. Padrão 50, máximo 200.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: "`next_cursor` da página anterior (opaco)."
      schema: { type: string }
    WebhookID:
      name: wid
      in: path
      required: true
      description: "Id do webhook (`wh_...`)."
      schema: { type: string }
    EventTypes:
      name: types
      in: query
      description: "Filtro separado por vírgulas: tipos exatos (`instance.status`), famílias (`message.*`) ou `*`. Omitido: todos. `chat.presence`, `status.received` e `channel.message` são opt-in: nem `*` nem a omissão os incluem (use `*,chat.presence,status.received`)."
      schema: { type: string, example: "message.*,instance.status" }

    ChannelJID:
      name: jid
      in: path
      required: true
      description: "JID do canal (`<id>@newsletter`) ou só o id numérico."
      schema: { type: string, example: 120363000000000001@newsletter }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string, description: Código estável (veja a tabela de erros). }
            message: { type: string, description: Texto para humanos; nunca traz telefone nem token. }
            retryable: { type: boolean, description: Se o cliente pode tentar de novo. }
    InstanceState:
      type: string
      enum: [created, starting, qr_pending, connecting, connected, reconnecting, logged_out, banned, failed, stopped]
    Instance:
      type: object
      required: [id, name, state, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        state: { $ref: "#/components/schemas/InstanceState" }
        state_reason: { type: string, description: "Ex.: `proxy_unreachable`, `temp_banned:<duração>`." }
        phone: { type: string, description: Número conectado (depois do pareamento). }
        tags: { type: array, items: { type: string }, description: "Etiquetas (marco 11)." }
        ip_allowlist: { type: array, items: { type: string }, description: "CIDRs de onde o token da instância é aceito; vazio = qualquer (marco 11)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: string, description: "Id da chave (`key_...`)." }
        instance_id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, send] } }
        ip_allowlist: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: "Ausente: não expira." }
        last_used_at: { type: string, format: date-time, description: "Atualizado no máximo uma vez por minuto." }
    InstanceCreated:
      type: object
      properties:
        instance: { $ref: "#/components/schemas/Instance" }
        token: { type: string, description: "Token da instância (`lzi_...`). Mostrado só uma vez." }
    Ramp:
      type: object
      properties:
        enabled: { type: boolean, default: true }
        start_per_day: { type: integer, default: 50 }
        end_per_day: { type: integer, default: 150 }
        days: { type: integer, default: 14, minimum: 1, maximum: 365 }
    SendWindow:
      type: object
      properties:
        start: { type: string, description: "HH:MM; vazio com end vazio = sem janela.", example: "08:00" }
        end: { type: string, example: "20:00" }
    Settings:
      type: object
      properties:
        min_interval_ms: { type: integer, default: 3000, description: "Intervalo mínimo entre envios. Mínimo 1000 sem unsafe_pacing." }
        jitter_ms: { type: integer, default: 2000, description: Variação aleatória somada ao intervalo. }
        max_per_minute: { type: integer, default: 20, description: "Teto por minuto. Máximo 60 sem unsafe_pacing." }
        typing_simulation: { type: boolean, default: true, description: "Mostra \"digitando\" antes de enviar (~50ms por caractere, até 5s)." }
        ramp: { $ref: "#/components/schemas/Ramp" }
        send_window: { $ref: "#/components/schemas/SendWindow" }
        timezone: { type: string, description: "Fuso IANA (ex.: America/Sao_Paulo); vazio = fuso do servidor." }
        unsafe_pacing: { type: boolean, default: false, description: Remove os pisos de ritmo. Só admin. }
        proxy_url: { type: string, description: "http://, https:// ou socks5://; senha mascarada na leitura." }
        calls: { $ref: "#/components/schemas/CallSettings" }
        presence: { $ref: "#/components/schemas/PresenceSettings" }
        groups: { $ref: "#/components/schemas/GroupLimits" }
        auto_read: { $ref: "#/components/schemas/AutoReadSettings" }
    AutoReadSettings:
      type: object
      description: Leitura automática (marco 9).
      properties:
        enabled: { type: boolean, default: false, description: "Marca as mensagens recebidas como lidas 2 a 5s depois, em lote por chat, no máximo uma confirmação por segundo. Com a confirmação de leitura desligada na privacidade, o contato não vê os tiques azuis." }
        groups: { type: boolean, default: false, description: Também em grupos. }
    CallSettings:
      type: object
      description: Política de chamadas recebidas (marco 7).
      properties:
        auto_reject: { type: boolean, default: false, description: "Rejeita toda chamada individual assim que toca (< 3s); `call.received` sai com `rejected: true`. Chamadas em grupo só são informadas." }
        reject_message:
          type: string
          maxLength: 1000
          description: "Mandada ao autor de chamadas individuais rejeitadas, pela fila (ritmo, janela, rampa); no máximo uma por contato a cada 10 min; expira em 1h. Vazio: sem mensagem."
    PresenceSettings:
      type: object
      description: Presença da própria conta (marco 7).
      properties:
        online:
          type: boolean
          default: false
          description: "Marca a conta como disponível a cada conexão: necessário para `chat.presence` e `presence/subscribe`. Enquanto ligado, o celular deixa de mostrar notificações."
    WebhookFilters:
      type: object
      description: "Restringem os eventos do webhook (marco 7). Cada filtro só vale para eventos que têm o campo: `instance.*` sempre passam."
      properties:
        chat: { type: string, enum: [direct, group] }
        chats: { type: array, maxItems: 500, items: { type: string }, description: "Só estes chats (número com DDI ou JID)." }
        exclude_chats: { type: array, items: { type: string }, description: Todos menos estes chats. }
        message_types:
          type: array
          items: { type: string, enum: [text, image, video, gif, ptv, audio, document, sticker, location, contact, poll, reaction, button_reply, product, order, unknown] }
          description: "Só eventos de mensagem destes tipos (received, sent, reaction, button_reply)."
        from_me: { type: boolean, description: "true: só mensagens nossas; false: exclui as nossas. Omitido: ambas. Não se aplica a message.status." }
    ChatPresenceEvent:
      type: object
      description: Dados de `chat.presence`.
      properties:
        chat: { type: string }
        sender: { type: string, description: Quem digita (o participante, em grupos). }
        is_group: { type: boolean }
        state: { type: string, enum: [composing, recording, paused, online, offline] }
        last_seen: { type: string, format: date-time, description: "Em `offline`, quando o contato mostra o visto por último." }
    CallEvent:
      type: object
      description: Dados de `call.received`, `call.accepted` e `call.ended`.
      properties:
        call_id: { type: string }
        chat: { type: string, description: Chat de quem ligou, ou o grupo em chamadas de grupo. }
        caller: { type: string }
        is_group: { type: boolean }
        media: { type: string, enum: [audio, video] }
        rejected: { type: boolean, description: "call.received: rejeitada por `calls.auto_reject`." }
        reason: { type: string, description: "call.ended: `caller_hangup`, `accepted_elsewhere`, `ended`, `rejected` (por esta instância), `rejected_by_peer`, `timeout` ou outro motivo do WhatsApp." }
        missed: { type: boolean, description: "call.ended: tocou sem ninguém atender." }
        timestamp: { type: string, format: date-time }
    GroupSettings:
      type: object
      description: Configurações de um grupo (marco 8).
      properties:
        announce: { type: boolean, description: Só admins enviam mensagens. }
        locked: { type: boolean, description: Só admins editam nome, descrição e foto. }
        approval_required: { type: boolean, description: Entrada com aprovação de um admin. }
        admins_add_members: { type: boolean, description: Só admins adicionam participantes. }
        ephemeral_seconds: { type: integer, enum: [0, 86400, 604800, 7776000], description: "Mensagens temporárias (0: desligadas)." }
    GroupParticipant:
      type: object
      properties:
        jid: { type: string, description: "JID de telefone quando conhecido; senão o LID." }
        lid: { type: string }
        phone: { type: string }
        admin: { type: boolean }
        super_admin: { type: boolean, description: Dono do grupo. }
    Group:
      type: object
      properties:
        jid: { type: string, example: "120363000000000001@g.us" }
        name: { type: string }
        description: { type: string }
        owner: { type: string }
        created_at: { type: string, format: date-time }
        community: { type: boolean, description: É uma comunidade. }
        parent: { type: string, description: Comunidade a que o grupo pertence. }
        announcement_group: { type: boolean, description: Grupo de avisos da comunidade. }
        participant_count: { type: integer }
