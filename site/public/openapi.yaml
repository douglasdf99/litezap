  /v1/instances/{id}/groups/{jid}/participants:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }, { $ref: "#/components/parameters/GroupJID" }]
    post:
      tags: [Grupos]
      operationId: groupParticipants
      x-litezap-milestone: M8
      x-zapi: "Adicionar / remover participantes; promover / remover admin"
      x-litezap-events: [group.updated]
      x-litezap-notes: "Adições: só contatos conhecidos, 10 por lote, 10s entre lotes, cotas por hora e por dia."
      summary: Gerenciar participantes
      x-litezap-scope: instancia
      description: |
        `action`: `add`, `remove`, `promote` ou `demote` (a instância precisa ser admin). Responde um
        resultado por participante pedido. Para `add`: até 10 por requisição; só pessoas com conversa no log
        ou confirmadas pela consulta de números (`@lid` sem conversa é recusado); 10 segundos entre lotes e
        cotas `max_adds_per_hour` (padrão 10) e `max_adds_per_day` (padrão 50) por instância, persistidas;
        acima, `429 rate_limited`; recusado com envios suspensos (`403 sending_suspended`). Demais ações: até
        50 por requisição.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, participants]
              properties:
                action: { type: string, enum: [add, remove, promote, demote] }
                participants: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
            example: { action: promote, participants: ["5511999999999"] }
      responses:
        "200":
          description: Resultado por participante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/ParticipantResult" } }
              example:
                results:
                  - { participant: "5511999999999@s.whatsapp.net", jid: "5511999999999@s.whatsapp.net", status: ok }
                  - { participant: "5511888888888@s.whatsapp.net", status: privacy_invite_required, code: 403, invite_code: "AbCd" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/GroupForbidden" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "429": { $ref: "#/components/responses/GroupRateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }

