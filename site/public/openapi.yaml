      properties:
        jid: { type: string }
        business_name: { type: string }
        description: { type: string }
        address: { type: string }
        email: { type: string }
        websites: { type: array, items: { type: string } }
        location:
          type: object
          description: O pino no mapa, quando o perfil tem um.
          properties:
            latitude: { type: number }
            longitude: { type: number }
        categories: { type: array, items: { type: string }, description: Nomes das categorias. }
        category_list:
          type: array
          description: Categorias com o id (o PATCH recebe os ids).
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
        timezone: { type: string }
        hours:
          type: array
          description: Entradas brutas do WhatsApp (open/close em minutos desde a meia-noite).
          items:
            type: object
            properties:
              day: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
              mode: { type: string, enum: [specific_hours, open_24h, appointment_only] }
              open: { type: string }
              close: { type: string }
        business_hours: { $ref: "#/components/schemas/BusinessWeek" }
        options: { type: object, additionalProperties: { type: string } }
    BusinessWeek:
      type: object
      description: A semana de funcionamento no formato do PATCH (na leitura, todos os dias aparecem).
      required: [timezone]
      properties:
        timezone: { type: string, description: "Fuso IANA, como America/Sao_Paulo." }
        days:
          type: object
          description: "Chaves sun, mon, tue, wed, thu, fri, sat. No PATCH, dia ausente = fechado."
          additionalProperties: { $ref: "#/components/schemas/BusinessDay" }
    BusinessDay:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [open, closed, 24h, appointment], description: "open: com horário; 24h: aberto o dia todo; appointment: só com agendamento." }
        open: { type: string, example: "09:00", description: "mode open: abre (HH:MM)." }
        close: { type: string, example: "18:00", description: "mode open: fecha (HH:MM; 24:00 = meia-noite)." }
        intervals:
          type: array
          maxItems: 3
          description: "mode open: turnos, no lugar de open/close (ex.: 11:00-14:00 e 18:00-23:00)."
          items:
            type: object
            properties:
              open: { type: string }
              close: { type: string }
    BusinessProfilePatch:
      type: object
      description: Só os campos enviados mudam.
      properties:
        description: { type: string, maxLength: 512, description: '"" apaga.' }
        address: { type: string, maxLength: 256 }
        email: { type: string, maxLength: 128, description: 'Endereço simples (contato@loja.com); "" apaga.' }
        websites: { type: array, maxItems: 2, items: { type: string, maxLength: 256 }, description: "URLs http(s); substituem as atuais ([] remove)." }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        categories: { type: array, minItems: 1, maxItems: 3, items: { type: string, pattern: "^[0-9]+$" }, description: "Ids de categoria (category_list do GET); substituem as atuais." }
        hours: { $ref: "#/components/schemas/BusinessWeek" }
        clear:
          type: array
          items: { type: string, enum: [hours, email, websites, description, address] }
          description: "Campos a remover. Não combine com o mesmo campo preenchido. O horário só sai assim. `location` responde `422 not_supported`: o pin do mapa só sai no app WhatsApp Business (Perfil comercial > Endereço)."
    CatalogProduct:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, description: "price_amount_1000 / 1000." }
        price_amount_1000: { type: integer, description: "Milésimos da moeda (R$ 12,50 = 12500)." }
        currency: { type: string }
        price_text: { type: string, description: "Só BRL: \"R$ 59,90\"." }
        sale_price: { type: number }
        sale_price_amount_1000: { type: integer }
        retailer_id: { type: string }
        url: { type: string }
        hidden: { type: boolean }
        availability: { type: string, description: "in_stock, out_of_stock…" }
        review_status: { type: string, description: "approved, pending, rejected…" }
        image_count: { type: integer }
        image_url: { type: string, description: "Link da CDN do WhatsApp (assinado, expira)." }
        image_path: { type: string, description: "Caminho da API para baixar a primeira foto." }
    Catalog:
      type: object
      properties:
        owner: { type: string }
        catalog_link: { type: string, description: "https://wa.me/c/<número>: envie como texto para compartilhar o catálogo inteiro." }
        products: { type: array, items: { $ref: "#/components/schemas/CatalogProduct" } }
        next_cursor: { type: string }
        cached: { type: boolean }
    CatalogCollections:
      type: object
      properties:
        owner: { type: string }
        catalog_link: { type: string }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              review_status: { type: string }
              products: { type: array, items: { $ref: "#/components/schemas/CatalogProduct" } }
    Order:
      type: object
      properties:
        order_id: { type: string }
        message_id: { type: string, description: "Id do LiteZap da mensagem de pedido." }
        chat: { type: string }
        seller: { type: string }
        item_count: { type: integer }
        total_amount_1000: { type: integer }
        total: { type: number }
        currency: { type: string }
        total_text: { type: string }
        title: { type: string }
        note: { type: string, description: "Mensagem do cliente com o pedido." }
        status: { type: string, enum: [inquiry, accepted, declined] }
        received_at: { type: string, format: date-time }
    OrderDetails:
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            created_at: { type: string, format: date-time }
            subtotal_amount_1000: { type: integer }
            source: { type: string, enum: [socket, graphql] }
            items:
              type: array
              items:
                type: object
                properties:
                  product_id: { type: string }
                  name: { type: string }
                  quantity: { type: integer }
                  price_amount_1000: { type: integer }
                  price: { type: number }
                  currency: { type: string }
                  image_url: { type: string }
                  variant: { type: string }
    OrderReceivedEvent:
      type: object
      description: Dados de `order.received`.
      properties:
        order_id: { type: string }
        message_id: { type: string }
        wa_message_id: { type: string }
        chat: { type: string }
        seller: { type: string }
        item_count: { type: integer }
        total_amount_1000: { type: integer }
        total: { type: number }
        currency: { type: string }
        title: { type: string }
        note: { type: string }
        status: { type: string }
        push_name: { type: string }
        timestamp: { type: string, format: date-time }
    BusinessProfileUpdatedEvent:
      type: object
      description: Dados de `business.profile_updated`.
      properties:
        fields: { type: array, items: { type: string, enum: [description, address, email, websites, location, categories, hours] } }
        cleared: { type: array, items: { type: string }, description: "Os campos removidos com `clear`." }
        profile: { $ref: "#/components/schemas/BusinessProfile" }
        source: { type: string, enum: [api] }
        timestamp: { type: string, format: date-time }
    ChannelMessageEvent:
      type: object
