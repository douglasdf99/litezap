  call.ended:
    post:
      summary: Chamada encerrada
      x-slug: call-ended
      x-litezap-milestone: M7
      x-zapi: Webhook de chamadas
      description: |
        A chamada terminou; sai uma vez por chamada. `missed: true` quando tocou sem ninguém atender e
        não foi rejeitada. `reason`: `caller_hangup` (tocou sem atender até quem ligou desistir),
        `accepted_elsewhere` (atendida no celular ou em outro aparelho da conta; sai logo depois de
        `call.accepted`, no atendimento: o aparelho vinculado não é avisado do fim da conversa),
        `ended` (encerrada depois de atendida), `rejected` (por `calls.auto_reject`),
        `rejected_by_peer` (o outro lado rejeitou e nenhum fim chegou em 5 segundos), `timeout`
        (nenhum sinal em 2 minutos) ou outro motivo enviado pelo WhatsApp. O "reject" que um aparelho
        hospedado do WhatsApp (`hosted.lid`, aparelho 99) manda logo após toda oferta é ignorado.
      x-related: [call.received, call.accepted]
      x-fields:
        - [call_id, string, "Id da chamada."]
        - [chat, string, "Chat de quem ligou, ou o grupo."]
        - [caller, string, "JID de quem ligou."]
        - [reason, string, "Motivo do fim (opcional)."]
        - [missed, boolean, "Chamada perdida (opcional)."]
        - [timestamp, string, "Quando terminou."]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Envelope" }
            example: { id: evt_9c4f2a8e6b1d3075, type: call.ended, version: 1, instance_id: inst_7f3a9c2e5b1d4086, timestamp: "2026-10-18T10:09:00.000Z", data: { call_id: 7D1A3F9B2E5C, chat: 5511999999999@s.whatsapp.net, caller: 5511999999999@s.whatsapp.net, media: audio, reason: timeout, missed: true, timestamp: "2026-10-18T10:09:00Z" } }
      responses:
        "2XX": { description: Qualquer 2xx confirma a entrega. }
