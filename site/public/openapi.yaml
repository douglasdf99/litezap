      description: |
        URL da foto de perfil de um contato ou grupo (CDN do WhatsApp; expira depois de um tempo) e seu id.
        Com `download=1` devolve o JPEG, baixado pelo worker (pelo proxy da instância) e guardado em cache
        por 1h. Sem foto, ou foto escondida pela privacidade do contato: `404 not_found` (nunca 502).
        Consulta o WhatsApp: gasta a cota de consultas de contato (30/min, 1000/dia); a URL fica em cache
        por 10 min.
      parameters:
        - name: preview
          in: query
