                  key_id: { type: string, description: "Só com chave de API (marco 11)." }
                  scopes: { type: array, items: { type: string }, description: "Só com chave de API." }
              examples:
                instancia:
                  summary: Token de instância
                  value: { admin: false, instance_id: inst_7f3a9c2e5b1d4086 }
                admin:
