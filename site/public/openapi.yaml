  /v1/instances/{id}/presence/subscribe:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Eventos em tempo real]
      operationId: subscribePresence
      x-litezap-milestone: M7
      x-zapi: "Status do chat (presença)"
      x-litezap-notes: "Exige presence.online, que silencia as notificações do celular."
      summary: Assinar presença de um contato
      x-litezap-scope: instancia
      description: |
        Pede ao WhatsApp as mudanças de online/offline (e visto por último, se o contato mostra) de um
        contato; chegam como `chat.presence` com `state` `online`/`offline`. Exige
        `presence.online` nas settings (`409 presence_offline`). Até 20 assinaturas por minuto e 200 por dia por
        instância (`429 rate_limited`); recusada com `403 sending_suspended` enquanto o operador suspende
        envios. Valem até a conexão cair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: "Número com DDI ou JID de contato (grupos não têm presença)." }
            example: { to: "5511999999999" }
      responses:
        "204": { description: Assinado. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }

  /v1/instances/{id}/groups:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Grupos]
      operationId: listGroups
      x-litezap-milestone: M8
      x-zapi: "Buscar grupos"
      summary: Listar grupos
      x-litezap-scope: instancia
      description: Grupos em que o número está, com configurações e número de participantes (sem a lista de participantes; use `GET /groups/{jid}`).
      responses:
        "200":
          description: Grupos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    post:
      tags: [Grupos]
      operationId: createGroup
      x-litezap-milestone: M8
      x-zapi: "Criar grupo"
      x-litezap-events: [group.updated]
      x-litezap-notes: "Criar grupos com desconhecidos é gatilho de banimento: cota diária e participantes só conhecidos."
      summary: Criar grupo
      x-litezap-scope: instancia
      description: |
        Cria um grupo com até 10 participantes iniciais (número com DDI ou JID). Só entram pessoas que já
        têm conversa no log da instância ou que a consulta de números confirma no WhatsApp (gasta a cota
        de `check-numbers`); as demais voltam em `results` com `not_on_whatsapp` ou `unknown_contact`, sem
        chegar ao WhatsApp. Conta na cota `settings.groups.max_creates_per_day` (padrão 3) e os
        participantes nas cotas de adição (e no intervalo de 10s entre lotes); acima, `429 rate_limited`. A
        cota só volta se a requisição não chegou ao WhatsApp. Com envios suspensos pelo operador,
        `403 sending_suspended`. Com `parent`, o grupo nasce dentro da comunidade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroup" }
            example: { name: "Equipe", participants: ["5511999999999"], description: "Avisos da equipe", settings: { announce: false } }
      responses:
        "201":
          description: Grupo criado e resultado por participante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateGroupResult" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "429": { $ref: "#/components/responses/GroupRateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /v1/instances/{id}/groups/{jid}:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }, { $ref: "#/components/parameters/GroupJID" }]
    get:
      tags: [Grupos]
      operationId: getGroup
      x-litezap-milestone: M8
      x-zapi: "Metadata do grupo"
      summary: Metadados do grupo
      x-litezap-scope: instancia
      description: Nome, descrição, dono, configurações e participantes (com `admin` e `super_admin`). Participantes vêm com o JID de telefone quando conhecido e o `lid`.
      responses:
        "200":
          description: Grupo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/GroupForbidden" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
    patch:
      tags: [Grupos]
      operationId: updateGroup
      x-litezap-milestone: M8
      x-zapi: "Atualizar nome / descrição / configurações do grupo"
      x-litezap-events: [group.updated]
      summary: Alterar grupo
      x-litezap-scope: instancia
      description: |
        Muda nome, descrição (`""` remove) e configurações, nessa ordem; para na primeira falha (as
        anteriores ficam). As configurações podem vir soltas ou dentro de `settings`. Responde com o grupo
        depois das mudanças. Com o grupo `locked`, só admins mudam os dados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroup" }
            example: { name: "Novo nome", settings: { locked: true, ephemeral_seconds: 86400 } }
      responses:
        "200":
          description: Grupo depois das mudanças.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/GroupForbidden" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }

  /v1/instances/{id}/groups/{jid}/photo:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }, { $ref: "#/components/parameters/GroupJID" }]
