openapi: 3.1.0
info:
  title: LiteZap API
  version: "0.4.0"
  summary: API de WhatsApp não oficial, open source, que roda local, no seu servidor ou na nuvem.
  description: |
    Referência da API REST do motor LiteZap (até o marco 11): instâncias e pareamento, envio com fila
    persistente e visível, recebimento, chats, contatos, verificação de números, mídia, proxy por
    instância, grupos e comunidades, perfil e privacidade, status, canais, etiquetas, atendente IA,
    plataforma (chaves de API, links de pareamento, lote), webhooks assinados, eventos em tempo real por
    SSE e servidor MCP em `/mcp`. Os eventos entregues por webhook estão descritos na seção `webhooks`
    deste arquivo.

    Autenticação: `Authorization: Bearer <token>`. O token admin acessa tudo; o token de instância
    (prefixo `lzi_`) só acessa as rotas da própria instância; uma chave de API (prefixo `lzk_`, marco 11)
    acessa só as rotas dos seus escopos (`read`, `send`) numa instância. Tokens e chaves podem ter
    allowlist de IP.

    Erros seguem sempre o envelope `{"error":{"code","message","retryable"}}`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8787
    description: Padrão local (listen_addr)
  - url: https://api.seu-dominio.com
    description: Self-hosted atrás de proxy reverso com TLS
security:
  - bearer: []
tags:
  - name: Instâncias
    description: Criar, listar, controlar e apagar instâncias (um número de WhatsApp cada).
    x-slug: instancias
    x-intro: |
      Uma instância é um número de WhatsApp conectado ao LiteZap, com token próprio, configurações de
      envio e um processo worker dedicado. Criar, listar, apagar e rotacionar token exigem o token admin;
      as demais ações aceitam o token da própria instância.

      As ações de ciclo de vida respondem logo depois de disparadas: acompanhe o estado com
      `GET /v1/instances/{id}` ou pelo evento `instance.status`. Os estados estão em
      [Instâncias e estados](/docs/conceitos/instancias/).
    x-concept: /docs/conceitos/instancias/
  - name: Pareamento
    description: Conectar o número por QR code ou código de pareamento por telefone.
    x-slug: pareamento
    x-intro: |
      Uma instância nova (ou deslogada) fica em `qr_pending` até ser pareada. Há dois caminhos: escanear o
      QR em WhatsApp > Aparelhos conectados, ou pedir um código e digitá-lo no celular. Os dois também
      chegam como eventos (`instance.qr` e `instance.pair_code`), úteis para mostrar o QR numa tela sua
      sem polling.
    x-concept: /docs/quickstart/
  - name: Configurações
    description: Ritmo, rampa, janela de envio, fuso e proxy de cada instância.
    x-slug: configuracoes
    x-intro: |
      Cada instância herda os `instance_defaults` da configuração do servidor e guarda só os campos que
      você alterar. As configurações controlam a [fila e o ritmo](/docs/conceitos/fila-e-ritmo/), a
      [rampa](/docs/conceitos/rampa/), a [janela de envio](/docs/conceitos/janela-de-envio/) e o
      [proxy](/docs/conceitos/proxy/). `proxy_url` e `unsafe_pacing` exigem o token admin.
    x-concept: /docs/conceitos/fila-e-ritmo/
  - name: Mensagens
    description: Envio pela fila persistente, consulta de status e controle da fila.
    x-slug: mensagens
    x-intro: |
      Todo envio entra numa fila persistente por instância e sai no ritmo configurado, respeitando a
      carência pós-conexão, a janela de envio, a rampa e a verificação de número. O envio responde `202`
      na hora, ou espera o resultado com `?wait=true`. Os campos de cada tipo estão em
      [Tipos de mensagem](/docs/api/mensagens/tipos/).
    x-concept: /docs/conceitos/fila-e-ritmo/
  - name: Chats
    description: Chats e histórico do log de mensagens, marcar como lido.
    x-slug: chats
    x-intro: |
      O LiteZap guarda um log local de tudo o que a instância envia e recebe, inclusive o histórico
      sincronizado no pareamento. Chats e histórico vêm desse log, com paginação por cursor, sem consultar
      o WhatsApp a cada chamada. Use o `jid` que aparece em `GET /chats` nas rotas `/chats/{jid}/...`.
    x-concept: /docs/conceitos/identificadores/
  - name: Contatos
    description: Contatos conhecidos pela sessão do WhatsApp.
    x-slug: contatos
    x-intro: |
      Contatos vêm da sessão do WhatsApp guardada pelo worker (agenda sincronizada e nomes de perfil). As
      rotas consultam o worker, então a instância precisa estar rodando.
    x-concept: /docs/conceitos/identificadores/
  - name: Números
    description: Verificar se números têm WhatsApp.
    x-slug: numeros
    x-intro: |
      Confere se números têm WhatsApp e devolve o JID que o WhatsApp usa (no Brasil, com ou sem o 9º
      dígito). A fila já faz essa verificação antes do primeiro envio a cada número; este endpoint serve
      para conferir contatos pontuais, com cache e cota diária.
    x-concept: /docs/conceitos/verificacao-de-numeros/
  - name: Grupos
    description: Criar e administrar grupos, participantes, convites e pedidos de entrada.
    x-slug: grupos
    x-intro: |
      Gestão dos grupos em que o número está (marco 8). As rotas são síncronas (até 30 segundos) e a
      instância precisa estar conectada. Operações com participantes devolvem um resultado por pessoa:
      uma falha nunca derruba o lote.

      Adicionar desconhecidos em grupos é um dos gatilhos de banimento mais rápidos. Por isso só são
      adicionadas pessoas que já conversam com o número ou que a consulta de números confirma no
      WhatsApp, no máximo 10 por requisição, com 10 segundos entre lotes e cotas por hora e por dia
      (`settings.groups`). Criar grupos e entrar por link também têm cota diária.
    x-concept: /docs/guias/grupos/
  - name: Comunidades
    description: Criar comunidades e vincular grupos a elas.
    x-slug: comunidades
    x-intro: |
      Uma comunidade é um grupo "pai" que reúne grupos; ao criá-la, o WhatsApp cria sozinho o grupo de
      avisos. Nome, descrição, configurações, link e participantes da comunidade usam as rotas de
      [Grupos](/docs/api/grupos/) com o JID dela.
    x-concept: /docs/guias/grupos/
  - name: Mídia
    description: Baixar mídia recebida e gerar URLs assinadas temporárias.
    x-slug: midia
    x-intro: |
      Mídia recebida é baixada sob demanda na primeira leitura e guardada em `data/media/`. Para repassar
      um arquivo a outro serviço sem entregar seu token, gere uma URL assinada que vale 1 hora.
    x-concept: /docs/conceitos/midia/
  - name: Atendente IA
    description: Hook de agente (externo ou embutido) e o Atendente LiteZap — agentes treinados com o contexto do negócio.
    x-slug: atendente-ia
    x-intro: |
      O hook de agente entrega cada mensagem recebida a um atendente de IA e envia a resposta pela fila normal
      (ritmo, janela, rampa, suspensão), com pausa quando um humano responde, proteção contra loop e um chat por
      vez. O destino é a sua URL (`target: url`, POST assinado) ou o **Atendente LiteZap** embutido
      (`target: builtin`): a IA roda dentro do motor, com agentes por instância (modo vendedor, facilitador de
      pedido, SDR/agendamento ou suporte), base de conhecimento, transcrição de áudio, imagens para o modelo e
      resposta em voz opcional. O provedor (Anthropic ou OpenAI-compatível) e as chaves são do admin; as chaves
      ficam cifradas e nunca voltam na API. O passo a passo está em [Atendente IA](/docs/guias/atendimento-ia/).
    x-concept: /docs/guias/atendimento-ia/
  - name: Agentes
    description: Agentes LiteZap — o Claude operando o WhatsApp com as ferramentas do LiteZap, dentro de permissões e limites.
    x-slug: agentes
    x-intro: |
      Um agente roda um loop de *tool use*: o modelo chama as ferramentas do LiteZap (as mesmas do MCP,
      executadas dentro do motor, com as mesmas validações) até concluir a tarefa. Cada agente tem
      **instruções**, **grupos de permissão** (`ler` só lê a conversa do gatilho; `ler_outros_chats`,
      `responder_no_chat`, `enviar_outros_chats`, `etiquetas`, `grupos`, `midia`), um **modo** (`aprovacao`,
      o padrão: cada escrita vira um rascunho que alguém aprova; `autonomo`; `sugerir`: só notas) e
      **limites** por execução (8 passos, 3 destinatários distintos, 5 envios, 10 escritas, 3 mudanças em
      grupos). O motor aplica as regras, não só o prompt: um envio para outro chat sem
      `enviar_outros_chats` é recusado. Todo envio passa pela fila (ritmo, janela, rampa).

      O gatilho "mensagem nova" usa o hook de agente com `target: "agents"` (um por vez por chat, pausa
      quando um humano responde, proteção contra loop). Há também "Executar agora" e o simulador, que
      nunca executa escritas. O provedor (Anthropic ou OpenAI-compatível com function calling) e os limites
      de gasto são os do [Atendente IA](/docs/guias/atendimento-ia/), configurados pelo admin. Guia em
      [Agentes](/docs/guias/agentes/).
    x-concept: /docs/guias/agentes/
  - name: Webhooks
    description: Cadastrar endpoints que recebem eventos assinados, com retry e dead-letter.
    x-slug: webhooks
    x-intro: |
      Um webhook recebe por `POST` cada evento que combina com os filtros dele, assinado com HMAC-SHA256.
      Entregas ficam numa tabela (outbox), sobrevivem a restarts e são repetidas por até 24 horas; depois
      vão para a dead-letter, de onde podem ser reenviadas. Com token admin o webhook pode ser global
      (todas as instâncias) ou de uma instância; com token de instância é sempre da própria instância.

      Payloads de cada evento estão no [catálogo de eventos](/docs/eventos/) e a verificação da assinatura
      em [Verificar assinatura](/docs/eventos/assinatura/).
    x-concept: /docs/guias/webhooks/
  - name: Eventos em tempo real
    description: Streams Server-Sent Events por instância e global.
    x-slug: sse
    x-intro: |
      Os mesmos eventos dos webhooks, ao vivo por Server-Sent Events, sem precisar de um servidor público.
      Não há replay: eventos de quando o cliente estava desconectado não voltam (para isso, use webhooks).
    x-concept: /docs/guias/sse/
  - name: MCP
    description: Servidor Model Context Protocol para assistentes de IA.
    x-slug: mcp
    x-intro: |
      O LiteZap expõe as mesmas operações da API como ferramentas MCP, para assistentes de IA (Claude,
      ChatGPT e outros) lerem conversas e enviarem mensagens pelo seu número, sempre pela mesma fila e com as
      mesmas proteções. O endpoint fala o protocolo MCP (JSON-RPC sobre streamable HTTP), não REST: use um
      cliente MCP. A lista de ferramentas e a configuração dos clientes estão em [MCP e IA](/docs/mcp/).
    x-concept: /docs/mcp/
  - name: Perfil e privacidade
    description: Nome, recado e foto da conta, configurações de privacidade e bloqueios.
    x-slug: perfil-e-privacidade
    x-intro: |
      O perfil e a privacidade valem para a conta toda: o celular mostra o mesmo que a API. Nome e recado
      seguem os limites do WhatsApp (25 e 139 caracteres); a foto é recortada no centro e reduzida a
      640x640 (JPEG). Bloquear um contato vale também no celular.
    x-concept: /docs/conceitos/instancias/
  - name: Status
    description: Publicar status (stories), ver os dos contatos e responder.
    x-slug: status
    x-intro: |
      Status de texto, imagem ou vídeo (marco 10). Os destinatários são os da privacidade do status do
      celular: o WhatsApp não permite escolher por envio. Publicar passa pela fila de envio (ritmo,
      janela, rampa) e tem teto de 10 por dia por instância. Os status dos contatos ficam no log e saem
      no evento opt-in `status.received`.
    x-concept: /docs/conceitos/limites/
  - name: Canais
    description: Seguir, ler, reagir, criar e publicar em canais (newsletters).
    x-slug: canais
    x-intro: |
      Canais são listas públicas de mão única (marco 10). Seguir e deixar de seguir têm limite de 3 por
      minuto, 10 por hora e 30 por dia; criar, 2 por dia; reagir, 30 por minuto. Publicar só como dono ou
      admin, pela fila de envio, até 20 publicações por dia. Editar o canal, apagar, listar inscritos e buscar no diretório não existem no
      whatsmeow.
    x-concept: /docs/conceitos/limites/
  - name: Etiquetas e Business
    description: Etiquetas e perfil comercial de contas WhatsApp Business.
    x-slug: business
    x-intro: |
      Só contas WhatsApp Business (em conta pessoal, `409 business_account_required`). As etiquetas vêm do
      celular pelo app state e cada mudança sai em `label.updated`. O perfil comercial pode ser lido e
      editado (descrição, endereço, localização, e-mail, sites, categorias e horário; marco 12, aguardando
      validação num número Business real); cada edição sai em `business.profile_updated`. Para remover um
      campo, use `clear` (a localização e o horário só saem assim). Catálogo e pedidos estão em
      [Catálogo e pedidos](/docs/api/catalogo/).
    x-concept: /docs/conceitos/instancias/
  - name: Catálogo e pedidos
    description: Ler catálogos do WhatsApp Business, enviar produtos e ler pedidos.
    x-slug: catalogo
    x-intro: |
      Fase 1 do catálogo (marco 12): só leitura. O catálogo do próprio número (ou o catálogo público de
      outra empresa, por `jid`) vem do serviço GraphQL que o WhatsApp Web usa, pela proxy da instância, com
      cache de 5 minutos. Produtos são enviados como mensagem `type: "product"` (pela fila). Pedidos feitos
      pelo carrinho chegam como mensagem `order` e no evento `order.received`. Criar, editar ou apagar
      produtos e coleções **não** é oferecido: no WhatsApp isso exige um token de conta de anúncios obtido
      por um fluxo não documentado, com risco para o número. Veja o guia
      [Catálogo e pedidos](/docs/guias/catalogo-e-pedidos/).
    x-concept: /docs/guias/catalogo-e-pedidos/
  - name: Operação
    description: Saúde do processo, prontidão e identidade do token.
    x-slug: operacao
    x-intro: |
      Rotas para monitoramento e orquestradores. São públicas quando o servidor escuta em loopback e
      exigem o token admin em qualquer outro endereço.
    x-concept: /docs/self-hosted/observabilidade/
  - name: Plataforma
    description: Recursos para parceiros e multi-instância — lote, chaves de API com escopo, links de pareamento e uso.
    x-slug: plataforma
    x-intro: |
      Rotas para quem oferece WhatsApp a clientes (SaaS, revendas, agências) — marco 11. Etiquete as
      instâncias para filtrá-las e operar em lote, crie chaves de API só de leitura ou só de envio para
      entregar a terceiros, gere um link de pareamento hospedado (o cliente escaneia o QR numa página do
      seu servidor, sem ver token nenhum) e consulte o uso de cada instância.

      Renomear, etiquetar e restringir IPs fica em [Editar instância](/docs/api/instancias/editar-instancia/);
      filtros e paginação em [Listar instâncias](/docs/api/instancias/listar-instancias/). O passo a passo
      está no guia [Multi-instância e parceiros](/docs/guias/multi-instancia/).
    x-concept: /docs/guias/multi-instancia/

paths:
  /v1/instances:
    post:
      tags: [Instâncias]
      operationId: createInstance
      x-litezap-milestone: M1
      x-zapi: "Criar instância (parceiros)"
      x-litezap-events: [instance.status]
      summary: Criar instância
      x-litezap-scope: admin
      description: |
        Cria a instância e já sobe o worker dela (o estado passa de `created` a `starting` e depois
        `qr_pending`). O token da instância aparece **uma única vez** nesta resposta; o servidor guarda
        só o hash. A resposta leva `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Nome livre para identificar a instância. }
            example: { name: "atendimento" }
      responses:
        "201":
          description: Instância criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceCreated" }
              example:
                instance:
                  id: inst_7f3a9c2e5b1d4086
                  name: atendimento
                  state: starting
                  created_at: "2026-10-17T13:45:00Z"
                  updated_at: "2026-10-17T13:45:00Z"
                token: lzi_Q2hhdmUtZGUtZXhlbXBsby1uYW8tdXNl
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Instâncias]
      operationId: listInstances
      x-litezap-milestone: M1
      x-zapi: "Listar instâncias (parceiros)"
      summary: Listar instâncias
      x-litezap-scope: admin
      description: |
        Lista as instâncias em ordem de criação. Sem `limit`, devolve todas (como antes do marco 11). Com
        `limit`, pagina: siga `next_cursor` até ele não vir mais. Os filtros (marco 11) se combinam.
      parameters:
        - { name: state, in: query, description: "Um ou mais estados separados por vírgula (`connected,qr_pending`).", schema: { type: string } }
        - { name: tag, in: query, description: "Só instâncias com esta etiqueta.", schema: { type: string } }
        - { name: q, in: query, description: "Trecho do nome ou do id (sem diferenciar maiúsculas).", schema: { type: string } }
        - { name: limit, in: query, description: "Itens por página (1 a 500). Omitido: todas, sem paginação.", schema: { type: integer, minimum: 1, maximum: 500 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: As instâncias (uma página, com `limit`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items: { $ref: "#/components/schemas/Instance" }
                  next_cursor: { type: string, description: "Presente quando há próxima página (só com `limit`)." }
              example:
                instances:
                  - id: inst_7f3a9c2e5b1d4086
                    name: atendimento
                    state: connected
                    phone: "5511999999999"
                    tags: [vip]
                    ip_allowlist: []
                    created_at: "2026-10-17T13:45:00Z"
                    updated_at: "2026-10-17T13:47:12Z"
                next_cursor: MjAyNi0xMC0xN1QxMzo0NTowMC4wMDAwMDAwMDBafGluc3RfN2YzYTljMmU1YjFkNDA4Ng
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
    get:
      tags: [Instâncias]
      operationId: getInstance
      x-litezap-milestone: M1
      x-zapi: "Status da instância / Dados da instância"
      summary: Consultar instância
      x-litezap-scope: instancia
      description: Estado atual e número conectado. Os estados mudam de forma assíncrona; use esta rota para acompanhar (polling) até haver eventos (marco 3).
      responses:
        "200":
          description: A instância.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }
              example:
                id: inst_7f3a9c2e5b1d4086
                name: atendimento
                state: connected
                phone: "5511999999999"
                created_at: "2026-10-17T13:45:00Z"
                updated_at: "2026-10-17T13:47:12Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    patch:
      tags: [Instâncias]
      operationId: updateInstance
      x-litezap-milestone: M11
      x-zapi: "Renomear instância"
      summary: Editar instância
      x-litezap-scope: instancia
      description: |
        Renomeia a instância e define etiquetas e a allowlist de IP do token dela. Só os campos enviados
        mudam. `name` aceita o token da própria instância; `tags` e `ip_allowlist` exigem o token admin.

        - `tags`: até 20, cada uma com 1 a 40 caracteres (letras minúsculas, dígitos e `_ . : -`); são
          guardadas em minúsculas e sem repetição. Servem para filtrar `GET /instances` e para operações em lote.
        - `ip_allowlist`: IPs ou CIDRs (até 100). Vazio (`[]`) libera qualquer endereço. Fora da lista, o
          token da instância recebe `403 forbidden` em todas as rotas (inclusive `/mcp`). Atrás de proxy
          reverso, configure `trusted_proxies` no servidor, senão o IP visto é o do proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                tags: { type: array, items: { type: string } }
                ip_allowlist: { type: array, items: { type: string }, description: "IPs ou CIDRs." }
            example: { name: "Loja Centro", tags: [vip, sp], ip_allowlist: ["203.0.113.7", "10.0.0.0/8"] }
      responses:
        "200":
          description: A instância atualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }
              example:
                id: inst_7f3a9c2e5b1d4086
                name: Loja Centro
                state: connected
                phone: "5511999999999"
                tags: [vip, sp]
                ip_allowlist: ["203.0.113.7/32", "10.0.0.0/8"]
                created_at: "2026-10-17T13:45:00Z"
                updated_at: "2026-10-18T09:00:00Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    delete:
      tags: [Instâncias]
      operationId: deleteInstance
      x-litezap-milestone: M1
      x-zapi: "Apagar instância (parceiros)"
      x-litezap-events: [instance.status]
      x-litezap-notes: "Apaga sessão, mídia, fila e histórico da instância. Não há como desfazer."
      summary: Apagar instância
      x-litezap-scope: admin
      description: |
        Faz logout (melhor esforço, até 15s, libera o aparelho no celular), para o worker e apaga a sessão,
        a mídia e a fila da instância. É a única saída para uma instância `banned`. Pode levar ~20s.
      responses:
        "204": { description: Apagada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/start:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: startInstance
      x-litezap-milestone: M1
      x-zapi: "Reiniciar"
      x-litezap-events: [instance.status]
      summary: Iniciar worker
      x-litezap-scope: instancia
      description: Sobe o worker de uma instância `stopped`, `failed` ou `logged_out` (nesse caso volta a `qr_pending`). Responde assim que o worker é disparado; a instância devolvida pode ainda mostrar o estado anterior.
      responses:
        "200": { $ref: "#/components/responses/InstanceOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "503": { $ref: "#/components/responses/ShuttingDown" }
  /v1/instances/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: stopInstance
      x-litezap-milestone: M1
      x-zapi: "(sem equivalente)"
      x-litezap-events: [instance.status]
      summary: Parar worker
      x-litezap-scope: instancia
      description: Para o worker e leva a instância a `stopped` (a sessão fica salva; `start` reconecta sem QR). Uma instância parada não sobe sozinha no próximo boot.
      responses:
        "200": { $ref: "#/components/responses/InstanceOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
  /v1/instances/{id}/restart:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: restartInstance
      x-litezap-milestone: M1
      x-zapi: "Reiniciar"
      x-litezap-events: [instance.status]
      summary: Reiniciar worker
      x-litezap-scope: instancia
      description: Para e sobe o worker de novo. Responde assim que o novo worker é disparado.
      responses:
        "200": { $ref: "#/components/responses/InstanceOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "503": { $ref: "#/components/responses/ShuttingDown" }
  /v1/instances/{id}/logout:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: logoutInstance
      x-litezap-milestone: M1
      x-zapi: "Desconectar"
      x-litezap-events: [instance.status]
      x-litezap-notes: "Depois do logout o número precisa ser pareado de novo."
      summary: Desconectar número
      x-litezap-scope: instancia
      description: Desloga a sessão do WhatsApp (o aparelho some da lista no celular) e leva a instância a `logged_out`. Para usar de novo, `start` e parear outra vez.
      responses:
        "200": { $ref: "#/components/responses/InstanceOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/app-state/resync:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: resyncAppState
      x-litezap-milestone: v0.1.1
      x-zapi: "(sem equivalente)"
      summary: Ressincronizar o app state
      x-litezap-scope: admin
      description: |
        Reparo da cópia local do app state (estado das conversas, agenda, etiquetas) quando o log mostra
        `mismatching LTHash` ou ações pela API respondem `409`: apaga a versão, o hash e os MACs locais de cada
        coleção e baixa a coleção de novo do WhatsApp, uma de cada vez. Sem corpo, as cinco coleções. O estado que
        volta é gravado sem `chat.updated`. Veja
        [App state fora de sincronia](/docs/guias/solucao-de-problemas/#app-state-fora-de-sincronia-mismatching-lthash).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                collections:
                  type: array
                  maxItems: 5
                  items: { type: string, enum: [critical_block, critical_unblock_low, regular_low, regular_high, regular] }
            example: { collections: [critical_unblock_low, regular_high] }
      responses:
        "200":
          description: Resultado por coleção; `ok` quando todas ressincronizaram.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        ok: { type: boolean }
                        version_before: { type: integer }
                        version_after: { type: integer }
                        error: { type: string }
                        lenient:
                          type: boolean
                          description: A ressincronização estrita falhou num patch antigo do servidor cujo LT-hash não confere e a coleção foi aceita sem essa verificação nas versões de `skipped_patch_versions` (as mutações delas foram verificadas). As sincronizações seguintes voltam a ser estritas.
                        skipped_patch_versions: { type: array, items: { type: integer } }
              example: { ok: true, collections: [{ name: critical_unblock_low, ok: true, version_before: 48, version_after: 52, lenient: true, skipped_patch_versions: [49] }] }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/token/rotate:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Instâncias]
      operationId: rotateToken
      x-litezap-milestone: M1
      x-zapi: "(sem equivalente)"
      x-litezap-notes: "O token antigo deixa de valer na hora: atualize suas integrações antes."
      summary: Rotacionar token da instância
      x-litezap-scope: admin
      description: Gera um novo token de instância; o anterior deixa de valer na hora. O novo token aparece só nesta resposta.
      responses:
        "200":
          description: Novo token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
              example: { token: lzi_Tm92by10b2tlbi1kZS1leGVtcGxv }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/qr:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Pareamento]
      operationId: getQR
      x-litezap-sample: { query: { format: png }, binary: qr.png }
      x-litezap-milestone: M1
      x-zapi: "Pegar QRCode / QRCode imagem"
      x-litezap-events: [instance.qr]
      summary: Obter QR code
      x-litezap-scope: instancia
      description: |
        QR atual para escanear em WhatsApp > Aparelhos conectados. O código muda a cada poucos segundos:
        busque de novo se expirar. Só responde enquanto a instância está `qr_pending`.
      parameters:
        - name: format
          in: query
          required: false
          description: "`png` devolve a imagem (320×320); omitido devolve o texto do QR em JSON."
          schema: { type: string, enum: [png] }
      responses:
        "200":
          description: Código do QR (JSON) ou imagem PNG.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
              example: { code: "2@kQ3x...,Zm9v...,YmFy...,MQ==" }
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/NotPairing" }
  /v1/instances/{id}/pair-phone:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Pareamento]
      operationId: pairPhone
      x-litezap-milestone: M1
      x-zapi: "Conectar com telefone"
      x-litezap-events: [instance.pair_code]
      summary: Parear por código
      x-litezap-scope: instancia
      description: |
        Alternativa ao QR: gera um código para digitar no celular (Aparelhos conectados > Conectar com
        número de telefone). Só vale enquanto a instância está `qr_pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "Número do aparelho com DDI e DDD (10 a 15 dígitos)." }
            example: { phone: "5511999999999" }
      responses:
        "200":
          description: Código de pareamento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
              example: { code: "ABCD-EFGH" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/NotPairing" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /v1/instances/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Configurações]
      operationId: getSettings
      x-litezap-milestone: M2
      x-zapi: "Configurações da fila"
      summary: Ler configurações
      x-litezap-scope: instancia
      description: Configurações efetivas (padrões da config + overrides da instância). A senha do `proxy_url` vem mascarada.
      responses:
        "200":
          description: Configurações efetivas.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
              example:
                min_interval_ms: 3000
                jitter_ms: 2000
                max_per_minute: 20
                typing_simulation: true
                ramp: { enabled: true, start_per_day: 50, end_per_day: 150, days: 14 }
                send_window: { start: "08:00", end: "20:00" }
                timezone: ""
                unsafe_pacing: false
                proxy_url: ""
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    put:
      tags: [Configurações]
      operationId: updateSettings
      x-litezap-milestone: M2
      x-zapi: "Atualizar configurações da fila / Configurar proxy"
      x-litezap-notes: "Baixar os pisos de ritmo com unsafe_pacing ou desligar rampa e janela aumenta o risco de banimento."
      summary: Alterar configurações
      x-litezap-scope: instancia
      description: |
        Atualização parcial: campos ausentes mantêm o valor atual. `proxy_url` e `unsafe_pacing` exigem o
        token admin (`403 forbidden` com token de instância). Pisos: `min_interval_ms` ≥ 1000 e
        `max_per_minute` ≤ 60, salvo `unsafe_pacing`. `send_window` com `start` e `end` vazios libera
        qualquer horário. `"proxy_url": ""` volta ao `default_proxy_url`. Trocar o proxy reinicia o worker.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
            example:
              min_interval_ms: 5000
              ramp: { enabled: true }
              send_window: { start: "09:00", end: "18:00" }
              timezone: America/Sao_Paulo
      responses:
        "200":
          description: Configurações efetivas depois da alteração.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    post:
      tags: [Mensagens]
      operationId: sendMessage
      x-litezap-sample: { query: { wait: "true" } }
      x-litezap-milestone: M2
      x-zapi: "Enviar texto, imagem, áudio, vídeo, documento, reação"
      x-litezap-events: [message.sent, message.status]
      x-litezap-notes: "Instância desconectada não perde a mensagem: ela espera na fila até expires_after. Volume alto para contatos frios é o principal gatilho de banimento; veja Boas práticas."
      summary: Enviar mensagem
      x-litezap-scope: instancia
      description: |
        Valida e grava a mensagem na fila persistente da instância. Sem `wait`, responde `202` com
        `status: queued`. Com `?wait=true`, espera o resultado por até `timeout` (padrão `30s`, no máximo
        `2m`): `200` quando enviada, erro quando falhou, ou `202` com o status atual (`queued`/`in_flight`)
        se o tempo acabar; a mensagem continua na fila.

        Tipos: `text`, `image`, `video`, `audio` (`media.ptt: true` = mensagem de voz), `document`,
        `reaction`. `to` aceita número com DDI (10 a 15 dígitos) ou JID (`@s.whatsapp.net`, `@g.us`,
        `@lid`). Mídia por `media.url` (o servidor baixa, IPs privados bloqueados) ou `media.base64`.
        Limites: imagem 16MB, vídeo/áudio 64MB, documento 100MB, corpo 140MB, texto 64KB.

        Idempotência: `client_message_id` (até 128 caracteres) repetido devolve a mesma mensagem;
        repetido com outro conteúdo responde `409 conflict`.
      parameters:
        - name: wait
          in: query
          description: "`true` espera o envio terminar (modo síncrono)."
          schema: { type: string, enum: ["true"] }
        - name: timeout
          in: query
          description: "Duração Go (`30s`, `90s`, `2m`). Padrão `30s`, teto efetivo `2m`. Só com `wait=true`."
          schema: { type: string, example: 30s }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
            examples:
              texto:
                summary: Texto com idempotência
                value: { to: "5511999999999", type: text, text: "Olá! Seu pedido saiu para entrega.", client_message_id: "pedido-123" }
              imagem:
                summary: Imagem por URL
                value: { to: "5511999999999", type: image, caption: "Comprovante", media: { url: "https://exemplo.com/comprovante.jpg" } }
              voz:
                summary: Áudio como mensagem de voz (base64)
                value: { to: "5511999999999", type: audio, media: { base64: "T2dnUwACAAAAAAAA...", mime: "audio/ogg; codecs=opus", ptt: true } }
              documento:
                summary: Documento
                value: { to: "5511999999999", type: document, caption: "Segue o boleto", media: { url: "https://exemplo.com/boleto.pdf", file_name: "boleto.pdf" } }
              reacao:
                summary: Reação
                value: { to: "5511999999999", type: reaction, reaction: { message_id: "msg_a41c9e07d2b35f68", emoji: "👍" } }
      responses:
        "200":
          description: Enviada (com `?wait=true`). Traz `wa_message_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example:
                id: msg_a41c9e07d2b35f68
                client_message_id: pedido-123
                wa_message_id: 3EB0A1B2C3D4E5F6A7B8C9
                chat: 5511999999999@s.whatsapp.net
                from_me: true
                source: api
                type: text
                text: "Olá! Seu pedido saiu para entrega."
                status: sent
                timestamp: "2026-10-17T13:50:03Z"
        "202":
          description: Na fila (`queued`) ou em envio (`in_flight`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example:
                id: msg_a41c9e07d2b35f68
                client_message_id: pedido-123
                chat: 5511999999999@s.whatsapp.net
                from_me: true
                source: api
                type: text
                text: "Olá! Seu pedido saiu para entrega."
                status: queued
                timestamp: "2026-10-17T13:50:00Z"
        "400": { $ref: "#/components/responses/SendBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/SendConflict" }
        "410": { $ref: "#/components/responses/MessageExpired" }
        "413": { $ref: "#/components/responses/MediaTooLarge" }
        "422": { $ref: "#/components/responses/MediaFetchFailed" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "503": { $ref: "#/components/responses/BusyOrShuttingDown" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /v1/instances/{id}/messages/search:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Mensagens]
      operationId: searchMessages
      x-litezap-milestone: v0.1.1
      x-zapi: "(sem equivalente)"
      summary: Buscar mensagens
      x-litezap-scope: instancia
      description: |
        Busca full-text (SQLite FTS5) no histórico guardado pelo LiteZap: texto, legendas e nome de arquivo de
        documentos. Todas as palavras precisam aparecer (como prefixo a partir de 2 caracteres; acentos e maiúsculas são ignorados);
        aspas e operadores digitados valem como texto. Mensagens apagadas para todos e reações ficam de fora;
        o que a retenção, a limpeza de conversa ou a remoção da instância apagam sai do índice. Mais novas
        primeiro, com `snippet` (as palavras encontradas entre « e »). Só lê o log local: nada vai ao WhatsApp.
        Depois da atualização, as mensagens antigas são indexadas em segundo plano (das mais novas para as mais
        antigas); enquanto isso `index_complete` é `false`.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 200 }, description: "Palavras a buscar." }
        - { name: chat, in: query, schema: { type: string }, description: "Só este chat (JID ou número)." }
        - { name: from, in: query, schema: { type: string }, description: "`me` (enviadas por este número) ou o remetente (número ou JID)." }
        - { name: after, in: query, schema: { type: string, format: date-time }, description: "Só depois deste instante (RFC 3339)." }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Só antes deste instante (RFC 3339)." }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string }, description: "`next_cursor` da página anterior." }
        - { name: include_deleted, in: query, schema: { type: string, enum: ["true"] }, description: "Também busca nas conversas que o usuário apagou (por padrão, as mensagens até o apagamento ficam de fora, como em `GET /chats`)." }
      responses:
        "200":
          description: Resultados, mais novos primeiro.
          content:
            application/json:
              schema:
                type: object
                required: [messages, index_complete]
                properties:
                  messages:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Message"
                        - type: object
                          properties:
                            snippet: { type: string, description: "Trecho com as palavras encontradas entre « e »." }
                  next_cursor: { type: string, description: Ausente na última página. }
                  index_complete: { type: boolean, description: "false enquanto as mensagens antigas ainda estão sendo indexadas." }
              example: { messages: [{ id: msg_2f8a, wa_message_id: 3EB0C431D5A1, chat: 5511999990000@s.whatsapp.net, sender: 5511999990000@s.whatsapp.net, from_me: false, source: contact, type: text, text: "Pode mandar o orçamento?", status: received, timestamp: "2026-10-23T10:00:00Z", snippet: "Pode mandar o «orçamento»?" }], index_complete: true }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/messages/{msg_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - name: msg_id
        in: path
        required: true
        description: "`id` devolvido no envio (`msg_...`) ou id de uma mensagem do log."
        schema: { type: string }
    get:
      tags: [Mensagens]
      operationId: getMessage
      x-litezap-milestone: M2
      x-zapi: "(sem equivalente; status chega por webhook)"
      summary: Consultar mensagem
      x-litezap-scope: instancia
      description: |
        Status de um envio: `queued`, `in_flight`, `sent`, `delivered`, `read`, `played` ou `failed` (com `error`
        no formato `codigo: detalhe` e `attempts`). Também aceita o id de uma mensagem recebida do log.
      responses:
        "200":
          description: A mensagem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              examples:
                entregue:
                  value:
                    id: msg_a41c9e07d2b35f68
                    wa_message_id: 3EB0A1B2C3D4E5F6A7B8C9
                    chat: 5511999999999@s.whatsapp.net
                    from_me: true
                    source: api
                    type: text
                    text: "Olá!"
                    status: delivered
                    timestamp: "2026-10-17T13:50:03Z"
                falhou:
                  value:
                    id: msg_0c5e8b2f9a7d4613
                    chat: 5511888888888@s.whatsapp.net
                    from_me: true
                    source: api
                    type: text
                    text: "Olá!"
                    status: failed
                    attempts: 0
                    error: "invalid_number: number is not on WhatsApp"
                    timestamp: "2026-10-17T13:51:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Mensagens]
      operationId: editEvent
      x-litezap-milestone: v0.1.1
      x-zapi: "Editar evento"
      x-litezap-events: [message.edited]
      summary: Editar ou cancelar evento
      x-litezap-scope: instancia
      description: |
        Muda um evento deste número (nome, descrição, horários, local, link de chamada, acompanhantes) ou o
        cancela (`canceled: true`; `false` restaura), para todos do chat. Campos ausentes mantêm o valor; string
        vazia limpa `description`, `end_time` e `join_link`; `location: {}` remove o local. Diferente de textos,
        eventos continuam editáveis depois de 15 minutos. A edição é cifrada com a chave do evento, como o
        WhatsApp envia (`EVENT_EDIT`). Vai pela fila; aceita `?wait=true`. Só eventos: textos se editam com
        `type: edit` em `POST /messages`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              additionalProperties: false
              properties:
                event:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    start_time: { type: string, format: date-time }
                    end_time: { type: string }
                    location: { type: object }
                    join_link: { type: string }
                    extra_guests_allowed: { type: boolean }
                    canceled: { type: boolean }
                    client_message_id: { type: string }
            example: { event: { canceled: true } }
      responses:
        "200": { description: Enviada., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "202": { description: Na fila., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/queue:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Mensagens]
      operationId: listQueue
      x-litezap-sample: { query: { status: queued } }
      x-litezap-milestone: M6
      x-zapi: Fila
      summary: Listar a fila
      x-litezap-scope: instancia
      description: |
        Itens da fila de envio da instância, do mais antigo ao mais novo. Sem `status`, lista o que ainda
        não saiu (`queued` e `in_flight`); `?status=` filtra por `queued`, `in_flight`, `sent`, `failed`
        ou `all`. Pagina por `next_cursor`.
      parameters:
        - name: status
          in: query
          description: "`queued`, `in_flight`, `sent`, `failed` ou `all`. Omitido: `queued` e `in_flight`."
          schema: { type: string, enum: [queued, in_flight, sent, failed, all] }
        - name: limit
          in: query
          description: Itens por página. Padrão 50, máximo 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Uma página da fila.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  next_cursor: { type: string, description: Ausente na última página. }
              example:
                items:
                  - id: msg_a41c9e07d2b35f68
                    chat: 5511999999999@s.whatsapp.net
                    from_me: true
                    source: api
                    type: text
                    text: "Seu pedido saiu para entrega!"
                    status: queued
                    timestamp: "2026-10-17T13:50:00Z"
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
    delete:
      tags: [Mensagens]
      operationId: clearQueue
      x-litezap-milestone: M6
      x-zapi: Apagar fila
      summary: Esvaziar a fila
      x-litezap-scope: instancia
      x-litezap-events: [message.status]
      description: |
        Cancela de uma vez todos os itens `queued` da instância; os `in_flight` (sendo enviados agora)
        terminam normalmente. Cada item cancelado termina como `failed` com
        `error: "canceled: queue cleared by the API"` e sai `message.status` `failed`. Útil antes de
        reconectar uma instância que ficou parada com mensagens velhas na fila. Continua permitido com o
        envio suspenso pelo operador.
      responses:
        "200":
          description: Quantos itens foram cancelados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  canceled: { type: integer }
              example: { canceled: 12 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }

  /v1/instances/{id}/queue/{msg_id}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - name: msg_id
        in: path
        required: true
        description: "Id do item da fila (`msg_...`)."
        schema: { type: string }
    delete:
      tags: [Mensagens]
      operationId: cancelQueued
      x-litezap-milestone: M6
      x-zapi: Apagar mensagem da fila
      summary: Cancelar item da fila
      x-litezap-scope: instancia
      x-litezap-events: [message.status]
      description: |
        Remove um item ainda `queued` sem enviar: ele termina como `failed` com
        `error: "canceled: removed from the queue by the API"`, o arquivo de mídia preparado é apagado e
        sai `message.status` `failed`. Um item `in_flight` (sendo enviado agora) ou já terminado responde
        `409 conflict`.
      responses:
        "200":
          description: O item cancelado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
              example:
                id: msg_a41c9e07d2b35f68
                chat: 5511999999999@s.whatsapp.net
                from_me: true
                source: api
                type: text
                text: "Seu pedido saiu para entrega!"
                status: failed
                error: "canceled: removed from the queue by the API"
                timestamp: "2026-10-17T13:50:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: o item já está sendo enviado (`in_flight`) ou terminou."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: { code: conflict, message: "the message is in_flight and can no longer be removed from the queue", retryable: false } }

  /v1/instances/{id}/chats:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Chats]
      operationId: listChats
      x-litezap-milestone: M2
      x-zapi: "Pegar chats"
