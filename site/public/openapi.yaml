  /v1/instances/{id}/contacts:
    parameters: [{ $ref: "#/components/parameters/InstanceID" }]
    get:
      tags: [Contatos]
      operationId: listContacts
      x-litezap-milestone: M2
      x-zapi: "Pegar contatos"
      summary: Listar contatos
      x-litezap-scope: instancia
      description: Contatos da sessão do WhatsApp (consulta o worker; a instância precisa estar rodando).
      responses:
        "200":
          description: Contatos ordenados por JID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items: { $ref: "#/components/schemas/Contact" }
              example:
                contacts:
                  - jid: 5511999999999@s.whatsapp.net
                    name: Maria Souza
                    push_name: Maria
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    post:
      tags: [Contatos]
      operationId: saveContact
      x-litezap-milestone: v0.1.1
      x-zapi: "Adicionar contatos"
      summary: Salvar contato na agenda
      x-litezap-scope: instancia
      description: |
        Salva (ou renomeia) um contato na agenda da conta. Um número que não está no log é antes verificado
        (gasta a cota do `check-numbers`; sem WhatsApp responde `422 invalid_number`) e o contato é salvo com o
        JID que o WhatsApp devolve.
        Sincroniza com a agenda: o contato vai para a agenda do WhatsApp desta conta pelo app state (celular e
        aparelhos vinculados passam a mostrar o nome) e, com `save_on_phone` (padrão `true`), também para a
        agenda do próprio celular (app Contatos). Use só para contatos que você quer de fato na agenda do
        aparelho; nunca para importar listas. Limite de 10 mudanças por minuto e 200 por dia por instância.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, first_name]
              additionalProperties: false
              properties:
                phone: { type: string, description: "Número com DDI (ou JID `…@s.whatsapp.net`)." }
                first_name: { type: string, maxLength: 64 }
                last_name: { type: string, maxLength: 64 }
                save_on_phone: { type: boolean, default: true, description: "Também salva na agenda do celular." }
            example: { phone: "5511999990000", first_name: Ana, last_name: Teste }
      responses:
        "200":
          description: Salvo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jid: { type: string }
                  lid: { type: string }
                  first_name: { type: string }
                  full_name: { type: string }
                  save_on_phone: { type: boolean }
              example: { jid: 5511999990000@s.whatsapp.net, first_name: Ana, full_name: Ana Teste, save_on_phone: true }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "422": { description: "`invalid_number`: o número não tem WhatsApp." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/contacts/{jid}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - $ref: "#/components/parameters/ChatJID"
    get:
      tags: [Contatos]
      operationId: getContact
      x-litezap-milestone: M2
      x-zapi: "Metadata do contato"
      summary: Consultar contato
      x-litezap-scope: instancia
      responses:
        "200":
          description: O contato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
              example:
                jid: 5511999999999@s.whatsapp.net
                name: Maria Souza
                push_name: Maria
                business_name: Loja da Maria
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    delete:
      tags: [Contatos]
      operationId: removeContact
      x-litezap-milestone: v0.1.1
      x-zapi: "Remover contatos"
      summary: Remover contato da agenda
      x-litezap-scope: instancia
      description: |
        Remove o contato da agenda da conta (mutação `REMOVE` do app state, como o WhatsApp Web; o celular e os
        aparelhos vinculados acompanham). A conversa e as mensagens continuam. Aceita número ou JID
        `…@s.whatsapp.net`. Mesmo limite de mudanças de `POST /contacts`.

        **Desligado por padrão** até a revalidação num aparelho real: responde `403 feature_disabled` sem
        `experimental_app_state_writes: true` na configuração do servidor.
      responses:
        "204": { description: Removido. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InstanceNotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }

  /v1/instances/{id}/chats/{jid}:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - $ref: "#/components/parameters/ChatJID"
    get:
      tags: [Chats]
      operationId: getChat
      x-litezap-milestone: M9
      x-zapi: "Metadata do chat"
      summary: Consultar chat
      x-litezap-scope: instancia
      description: |
        Um chat do log com o estado do app state do WhatsApp (arquivado, fixado, silenciado, marcado como
        não lido). Com o worker rodando, o estado é antes reconciliado com a cópia local do worker, que
        inclui o sync inicial (sem eventos).
      responses:
        "200":
          description: O chat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
              example: { jid: 5511999999999@s.whatsapp.net, name: Maria, is_group: false, last_message_at: "2026-10-18T10:00:00Z", unread_count: 0, archived: false, pinned: true, muted: true, muted_until: "2026-10-18T18:00:00Z", unread: false }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InstanceConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    patch:
      tags: [Chats]
      operationId: updateChat
      x-litezap-milestone: M9
      x-zapi: "Arquivar chat / Fixar chat / Silenciar chat / Ler chats / Expiração do chat"
      summary: Arquivar, fixar, silenciar ou marcar como (não) lido
      x-litezap-scope: instancia
      x-litezap-events: [chat.updated]
      description: |
        Muda o chat pelo app state do WhatsApp: o celular e os outros aparelhos acompanham (nada é enviado
        ao contato). Os campos são aplicados na ordem `unread`, `archived`, `pinned`, `muted`; uma falha
        para ali. `unread: false` também manda os recibos de leitura. Só chats que estão no log. O WhatsApp
        permite 3 chats fixados (`409 pin_limit`); arquivar desafixa. Logo depois de parear, até o celular
        mandar as chaves, responde `409 app_state_not_synced`. `disappearing` (`off`, `24h`, `7d`, `90d`)
        muda as mensagens temporárias e, diferente dos outros campos, é visto pelo contato (ou pelo grupo);
        é aplicado por último. O padrão para conversas novas é `default_disappearing_seconds` em
        `PATCH /privacy`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatPatch" }
            example: { muted: true, mute_seconds: 28800 }
      responses:
        "200":
          description: O chat depois da mudança.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
    delete:
      tags: [Chats]
      operationId: deleteChat
      x-litezap-milestone: M9
      x-zapi: "Deletar chat"
      summary: Apagar chat
      x-litezap-scope: instancia
      x-litezap-events: [chat.updated]
      description: |
        Apaga a conversa no WhatsApp (celular e aparelhos vinculados). O log do LiteZap mantém as mensagens:
        o chat sai de `GET /chats` até chegar mensagem nova e `GET /chats/{jid}/messages` continua
        funcionando.
      parameters:
        - name: delete_media
          in: query
          schema: { type: string, enum: ["1"] }
          description: "`1` também apaga a mídia da conversa no celular."
      responses:
        "204": { description: Apagado. }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/chats/{jid}/clear:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - $ref: "#/components/parameters/ChatJID"
    post:
      tags: [Chats]
      operationId: clearChat
      x-litezap-milestone: v0.1.1
      x-zapi: "Limpar chat"
      summary: Limpar conversa
      x-litezap-scope: instancia
      x-litezap-events: [chat.updated]
      description: |
        **Destrutivo, não dá para desfazer.** Limpa as mensagens da conversa no WhatsApp desta conta (celular
        e aparelhos vinculados, pelo app state, como "Limpar conversa" no app) e apaga essas mensagens do log
        do LiteZap, com as mídias baixadas. A conversa continua na lista; o contato não é afetado e mantém
        as dele. `keep_starred: true` mantém as favoritas (no WhatsApp e no log); `delete_media: true`
        também apaga as mídias da conversa da galeria do celular. Mensagens ainda na fila de envio não são
        apagadas. O corpo é opcional. Uma limpeza feita no celular só gera `chat.updated` com
        `cleared: true` (o log mantém as mensagens). Limite de 10 limpezas por minuto e 100 por dia por instância
        (`429 rate_limited`). Teste antes numa conversa só com mensagens de teste.

        **Desligado por padrão** até a revalidação num aparelho real: responde `403 feature_disabled` sem
        `experimental_app_state_writes: true` na configuração do servidor.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keep_starred: { type: boolean, default: false, description: "Mantém as mensagens favoritas." }
                delete_media: { type: boolean, default: false, description: "Também apaga as mídias da conversa no celular." }
            example: { keep_starred: true }
      responses:
        "200":
          description: Conversa limpa.
          content:
            application/json:
              schema:
                type: object
                required: [chat, deleted_messages]
                properties:
                  chat: { $ref: "#/components/schemas/Chat" }
                  deleted_messages: { type: integer, description: Mensagens apagadas do log do LiteZap. }
              example: { chat: { jid: 5511999990000@s.whatsapp.net, name: Maria, is_group: false, last_message_at: "2026-10-23T10:00:00Z", unread_count: 0, archived: false, pinned: false, muted: false, unread: false }, deleted_messages: 42 }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/messages/{msg_id}/event-response:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - { name: msg_id, in: path, required: true, schema: { type: string }, description: "Id LiteZap do evento (`GET /chats/{jid}/messages`)." }
    post:
      tags: [Mensagens]
      operationId: respondEvent
      x-litezap-milestone: v0.1.1
      x-zapi: "Responder evento"
      x-litezap-events: [message.event_response]
      summary: Responder evento
      x-litezap-scope: instancia
      description: |
        Responde um evento do chat (nosso ou de um contato) com `going`, `not_going` ou `maybe`; quem está no
        chat vê a resposta. A resposta é cifrada com a chave do evento (como um voto de enquete): eventos
        recebidos antes do pareamento não podem ser respondidos (`event_secret_missing`). `extra_guests` (até
        20) só com `going` num evento que permite acompanhantes. Vai pela fila; aceita `?wait=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              additionalProperties: false
              properties:
                response: { type: string, enum: [going, not_going, maybe] }
                extra_guests: { type: integer, minimum: 0, maximum: 20 }
                client_message_id: { type: string }
            example: { response: going }
      responses:
        "200": { description: Enviada., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "202": { description: Na fila., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`event_canceled`: o evento foi cancelado." }
  /v1/instances/{id}/messages/{msg_id}/poll-vote:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - { name: msg_id, in: path, required: true, schema: { type: string }, description: "Id LiteZap da enquete (`GET /chats/{jid}/messages`)." }
    post:
      tags: [Mensagens]
      operationId: votePoll
      x-litezap-milestone: v0.1.1
      x-zapi: "Votar em enquete"
      x-litezap-events: [message.poll_vote]
      summary: Votar em enquete
      x-litezap-scope: instancia
      description: |
        Vota numa enquete do chat (nossa ou de um contato), trocando o voto anterior deste número; `options`
        são os nomes das opções escolhidas (até o `selectable` da enquete) e uma lista vazia retira o voto.
        O voto é cifrado com a chave da enquete: enquetes recebidas antes do pareamento não podem ser votadas
        (`poll_secret_missing`). Fica em `poll.votes` como `me` (o mesmo voto feito pelo celular conta uma
        vez) e entra em `poll.results`. Vai pela fila; aceita `?wait=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [options]
              additionalProperties: false
              properties:
                options: { type: array, items: { type: string } }
                client_message_id: { type: string }
            example: { options: ["12h"] }
      responses:
        "200": { description: Enviado., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "202": { description: Na fila., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instances/{id}/messages/{msg_id}/star:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
      - name: msg_id
        in: path
        required: true
        schema: { type: string }
        description: Id da mensagem no LiteZap.
    put:
      tags: [Mensagens]
      operationId: starMessage
      x-litezap-milestone: M9
      summary: Favoritar mensagem
      x-litezap-scope: instancia
      x-litezap-events: [chat.updated]
      description: "Favorita (ou desfavorita) uma mensagem do log em todos os aparelhos da conta; a mensagem passa a ter `starred: true`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starred]
              properties:
                starred: { type: boolean }
            example: { starred: true }
      responses:
        "200":
          description: A mensagem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ChatConflict" }
        "502": { $ref: "#/components/responses/WorkerError" }
        "504": { $ref: "#/components/responses/WorkerTimeout" }
  /v1/instances/{id}/contacts/{jid}/picture:
    parameters:
      - $ref: "#/components/parameters/InstanceID"
