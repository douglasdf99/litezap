syntax = "proto3";

package worker.v1;

import "worker/v1/groups.proto";

option go_package = "github.com/douglasdf99/litezap/gen/worker/v1;workerv1";

// Worker is served by `litezap worker` (one process per WhatsApp instance).
//
// Error codes of the messaging RPCs: InvalidArgument and PermissionDenied are permanent
// (the status message starts with a stable code such as "invalid_number:"),
// FailedPrecondition means the session is not logged in, Unavailable means not connected
// right now, DeadlineExceeded means WhatsApp did not answer in time; any other code is a
// retryable worker error.
//
// Media never travels inline: Send reads media_path and DownloadMedia writes dest_path,
// both inside the worker's data directory (shared with the supervisor).
service Worker {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc PairPhone(PairPhoneRequest) returns (PairPhoneResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Events streams the latest snapshot first (connection state, then QR if pairing), then
  // data events kept while nobody was subscribed, then live events. Live events always go
  // before history chunks; a connection state is never dropped.
  rpc Events(EventsRequest) returns (stream Event);

  rpc Send(SendRequest) returns (SendResponse);
  rpc SendPresence(SendPresenceRequest) returns (SendPresenceResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc DownloadMedia(DownloadMediaRequest) returns (DownloadMediaResponse);
  rpc GetContacts(GetContactsRequest) returns (GetContactsResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc CheckNumbers(CheckNumbersRequest) returns (CheckNumbersResponse);

  // Calls and presence (marco 7). RejectCall only rejects a call this worker reported
  // (unknown or finished call ids answer NotFound). SetPresence marks the account
  // available/unavailable: while available the phone stops showing notifications.
  // SubscribePresence asks for a contact's online/last seen updates.
  rpc RejectCall(RejectCallRequest) returns (RejectCallResponse);
  rpc SetPresence(SetPresenceRequest) returns (SetPresenceResponse);
  rpc SubscribePresence(SubscribePresenceRequest) returns (SubscribePresenceResponse);

  // Chats, contacts, profile and privacy (marco 9). ChatAction changes a chat through
  // the app state (the phone and other devices follow); GetChatSettings reads the local
  // copy of that state. Contact lookups reach WhatsApp; picture downloads go through the
  // instance proxy. NotFound answers "no picture" (not set or hidden by privacy).
  rpc ChatAction(ChatActionRequest) returns (ChatActionResponse);
  rpc GetChatSettings(GetChatSettingsRequest) returns (GetChatSettingsResponse);
  rpc GetProfilePicture(GetProfilePictureRequest) returns (GetProfilePictureResponse);
  rpc DownloadProfilePicture(DownloadProfilePictureRequest) returns (DownloadProfilePictureResponse);
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc GetBlocklist(GetBlocklistRequest) returns (GetBlocklistResponse);
  rpc UpdateBlocklist(UpdateBlocklistRequest) returns (GetBlocklistResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetPrivacy(GetPrivacyRequest) returns (Privacy);
  rpc SetPrivacy(SetPrivacyRequest) returns (Privacy);
}

message PingRequest {}
message PingResponse {
  string state = 1;
}

message PairPhoneRequest {
  string phone = 1; // digits only, with country code
}
message PairPhoneResponse {
  string code = 1;
}

message LogoutRequest {}
message LogoutResponse {}

message EventsRequest {}

message Event {
  oneof kind {
    ConnState conn = 1;
    QR qr = 2;
    Message message = 3;
    Receipt receipt = 4;
    HistoryChunk history = 5;
    ChatPresence chat_presence = 6;
    Presence presence = 7;
    Call call = 8;
    GroupUpdate group = 20; // marco 8 (groups.proto)
    ChatUpdate chat_update = 21; // marco 9
    // Marco 10: a contact's status (story) post, a channel post and a label change.
    Message status = 30; // chat "status@broadcast", sender: the author
    ChannelPost channel_post = 31;
    LabelUpdate label = 32;
  }
}

// ChannelPost is a message published in a channel (newsletter) the account follows.
message ChannelPost {
  string channel = 1; // "<id>@newsletter"
  int64 server_id = 2; // the channel's message number (reactions use it)
  Message message = 3; // id, type, text, media metadata (media.ref is empty)
  int64 views = 4;
  map<string, int64> reactions = 5; // emoji -> count
}

// LabelUpdate is a WhatsApp Business label change from the app state (any device,
// including the echo of this worker's own LabelAction). kind: edit | chat | message.
message LabelUpdate {
  string kind = 1;
  string label_id = 2;
  // edit
  string name = 3;
  int32 color = 4;
  bool deleted = 5;
  int32 predefined_id = 6;
  // chat | message: the chat (phone-number JID when known), the message and the new state
  string chat = 7;
  string message_id = 8;
  bool labeled = 9;
  int64 timestamp_ms = 10;
  bool full_sync = 11;
}

// StatusStyle is the look of a text status (sent to status@broadcast).
message StatusStyle {
  uint32 background_argb = 1; // 0: WhatsApp's default
  uint32 text_argb = 2;
  int32 font = 3; // ExtendedTextMessage.FontType (0 system ... 5)
}

// ChatPresence is a typing notification (only received while the account is available).
message ChatPresence {
  string chat = 1;   // chat JID (phone-number JID when known)
  string sender = 2; // who is typing (in groups, the participant)
  bool is_group = 3;
  string state = 4;  // composing | recording | paused
}

// Presence is a subscribed contact going online or offline.
message Presence {
  string jid = 1; // phone-number JID when known
  bool online = 2;
  int64 last_seen_ms = 3; // 0: unknown or hidden by the contact
}

// Call is a call signal. kind: offer (1:1 call ringing) | offer_notice (group call) |
// accept (answered on one of the account's devices) | terminate (ended) | reject
// (rejected by a device of the account or by the other side).
message Call {
  string call_id = 1;
  string kind = 2;
  string caller = 3; // call creator, phone-number JID when known
  string group = 4;  // group JID for group calls
  string media = 5;  // audio | video ("" when unknown)
  int64 timestamp_ms = 6;
  string reason = 7; // terminate reason as sent by WhatsApp
  // The signal came from one of the account's own devices (its phone or another
  // companion), not from the other party: e.g. the phone telling companions it handles
  // the call. Such a reject does not end the call.
  bool from_self = 8;
  // The signal came from a WhatsApp-hosted device (server hosted / hosted.lid): seen on
  // real calls as a reject right after every offer; not the end of the call.
  bool from_hosted = 9;
}

// ConnState.state uses the instance.State strings:
// qr_pending | connecting | connected | reconnecting | logged_out | banned | failed
message ConnState {
  string state = 1;
  string reason = 2;
  string jid = 3;
  // detail is the connect error behind a failure reason (e.g. proxy_unreachable), with
  // credentials removed; empty otherwise (marco 11).
  string detail = 4;
}

message QR {
  string code = 1;
  int64 timeout_ms = 2;
}

// Message is a received message, or one sent from another device of the account (from_me).
message Message {
  string id = 1;     // WhatsApp message id
  string chat = 2;   // chat JID; for direct chats always the phone-number JID when known
  string sender = 3; // sender JID (without device)
  bool from_me = 4;
  bool is_group = 5;
  int64 timestamp_ms = 6;
  string push_name = 7;
  // text | image | video | gif | ptv | audio | document | sticker | location | contact |
  // poll | reaction | button_reply | product | order | unknown, and the updates edit | revoke | poll_vote (not new messages:
  // target_id names the message they change).
  string type = 8;
  string text = 9;      // body, caption, reaction emoji, poll name, new text of an edit
  Media media = 10;     // set for image | video | gif | ptv | audio | document | sticker
  string reaction_to = 11; // WhatsApp id of the message a reaction refers to
  string quoted_id = 12;   // WhatsApp id of the message this one replies to
  repeated string mentions = 13; // mentioned JIDs
  Location location = 14;
  repeated ContactCard contacts = 15;
  Poll poll = 16;
  string target_id = 17; // edit | revoke | poll_vote: WhatsApp id of the changed message
  repeated bytes poll_hashes = 18; // poll_vote: SHA-256 of each selected option name
  bool forwarded = 19;
  // revoke: WhatsApp marked it as an admin deleting another member's message (groups)
  bool admin_revoke = 20;
  ButtonReply button_reply = 21; // type button_reply
  Product product = 22; // type product: a catalog product card
  Order order = 23;     // type order: an order placed from the catalog (token included)
  // The chat's disappearing messages timer the message carries (ContextInfo.expiration,
  // seconds; 0: none) and when that timer was set (unix seconds; 0 unknown).
  uint32 ephemeral_seconds = 24;
  int64 ephemeral_setting_ts = 25;
}

// Product is a catalog product as sent in a ProductMessage (prices in thousandths).
message Product {
  string product_id = 1;
  string title = 2;
  string description = 3;
  string currency = 4;
  int64 price_amount_1000 = 5;      // 0 with currency "": no price shown
  int64 sale_price_amount_1000 = 6; // 0: no sale price
  string retailer_id = 7;
  string url = 8;
  uint32 image_count = 9;
  string business_owner_jid = 10;   // <number>@s.whatsapp.net
  string body = 11;                 // caption under the card
  string footer = 12;
  bytes thumbnail = 13;             // small JPEG of the image (send)
}

// Order is a received OrderMessage. The token authorizes reading the order details; the
// supervisor keeps it server-side and never exposes it.
message Order {
  string order_id = 1;
  string token = 2;
  string seller_jid = 3;
  int32 item_count = 4;
  string title = 5;
  string message = 6;
  int64 total_amount_1000 = 7;
  string currency = 8;
  string status = 9; // inquiry | accepted | declined
}

// ButtonReply is the answer to a button, list, template or interactive message.
message ButtonReply {
  string kind = 1; // button | list | template | interactive
  string id = 2;   // selected button/row id (interactive: the flow name)
  string title = 3; // text shown for the selection
  string description = 4; // list row description; interactive: params JSON
}

message Location {
  double latitude = 1;
  double longitude = 2;
  string name = 3;
  string address = 4;
  string url = 5;
}

message ContactCard {
  string display_name = 1;
  string vcard = 2;
}

message Poll {
  string name = 1;
  repeated string options = 2;
  uint32 selectable = 3; // 0: any number of options
}

message Quote {
  string message_id = 1; // WhatsApp id of the quoted message
  bool from_me = 2;
  string sender = 3;     // author JID (received messages)
  string text = 4;       // shown in the quote preview
  // remote_jid: the quoted message is in another chat (a status: "status@broadcast")
  string remote_jid = 5;
}

message LinkPreview {
  string url = 1; // the URL as it appears in the text
  string title = 2;
  string description = 3;
  bytes thumbnail = 4; // small JPEG
}

message Media {
  string kind = 1; // image | video | audio | document | sticker
  string mime = 2;
  uint64 size = 3;
  string file_name = 4;
  uint32 seconds = 5;
  bool ptt = 6;
  bytes ref = 7; // opaque: pass back to DownloadMedia
  bool view_once = 8;
}

message Receipt {
  repeated string message_ids = 1;
  string chat = 2;
  string type = 3; // delivered | read | played
  int64 timestamp_ms = 4;
}

// HistoryChunk carries messages of one chat from a history sync.
message HistoryChunk {
  string chat = 1;
  string name = 2;
  bool is_group = 3;
  repeated Message messages = 4;
}

message SendRequest {
  string to = 1;         // chat JID
  string message_id = 2; // WhatsApp message id chosen by the supervisor (same on every retry)
  // text | image | video | gif | ptv | audio | document | sticker | location | contact |
  // poll | reaction | edit | revoke | pin | forward | product | disappearing
  string type = 3;
  // body, caption, reaction emoji ("" removes a reaction), poll name or new text of an edit
  string text = 4;
  string media_path = 5; // file with the attachment, inside the data directory
  string mime = 6;
  string file_name = 7;
  bool ptt = 8; // audio as a voice note
  string reaction_message_id = 9;
  bool reaction_from_me = 10;
  string reaction_sender = 11; // sender JID of the reacted message (groups)
  Quote quote = 12;            // reply to this message
  repeated string mentions = 13; // JIDs mentioned (the text should contain "@<number>")
  bool mention_all = 14;       // groups: mention every participant
  LinkPreview link_preview = 15;
  Location location = 16;
  repeated ContactCard contacts = 17;
  Poll poll = 18;
  // edit | revoke | pin: the target message (id, whether it is ours, its author in groups)
  string target_id = 19;
  bool target_from_me = 20;
  string target_sender = 21;
  bool unpin = 22;
  uint32 pin_seconds = 23;
  bool animated = 24; // sticker
  // forward of received media: kind (image | video | audio | document | sticker) and the
  // opaque ref from Media.ref; forwarded marks any type as forwarded.
  string forward_kind = 25;
  bytes forward_ref = 26;
  bool forwarded = 27;
  StatusStyle status_style = 28; // text to status@broadcast
  // type product (marco 12): the catalog product; media_path is its first image, uploaded
  // as a normal encrypted image (with thumbnail as its JPEG thumbnail).
  Product product = 29;
  // type disappearing (direct chats): the new disappearing messages timer of the chat, sent
  // to the contact as a protocol message (0: off).
  uint32 disappearing_seconds = 30;
  // The chat's current timer, set as ContextInfo.expiration on the message so it
  // disappears like the others of the chat (0: the chat has no timer), and when it was set.
  uint32 ephemeral_expiration = 31;
  int64 ephemeral_setting_ts = 32;
}
message SendResponse {
  string message_id = 1;
  int64 timestamp_ms = 2;
}

message SendPresenceRequest {
  string to = 1;
  string state = 2; // composing | recording | paused
}
message SendPresenceResponse {}

message MarkReadRequest {
  string chat = 1;
  string sender = 2; // required in groups: all ids must be from this sender
  repeated string message_ids = 3;
}
message MarkReadResponse {}

message DownloadMediaRequest {
  string kind = 1;
  bytes ref = 2;
  string dest_path = 3; // file to write, inside the data directory
}
message DownloadMediaResponse {
  int64 size = 1;
}

message Contact {
  string jid = 1;
  string name = 2;
  string push_name = 3;
  string business_name = 4;
}
message GetContactsRequest {}
message GetContactsResponse {
  repeated Contact contacts = 1;
}
message GetContactRequest {
  string jid = 1;
}
message GetContactResponse {
  Contact contact = 1;
  bool found = 2;
}

message CheckNumbersRequest {
  repeated string phones = 1; // digits with country code
}
message NumberStatus {
  string phone = 1;
  bool exists = 2;
  string jid = 3;
}
message CheckNumbersResponse {
  repeated NumberStatus results = 1;
}

message RejectCallRequest {
  string call_id = 1;
}
message RejectCallResponse {}

message SetPresenceRequest {
  bool available = 1;
}
message SetPresenceResponse {}

message SubscribePresenceRequest {
  string jid = 1;
}
message SubscribePresenceResponse {}

// ---- Marco 9: chats, contacts, profile and privacy ----

// ChatUpdate is a chat state change from the app state (made on any device of the
// account, including this one through ChatAction). field: archived | pinned | muted |
// unread | deleted | cleared | starred | disappearing. value is the new state (muted: muted or not,
// with muted_until_ms; unread: marked as unread; deleted/cleared: always true).
message ChatUpdate {
  string chat = 1; // phone-number JID when known
  string field = 2;
  bool value = 3;
  int64 muted_until_ms = 4; // muted: -1 forever, 0 not muted
  int64 timestamp_ms = 5;
  bool full_sync = 6;
  // starred: the message (WhatsApp id) and whether it is ours
  string message_id = 7;
  bool from_me = 8;
  // disappearing: the chat's new timer (seconds, 0 off), changed by the contact or by
  // another device of the account (from_me); timestamp_ms is when it was set.
  uint32 disappearing_seconds = 9;
}

// MessageRef identifies a message of the chat (the last one for archive/read/delete,
// the target for star).
message MessageRef {
  string id = 1; // WhatsApp id
  bool from_me = 2;
  string sender = 3; // author JID (groups)
  int64 timestamp_ms = 4;
}

message ChatActionRequest {
  string chat = 1;
  // archive | unarchive | pin | unpin | mute | unmute | read | unread | delete | clear |
  // star | unstar
  string action = 2;
  int64 mute_until_ms = 3; // mute: 0 forever
  MessageRef message = 4;  // last message (archive, read, unread, delete, clear) or target (star)
  bool delete_media = 5;   // delete, clear
  bool keep_starred = 6;   // clear: keep the starred messages
}
message ChatActionResponse {}

message GetChatSettingsRequest {
  string chat = 1;
}
message GetChatSettingsResponse {
  bool found = 1;
  bool archived = 2;
  bool pinned = 3;
  int64 muted_until_ms = 4; // -1 forever, 0 not muted
}

message GetProfilePictureRequest {
  string jid = 1; // contact or group; empty: the account itself
  bool preview = 2;
}
message GetProfilePictureResponse {
  string id = 1;
  string url = 2; // WhatsApp CDN URL (expires)
  string type = 3; // image | preview
}

message DownloadProfilePictureRequest {
  string jid = 1;
  bool preview = 2;
  string dest_path = 3; // file to write, inside the data directory
}
message DownloadProfilePictureResponse {
  string id = 1;
  int64 size = 2;
}

message GetUserInfoRequest {
  string jid = 1;
  bool business = 2; // also read the business profile (business accounts)
}
message BusinessProfile {
  string address = 1;
  string email = 2;
  repeated string categories = 3;
}
message GetUserInfoResponse {
  string jid = 1;
  string about = 2;
  string picture_id = 3;
  string verified_name = 4;
  string lid = 5;
  BusinessProfile business = 6;
}

message GetBlocklistRequest {}
message UpdateBlocklistRequest {
  string jid = 1;
  bool block = 2;
}
message GetBlocklistResponse {
  repeated string jids = 1; // phone-number JIDs when known
}

message GetProfileRequest {}
message GetProfileResponse {
  string jid = 1;
  string lid = 2;
  string push_name = 3;
  string business_name = 4;
  string platform = 5;
  string about = 6;
  string picture_id = 7;
}

message UpdateProfileRequest {
  bool set_name = 1;
  string name = 2;
  bool set_about = 3;
  string about = 4;
  string picture_path = 5; // JPEG inside the data directory
  bool remove_picture = 6;
}
message UpdateProfileResponse {
  string picture_id = 1;
}

// Privacy uses whatsmeow's names: last, online, profile, status, groupadd, readreceipts,
// calladd, messages; values all | contacts | contact_blacklist | none | match_last_seen | known.
message Privacy {
  map<string, string> settings = 1;
}
message GetPrivacyRequest {}
message SetPrivacyRequest {
  string name = 1;
  string value = 2;
  bool set_default_disappearing = 3;
  uint32 default_disappearing_seconds = 4;
}
