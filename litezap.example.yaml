# Copie para litezap.yaml. Variáveis LITEZAP_* sobrescrevem estes valores.
listen_addr: 127.0.0.1:8787
public_url: ""
data_dir: data
# admin_token: se vazio, é gerado em data/admin_token na primeira execução
worker_memory_max_mb: 512

# Proxy usado por toda instância sem settings.proxy_url própria (http://, https:// ou socks5://).
default_proxy_url: ""
# true libera media.url para IPs privados/loopback (uso local). Mantenha false em servidores.
media_allow_private_urls: false

# Webhooks: true libera entregas para IPs privados/loopback (ex.: um receptor em
# http://127.0.0.1:9000 no próprio PC). Mantenha false em servidores.
webhook_allow_private_urls: false
# Dias que as entregas concluídas e a dead-letter (entregas que falharam por 24h) ficam guardadas.
webhook_retention_days: 7
webhook_failed_retention_days: 30

# Painel web em /app/ (pede o token admin). true desliga o painel; a API continua igual.
disable_dashboard: false

# Retenção (0 = guardar para sempre): log de mensagens e cópias locais de mídia baixada.
message_retention_days: 0
media_retention_days: 0
# Watchdog de conexão zumbi (0 = desligado; ex.: 5m) e prazo total do encerramento
# (0 = fases padrão, até ~40s; ex.: 25s para caber num prazo de parada de 30s, como TimeoutStopSec=30).
zombie_timeout: 0s
shutdown_timeout: 0s

# Hospedagem gerenciada (deixe desligado no self-host; veja o README).
# ops_listen_addr: "[::]:9090"     # /healthz, /readyz e /metrics sem token (rede privada)
# operator_token: ""               # até dois, separados por vírgula (rotação)
# locked_settings: [proxy_url, unsafe_pacing]
# max_instances: 0                 # 0 = sem limite
# require_proxy: false

# Plataforma e parceiros (marco 11; vazio = desligado).
# trusted_proxies: ["127.0.0.1"]   # proxies cujo X-Forwarded-For vale para as allowlists de IP
# admin_allowed_ips: []            # IPs/CIDRs de onde o token admin é aceito
# operator_allowed_ips: []         # idem para o token do operador
# pairing_frame_ancestors: []      # origens que podem embutir /pair/ num iframe (ex.: https://app.exemplo.com)

# Padrões de envio por instância (cada instância pode sobrescrever via PUT /settings).
# Pisos: min_interval_ms >= 1000 e max_per_minute <= 60, salvo unsafe_pacing: true.
instance_defaults:
  min_interval_ms: 3000
  jitter_ms: 2000
  max_per_minute: 20
  typing_simulation: true
  ramp:
    enabled: true
    start_per_day: 50
    end_per_day: 150
    days: 14
  # Janela diária de envio no fuso abaixo; start e end vazios liberam qualquer horário.
  send_window:
    start: "08:00"
    end: "20:00"
  timezone: ""   # IANA, ex.: America/Sao_Paulo; vazio = fuso do servidor
